# Flatpak manifest for the Tailscreen GTK viewer.
#
# STATUS: structurally correct, NOT verified to build. The GNOME SDK does not
# ship a Swift toolchain, so a from-source Flatpak build needs one supplied in
# the build sandbox. See packaging/README.md for the honest state and the two
# supported build strategies (host-prebuilt bundling vs. an in-sandbox Swift
# toolchain). This manifest documents the from-source path.
#
# Build (from the repo root, once a Swift toolchain is available to the SDK):
#   flatpak install flathub org.gnome.Platform//47 org.gnome.Sdk//47
#   flatpak-builder --user --install --force-clean build-flatpak \
#       Apps/linux-gtk/packaging/flatpak/org.tailscreen.Viewer.yml
#   flatpak run org.tailscreen.Viewer
#
# Run: flatpak run org.tailscreen.Viewer [<sharer-host>]

app-id: org.tailscreen.Viewer
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: tailscreen-viewer-gtk

# The Go toolchain (to compile libtailscale.a) is available as an official
# freedesktop SDK extension. Swift is NOT — it must be provided separately
# (see README: either a swift.org toolchain unpacked into the build, or a
# prebuilt-binary variant of this manifest). PATH is extended for golang below.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  # Native display servers + GPU for the GTK4/OpenGL video surface.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # System audio playback (viewer voice + shared system audio).
  - --socket=pulseaudio
  # The tsnet transport dials the tailnet (WireGuard/DERP over UDP+TCP).
  - --share=network

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: -buildvcs=false
    # SwiftPM's systemLibrary targets resolve libtailscale.pc from here.
    PKG_CONFIG_PATH: /run/build/tailscreen-viewer-gtk/Packages/TailscaleKit

modules:
  - name: tailscreen-viewer-gtk
    buildsystem: simple
    # Network is needed at build time: SwiftPM fetches swift-cross-ui and the
    # first libtailscale build downloads Go modules.
    build-options:
      build-args:
        - --share=network
    build-commands:
      # 1. Build the patched libtailscale C archive (Go c-archive + Swift glue).
      - make -C Packages/TailscaleKit
      # 2. Build the viewer executable product only, so SwiftPM prunes to the
      #    Linux subgraph (DefaultBackend -> GtkBackend) and never tries the
      #    Windows-only WinUI backend.
      - swift build -c release --package-path Apps/linux-gtk --product tailscreen-viewer-gtk
      # 3. Install the binary + desktop entry + AppStream metadata. The icon is
      #    a placeholder: a real PNG rendered from docs/assets/app-icon.svg is a
      #    follow-up (see README). If present it is installed; otherwise the
      #    install is skipped so the build does not fail on the missing asset.
      - install -Dm755 Apps/linux-gtk/.build/release/tailscreen-viewer-gtk
        /app/bin/tailscreen-viewer-gtk
      - install -Dm644 Apps/linux-gtk/packaging/flatpak/org.tailscreen.Viewer.desktop
        /app/share/applications/org.tailscreen.Viewer.desktop
      - install -Dm644 Apps/linux-gtk/packaging/flatpak/org.tailscreen.Viewer.metainfo.xml
        /app/share/metainfo/org.tailscreen.Viewer.metainfo.xml
      - if [ -f Apps/linux-gtk/packaging/icons/org.tailscreen.Viewer.png ]; then
        install -Dm644 Apps/linux-gtk/packaging/icons/org.tailscreen.Viewer.png
        /app/share/icons/hicolor/256x256/apps/org.tailscreen.Viewer.png; fi
    sources:
      # The whole repo is the build context (submodules included). flatpak-builder
      # copies this directory into the build sandbox. Run flatpak-builder from the
      # repo root so this relative path resolves.
      - type: dir
        path: ../../../..
