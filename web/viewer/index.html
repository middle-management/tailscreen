<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailscreen</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0b0b0d; color: #e8e8ea; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; background: #000; }
  #placard { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: .5rem; padding: 2rem; background: rgba(11,11,13,.85); }
  #placard[hidden] { display: none; }
  #placard h1 { font-size: 1.25rem; margin: 0; }
  #placard p { margin: 0; color: #b8b8bd; max-width: 34rem; }
  #placard button, #bar button { font: inherit; padding: .4rem .9rem; border-radius: .4rem; border: 1px solid #3a3a40; background: #1b1b20; color: inherit; cursor: pointer; }
  #placard button { margin: .75rem auto 0; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: .5rem; padding: .5rem; background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .2s; }
  body:hover #bar, #bar:focus-within { opacity: 1; }
  #hud { position: absolute; top: .5rem; left: .5rem; margin: 0; padding: .5rem .75rem; background: rgba(0,0,0,.6); border-radius: .4rem; font: 12px/1.35 ui-monospace, monospace; white-space: pre; }
  #hud[hidden] { display: none; }
  #log { position: absolute; right: .5rem; top: .5rem; max-width: 40vw; max-height: 40vh; overflow: auto; margin: 0; font: 11px/1.3 ui-monospace, monospace; color: #8a8a90; white-space: pre-wrap; }
  #log[hidden] { display: none; }
</style>
<canvas id="stage" width="16" height="9"></canvas>
<div id="placard"><h1 id="placard-title">…</h1><p id="placard-body"></p><button id="placard-action" hidden></button></div>
<pre id="hud" hidden></pre>
<pre id="log" hidden></pre>
<div id="bar">
  <button id="btn-audio" type="button">Enable audio</button>
  <button id="btn-stats" type="button">Stats</button>
  <button id="btn-full" type="button">Full screen</button>
  <button id="btn-log" type="button">Log</button>
</div>
<script src="dist/wasm_exec.js"></script>
<script src="viewer.js"></script>
