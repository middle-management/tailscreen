name: Release (Windows)

# Builds the Windows app (Apps/windows — the swift-cross-ui/WinUI app) for both
# architectures and uploads a zip + an MSIX per arch to the GitHub Release that
# triggered the run. The Windows sibling of release-linux.yml (and release.yml,
# which does the same for the macOS .app).
#
# The build steps used to be windows-build.yml's, "copied faithfully rather
# than reinvented" — 545 lines of copy. They now come from app-windows.yml,
# which both workflows call, so there is one definition and this file supplies
# the release-shaped inputs. What that copy cost while it lasted: the arm64 leg
# of the per-push workflow never received the build stamp the release leg had,
# and shipped artifacts labelled "dev".
#
# Deliberately NOT run here, and these are POLICY rather than omissions — they
# are `false` inputs, so the difference is stated rather than implied:
#   • the probe / app-load / tsnet-node checks — those are per-push
#     diagnostics; a release build's gate is that windows-build.yml is green
#     on the commit being tagged,
#   • the .build and libtailscale caches (`use_cache: false`) — release builds
#     are cold and rare, and a cache key shared with the per-push workflow
#     would let a stale object into a shipped binary for a saving nobody
#     needs,
#   • the WinAppSDK nupkg cache — same reasoning; stage-winappsdk.sh just
#     downloads the ~80 MB nupkg.
#
# MSIX signing: SELF-SIGNED for now. make-msix.ps1 mints a throwaway cert (or
# uses the repo's stable dev cert when the TAILSCREEN_MSIX_PFX_* secrets are
# set), so the uploaded .msix installs only after the user trusts that cert —
# winget and ordinary double-click installs will reject it. SignPath (free OSS
# tier) replaces the signing step later: swap make-msix.ps1's self-sign for a
# submit to SignPath and the rest is unchanged. Until then the Summary step
# marks the MSIX as not-yet-trusted-signed, and the zip (plain unzip-and-run,
# no signature gate) is the artifact to point users at.
#
# Three triggers, mirroring release-linux.yml:
#   • release published  — the real thing
#   • pull_request labeled `build-windows-package` — an on-demand packaging
#     build for a PR, because packaging can't be a required gate (two Windows
#     runners for ~25 minutes each) but still wants to be runnable before a
#     release rather than only discovered to be broken at tag time
#   • workflow_dispatch — manual, against an existing tag
on:
  release:
    types: [published]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload assets to (e.g., v1.0.0)'
        required: true

permissions:
  contents: write   # required for `gh release upload`

jobs:
  # Its own job because a job that calls a reusable workflow can carry no steps
  # of its own, and the version derivation is real logic rather than an
  # expression. Cheap: one ubuntu runner for a few seconds.
  version:
    name: Resolve version
    # Skip every label except ours — `pull_request: [labeled]` fires for all of
    # them, and a packaging build is far too slow to run on an unrelated label.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'build-windows-package'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) tag="${{ github.event.inputs.tag }}" ;;
            release)           tag="${{ github.event.release.tag_name }}" ;;
            # A PR build has no tag; name the artifact after the PR so it's
            # obviously not a release build.
            *)                 tag="pr-${{ github.event.pull_request.number }}" ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The MSIX Identity Version must be four-part x.y.z.0 — Windows
          # reserves the fourth field for the Store, and make-msix.ps1 hard-
          # fails on anything else. Derive it from the tag: take the leading
          # numeric components (a pre-release suffix like v1.2.3-rc1 is
          # dropped — MSIX versions have no pre-release concept), pad a
          # two-part tag with .0, and fall back to 0.0.1.0 for anything
          # non-numeric (PR builds' pr-N, oddly-shaped tags) so a packaging
          # build never dies on version syntax.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            msix_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          elif [[ "$version" =~ ^([0-9]+)\.([0-9]+) ]]; then
            msix_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0.0"
          else
            msix_version="0.0.1.0"
          fi
          echo "msix_version=$msix_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version msix_version=$msix_version"

  package:
    name: Package (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # The same per-arch split as windows-build.yml: x64 on the hosted x64
        # image, arm64 NATIVELY on windows-11-arm (no cross-build — that is
        # what makes llvm-mingw + the host toolchain arrangement work). The
        # runner, the FFmpeg archive name and the vcpkg triplet all follow from
        # `arch` inside app-windows.yml.
        arch: [x64, arm64]
    uses: ./.github/workflows/app-windows.yml
    with:
      arch: ${{ matrix.arch }}
      # For a release/dispatch build, build the tag exactly. For a PR build,
      # take the PR head.
      ref: ${{ github.event_name == 'pull_request' && github.ref || needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      msix_version: ${{ needs.version.outputs.msix_version }}
      tag: ${{ needs.version.outputs.tag }}
      # See this file's header: every one of these is a deliberate release
      # policy, not an omission.
      use_cache: false
      run_probes: false
      run_load_check: false
      run_tsnet_check: false
      # The zip IS the deliverable; dist/ is what it is made of, so uploading
      # both would double the storage for one artifact.
      upload_dist: false
      zip: true
      msix: true
      verify_msix: false
      upload_to_release: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
