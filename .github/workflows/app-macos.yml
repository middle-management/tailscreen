name: macOS app

# ONE definition of "build a universal, signed, notarized Tailscreen.app".
#
# release.yml's release job and pr-notarized-build.yml used to carry that
# definition twice,
# and the two copies shared ELEVEN identical steps: Setup Go, Apply
# libtailscale patches, Build universal libtailscale.a, Build universal static
# libopus, Build universal Tailscreen binary, Assemble Tailscreen.app, Check
# signing availability, Import signing certificate, Codesign, Notarize and
# staple, Cleanup keychain. Several of them are long, subtle and hard-won — the
# aarch64-not-arm opus host triple, the otool guard against a Homebrew dylib
# creeping into the link, the find-identity dump that makes a signing failure
# debuggable from the log alone. Two copies of that is two chances to fix a
# bug in one of them.
#
# What differs between the callers is genuinely small and is now inputs: which
# ref, what version string, what the zip is called, and where the result goes
# (a GitHub Release, or a workflow artifact for a human to try).
#
# SECURITY: callers pass `secrets: inherit`. release.yml's PR path triggers on
# `pull_request` (NOT `pull_request_target`), so a fork PR gets no secrets and
# falls through to the unsigned path. Nothing here changes that: the signing
# gate is "are all five secrets non-empty", evaluated at run time.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build.
        required: true
        type: string
      tag:
        description: >-
          Release tag, when there is one. Supplies the version (minus a leading
          'v') and the zip's label unless those are given explicitly.
        required: false
        type: string
        default: ''
      version:
        description: >-
          CFBundleShortVersionString / CFBundleVersion. Derived from `tag` when
          empty. macOS wants this numeric, which is why the PR build passes an
          explicit 0.0.<pr> rather than a tag-shaped string.
        required: false
        type: string
        default: ''
      label:
        description: Middle segment of the zip name. Defaults to tag, then version.
        required: false
        type: string
        default: ''
      include_commit_in_name:
        description: Append the short commit to the zip label (PR builds do).
        required: false
        type: boolean
        default: false
      configuration:
        description: SwiftPM configuration (release for anything shippable).
        required: false
        type: string
        default: release
      sign:
        description: Codesign with the Developer ID identity, if the secrets exist.
        required: false
        type: boolean
        default: true
      notarize:
        description: >-
          Submit to notarytool and staple. Separate from `sign` because signing
          is cheap and notarization is a round trip to Apple.
        required: false
        type: boolean
        default: true
      upload_artifact:
        description: Upload the zip as a workflow artifact.
        required: false
        type: boolean
        default: false
      artifact_name:
        description: Workflow-artifact name. Defaults to the zip's basename.
        required: false
        type: string
        default: ''
      upload_to_release:
        description: >-
          `gh release upload` the zip + checksums.txt to `tag`. Needs the
          caller to grant contents: write.
        required: false
        type: boolean
        default: false
      cache:
        description: >-
          Restore libtailscale.a from cache. FALSE for anything that ships: a
          release artifact is compiled from source on the runner that ships it.
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: The resolved version string.
        value: ${{ jobs.build.outputs.version }}
      short_sha:
        description: Short commit of the built ref.
        value: ${{ jobs.build.outputs.short_sha }}
      zip_name:
        description: Name of the produced zip.
        value: ${{ jobs.build.outputs.zip_name }}
      signed:
        description: 'true when the app was signed + notarized.'
        value: ${{ jobs.build.outputs.signed }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      APP_NAME: Tailscreen
      BUNDLE_ID: se.middlemanagement.tailscreen

    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_VERSION: ${{ inputs.version }}
          IN_LABEL: ${{ inputs.label }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          version="$IN_VERSION"
          if [ -z "$version" ]; then version="${IN_TAG#v}"; fi
          if [ -z "$version" ]; then
            # Single quotes: backticks in a double-quoted bash string are
            # command substitution, so the prose spelling would RUN them.
            echo '::error::neither the version nor the tag input was supplied' >&2
            exit 1
          fi
          label="$IN_LABEL"
          if [ -z "$label" ]; then label="${IN_TAG:-$version}"; fi
          if [ "${{ inputs.include_commit_in_name }}" = "true" ]; then
            label="$label-$SHORT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "version=$version label=$label"

      # Patches + Go + the universal (arm64 + x86_64) c-archive, lipo-merged.
      # See .github/actions/bootstrap.
      - name: Bootstrap libtailscale (universal)
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: macos-universal
          cache: ${{ inputs.cache }}

      - name: Build universal static libopus
        # OpusKit links libopus. A Homebrew `libopus.dylib` is (a) host-arch
        # only — it can't satisfy the x86_64 slice of the universal build —
        # and (b) an absolute /opt/homebrew path that wouldn't exist on a
        # user's Mac. So build a *static, universal* libopus from source and
        # point pkg-config at it: the .a's right slice links into each arch
        # and nothing dynamic ships in the .app. Cross-arch autotools uses
        # `--host` so configure never executes a wrong-arch test binary.
        run: |
          set -euxo pipefail
          OPUS_VERSION=1.5.2
          curl -fsSL "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz" \
            -o /tmp/opus.tar.gz
          mkdir -p /tmp/opus-src
          tar xzf /tmp/opus.tar.gz -C /tmp/opus-src --strip-components=1
          cd /tmp/opus-src
          build_arch() {
            arch="$1"; host="$2"
            make distclean >/dev/null 2>&1 || true
            ./configure --host="$host" --disable-shared --enable-static \
              --disable-doc --disable-extra-programs \
              CFLAGS="-arch $arch -O2" LDFLAGS="-arch $arch"
            make -j"$(sysctl -n hw.ncpu)"
            cp .libs/libopus.a "/tmp/libopus-${arch}.a"
          }
          # aarch64, not arm: an `arm-*` host makes opus configure target
          # 32-bit ARM and emit GNU-syntax .S assembly that Apple's clang
          # assembler rejects; aarch64 uses NEON intrinsics instead.
          build_arch arm64 aarch64-apple-darwin
          build_arch x86_64 x86_64-apple-darwin
          PREFIX=/tmp/opus-universal
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include/opus"
          lipo -create /tmp/libopus-arm64.a /tmp/libopus-x86_64.a \
            -output "$PREFIX/lib/libopus.a"
          lipo -info "$PREFIX/lib/libopus.a"
          cp include/*.h "$PREFIX/include/opus/"
          cat > "$PREFIX/lib/pkgconfig/opus.pc" <<PC
          prefix=$PREFIX
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: opus
          Description: Opus codec (universal static, release build)
          Version: ${OPUS_VERSION}
          Libs: -L\${libdir} -lopus
          Cflags: -I\${includedir}/opus
          PC

      # Rewrite BuildInfo.commit before compiling, so Settings → About names
      # the commit instead of "dev". The grep is the point: a silently-failed
      # sed would ship an app claiming to be someone's local build, which is
      # worse than no stamp at all.
      #
      # This landed in release.yml AND pr-notarized-build.yml as two copies on
      # the same day this consolidation was written — which is the argument for
      # the consolidation in one line. `sed -i ''` is the BSD spelling and is
      # why it cannot simply be shared with the Windows stamp, which uses GNU
      # sed's `sed -i`.
      - name: Stamp the build
        run: |
          set -euo pipefail
          file=Apps/macOS/Sources/BuildInfo.swift
          short=$(git rev-parse --short HEAD)
          sed -i '' "s/static let commit = \"dev\"/static let commit = \"$short\"/" "$file"
          grep -q "static let commit = \"$short\"" "$file" \
            || { echo "build stamp did not apply — refusing to ship an app labelled 'dev'" >&2; exit 1; }
          echo "stamped $short"

      - name: Build universal Tailscreen binary
        env:
          # Prepend the universal-static opus dir so COpus's `pkgConfig:
          # "opus"` resolves it (not a Homebrew dylib); TailscaleKit
          # still supplies libtailscale.pc.
          PKG_CONFIG_PATH: /tmp/opus-universal/lib/pkgconfig:${{ github.workspace }}/Packages/TailscaleKit
          CONFIGURATION: ${{ inputs.configuration }}
        working-directory: Apps/macOS
        run: |
          set -euxo pipefail
          swift build -c "$CONFIGURATION" --arch arm64 --arch x86_64
          # With multiple --arch flags, SwiftPM emits the universal binary
          # under .build/apple/Products/<Configuration>/ — capitalised, unlike
          # the flag.
          config_dir="$(tr '[:lower:]' '[:upper:]' <<< "${CONFIGURATION:0:1}")${CONFIGURATION:1}"
          products=".build/apple/Products/${config_dir}"
          echo "PRODUCTS_DIR=Apps/macOS/${products}" >> "$GITHUB_ENV"
          lipo -info "${products}/${APP_NAME}"
          # Guard: nothing dynamic from a non-system prefix should have crept
          # into the link (a stray Homebrew opus dylib would break on users'
          # Macs). Fail loudly if otool sees one.
          if otool -L "${products}/${APP_NAME}" | grep -qi 'opus'; then
            echo "error: Tailscreen dynamically links libopus — expected static" >&2
            otool -L "${products}/${APP_NAME}" | grep -i opus >&2
            exit 1
          fi

      - name: Assemble Tailscreen.app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          APP="${APP_NAME}.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "${PRODUCTS_DIR}/${APP_NAME}" "$APP/Contents/MacOS/"
          # SwiftPM resource bundle backing `Bundle.module` (menubar PDFs,
          # WelcomeIcon, etc.). Without this the app fatals on launch with
          # "unable to find bundle named Tailscreen_Tailscreen".
          cp -R "${PRODUCTS_DIR}/${APP_NAME}_${APP_NAME}.bundle" \
            "$APP/Contents/Resources/"
          cp Apps/macOS/Resources/Tailscreen.icns "$APP/Contents/Resources/${APP_NAME}.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIconFile</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.2</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Tailscreen uses your microphone for two-way voice during screen sharing.</string>
          </dict>
          </plist>
          EOF

      - name: Check signing availability
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PW:  ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.sign }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing disabled by the caller."
            exit 0
          fi
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PW" ] \
             && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] \
             && [ -n "$NOTARY_ISSUER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not fully set (e.g. a fork PR) — building unsigned app."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign Tailscreen.app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euxo pipefail

          # Surface what's actually in the keychain so failures here are
          # debuggable from the log alone.
          echo "--- All identities in build keychain ---"
          security find-identity "$KEYCHAIN_PATH" || true
          echo "--- Valid codesigning identities (search list) ---"
          # Search across the user keychain list (build keychain + login +
          # System Roots) so the Apple Developer ID intermediate is visible
          # for chain validation. Restricting to $KEYCHAIN_PATH alone makes
          # `-v` reject the cert because the chain can't be built.
          security find-identity -v -p codesigning || true
          echo "--------------------------------------------------"

          IDENTITY_HASH="$(security find-identity -v -p codesigning \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::No valid 'Developer ID Application' codesigning identity. See identity dump above — common causes: .p12 missing private key, cert chain not trusted (Apple WWDR intermediate missing), or wrong cert type (Apple Development / Mac Developer instead of Developer ID Application)."
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --deep \
            --sign "$IDENTITY_HASH" \
            "${APP_NAME}.app"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "${APP_NAME}.app"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true' && inputs.notarize
        env:
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$APPLE_NOTARY_API_KEY_P8" | base64 --decode > "$KEY_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/${APP_NAME}-notarize.zip"
          /usr/bin/ditto -c -k --keepParent "${APP_NAME}.app" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "${APP_NAME}.app"
          xcrun stapler validate "${APP_NAME}.app"

          rm -f "$KEY_PATH" "$NOTARIZE_ZIP"

      - name: Package zip and checksums
        id: package
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -euxo pipefail
          ZIP_NAME="${APP_NAME}-${LABEL}-macOS.zip"
          /usr/bin/ditto -c -k --keepParent "${APP_NAME}.app" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > checksums.txt
          SHA256="$(awk '{print $1}' checksums.txt)"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"     >> "$GITHUB_OUTPUT"

      - name: Upload app artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload release assets
        if: inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euxo pipefail
          gh release upload "$TAG" \
            "$ZIP_NAME" \
            "checksums.txt" \
            --clobber

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
