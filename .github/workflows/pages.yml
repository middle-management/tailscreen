name: Deploy Pages

# One docs tree, two channels:
#
#   tailscreen.dev/      — docs as of the LATEST RELEASE TAG: what the builds
#                          people can download actually do.
#   tailscreen.dev/next/ — docs from main, with an "unreleased" banner and
#                          noindex: what the next release will do.
#
# So docs merge to main freely without the live site promising anything
# unreleased, and the root advances by itself the moment a release publishes —
# there is no second copy of any page and nothing to sync. A tag whose tree
# has no Jekyll site falls back to building the root from main (the pre-split
# behavior), which also keeps a bad tag from taking the site down.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the release tags are present to resolve.
          fetch-depth: 0

      - name: Resolve the latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PRE-RELEASES MUST NOT TAKE THE ROOT. The root channel is what
          # tailscreen.dev serves, so it has to track the latest STABLE
          # release; /next already carries what main says.
          #
          # Ask the API first: `releases/latest` excludes pre-releases by
          # definition, which a tag sort cannot do — a tag knows nothing about
          # the flag somebody ticked when publishing it.
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          # Fall back to a tag sort when the API is unavailable (a fork with no
          # token, a rate limit). DISCARD pre-release tags rather than merely
          # ranking them below their own stable version: `versionsort.suffix`
          # would sort v0.10.0-rc.1 under v0.10.0, but for the whole window an
          # RC exists for — after it is tagged, before the release it precedes
          # — there IS no v0.10.0, and the candidate still outranks v0.9.1 and
          # takes the root. SemVer makes this easy: a hyphen after the version
          # is the pre-release marker, so dropping every tag carrying one needs
          # no suffix list to keep in sync with what we happen to name them.
          if [ -z "$tag" ]; then
            tag=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
            echo "note: API gave no release; fell back to the tag sort"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && git cat-file -e "$tag:docs/_config.yml" 2>/dev/null; then
            echo "has_site=true" >> "$GITHUB_OUTPUT"
            echo "root channel: $tag"
          else
            echo "has_site=false" >> "$GITHUB_OUTPUT"
            echo "root channel: main (tag '$tag' has no Jekyll site)"
          fi

      - name: Extract the tag's docs
        if: steps.tag.outputs.has_site == 'true'
        run: |
          mkdir -p /tmp/current
          git archive "${{ steps.tag.outputs.tag }}" docs | tar -x -C /tmp/current

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Both builds run against main's Gemfile (BUNDLE_GEMFILE), so a tag
      # never dictates the toolchain — only the content. And both builds cd
      # INTO their source directory rather than passing -s: Jekyll only
      # auto-requires the :jekyll_plugins Gemfile group (the github-pages gem,
      # which is what activates the remote theme and layouts) when a Gemfile
      # exists in the CURRENT working directory. Built from the workspace
      # root, every page renders bare — no layout, no CSS — while the build
      # exits 0.
      - name: Build current (root) from the release tag
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
        run: |
          if [ "${{ steps.tag.outputs.has_site }}" = "true" ]; then
            cd /tmp/current/docs
          else
            cd docs
          fi
          bundle exec jekyll build -d "$GITHUB_WORKSPACE/_site"

      - name: Build next (/next) from main
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
        run: |
          cd docs
          bundle exec jekyll build -d "$GITHUB_WORKSPACE/_site/next" \
            --config _config.yml,_config_next.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
