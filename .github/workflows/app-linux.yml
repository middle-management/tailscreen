name: Linux app

# ONE definition of "build the GTK app in the swift:6.3-jammy container, prove
# it renders, and package it".
#
# build.yml's `linux-app-arm64` and release.yml's `linux-arm64` were
# the same job twice: same runner (GitHub's free ubuntu-24.04-arm), same
# multi-arch container, same apt set, same release build of product
# `tailscreen`, the same Xvfb GL YUV-readback self-test, and the same
# hand-written README.txt inside the tarball — duplicated down to its wording.
#
# What differs is the packaging tail and whether a cache may be used, and both
# are inputs.
#
# NOT covered here: release.yml's x86_64 `linux-appimage` job, which runs on a
# HOST runner with swift-actions/setup-swift and sudo apt rather than in this
# container. Folding it in is a plausible follow-up — the arm64 leg proves the
# AppImage assembles fine inside the container — but it is the job that builds
# the artifact most users download, and moving its toolchain is not a change to
# make without running it.

on:
  workflow_call:
    inputs:
      arch:
        description: "'x64' or 'arm64'. Picks the runner and the AppImage tool flavour."
        required: true
        type: string
      configuration:
        required: false
        type: string
        default: release
      ref:
        required: false
        type: string
        default: ''
      self_test:
        description: >-
          Run the headless GL YUV-readback render self-test against the built
          binary. This is what makes a leg a real gate rather than a compile
          check, so it defaults on.
        required: false
        type: boolean
        default: true
      package:
        description: "'none', 'tarball', 'appimage', or 'tarball+appimage'."
        required: false
        type: string
        default: none
      version:
        description: >-
          Release version. Empty gives the per-push artifact name
          (tailscreen-linux-<arch>.tar.gz); set gives the release naming.
        required: false
        type: string
        default: ''
      use_cache:
        description: >-
          Restore Apps/linux/.build and libtailscale.a. FALSE for release
          builds — a shipped artifact is compiled cold on the runner that ships
          it.
        required: false
        type: boolean
        default: true
      screenshots:
        description: >-
          Capture PNGs of the app's --ui-preview / --ui-preview-video chrome
          under Xvfb and upload them as an artifact.
        required: false
        type: boolean
        default: false
      artifact_name:
        required: false
        type: string
        default: ''
    outputs:
      tarball:
        description: Tarball filename, when one was produced.
        value: ${{ jobs.build.outputs.tarball }}
      appimage:
        description: AppImage filename, when one was produced.
        value: ${{ jobs.build.outputs.appimage }}

jobs:
  build:
    # GitHub's free arm64 runner for public repos, with the SAME swift:6.3-jammy
    # container as every other Linux job: the library/swift image is multi-arch
    # (amd64 + arm64, verified on Docker Hub), so the apt package set and job
    # shape stay identical across architectures and there is no
    # swift.org-tarball toolchain install to maintain.
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 40
    container: swift:6.3-jammy

    env:
      APPIMAGE_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
      PACKAGE_ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}
      # AppImage assembly tooling, pinned — see the "Install AppImage assembly
      # tools" step for what each one is and why the third is still floating.
      APPIMAGETOOL_VERSION: '1.9.1'
      LINUXDEPLOY_PLUGIN_GTK_REF: '7a3fbc31a9e5075073ff8790f26effbac5f84453'

    outputs:
      tarball: ${{ steps.pkg.outputs.tarball }}
      appimage: ${{ steps.pkg.outputs.appimage }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install GTK4 + GL + headless display + A/V + Go
        # swift-cross-ui's GtkBackend needs gtk4 (+ gobject-introspection for
        # its bindings); CGtkVideo links epoxy + gtk-4; the render self-test runs
        # under a virtual X server with Mesa software GL. The live path reuses
        # Packages/TailscreenLinuxBackends's Core (FFmpeg/ALSA/Opus) + Tsnet (→ libtailscale, hence
        # golang-go/make), though the render self-test itself needs no network.
        # libdbus + libpipewire are for the ScreenCast portal backend: the app
        # links PortalCaptureKit so it can capture a Wayland session at all,
        # and those are COMPILE-time headers as well as runtime libraries —
        # without them the C shim fails at `pipewire/pipewire.h`, long before
        # anything gets as far as linking.
        # All multi-arch in jammy. `golang-go` is still installed for the
        # `make` toolchain around it, but the Go that BUILDS libtailscale comes
        # from setup-go — jammy's apt Go is 1.18 and cannot parse the go.mod.
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libgtk-4-dev gir1.2-gtk-4.0 libgirepository1.0-dev libepoxy-dev \
            libgl1-mesa-dri xvfb xcompmgr libxtst-dev libopus-dev pkg-config \
            golang-go make gcc libc6-dev \
            libavcodec-dev libavutil-dev libasound2-dev \
            libdbus-1-dev libpipewire-0.3-dev

      - name: Install AppImage assembly tools
        # librsvg so the AppImage script renders a real icon rather than its
        # 1x1 placeholder; desktop-file-utils + file for linuxdeploy; curl to
        # fetch the tools themselves. Both linuxdeploy and appimagetool publish
        # aarch64 builds on their `continuous` releases — an earlier version of
        # the arm64 job claimed otherwise and shipped only a tarball; the claim
        # was checked and is false. The gtk plugin is an arch-neutral shell
        # script.
        #
        # All three are third-party code fetched at build time and then RUN,
        # and all three used to come from a moving ref, so a shipped release
        # was not reproducible from its own commit. Two are now pinned (job
        # `env:` above):
        #   • appimagetool → 1.9.1, which is the same commit `continuous`
        #     resolved to when this was pinned, so no build changed;
        #   • linuxdeploy-plugin-gtk → the master commit it resolved to at the
        #     same moment. It is a SHELL SCRIPT executed with the app's staging
        #     tree in its hands — the single worst thing here to leave on a
        #     branch name.
        # linuxdeploy itself is deliberately still `continuous`: unlike
        # appimagetool, its continuous build is AHEAD of its newest version tag
        # (1-alpha-20251107-1), so pinning would swap in code CI has never run.
        # That one wants a release-labelled build to prove it, not a blind edit.
        if: contains(inputs.package, 'appimage')
        run: |
          apt-get install -y --no-install-recommends \
            librsvg2-bin file desktop-file-utils curl ca-certificates
          mkdir -p "$HOME/.local/bin"
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL "$base/linuxdeploy-${APPIMAGE_ARCH}.AppImage" -o "$HOME/.local/bin/linuxdeploy"
          curl -fsSL "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/raw/${LINUXDEPLOY_PLUGIN_GTK_REF}/linuxdeploy-plugin-gtk.sh" \
            -o "$HOME/.local/bin/linuxdeploy-plugin-gtk.sh"
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            -o "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/linuxdeploy-plugin-gtk.sh" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build libtailscale (patched)
        # Go targets the host arch, so the same `host` target emits the right
        # c-archive on either runner and runner.arch keeps the two in separate
        # cache namespaces. apt's Go, like every sibling container job:
        # setup-go's tool cache doesn't apply inside a container.
        uses: ./.github/actions/bootstrap
        with:
          # setup-go, NOT the container's apt Go, and this is the one place
          # that differs from the sibling container legs. jammy ships Go 1.18,
          # which cannot even PARSE libtailscale's `go 1.25.5` directive — the
          # three-component form arrived in 1.21, along with the automatic
          # toolchain download that lets noble's 1.22 build it at all. Debian
          # 12's 1.19 fails the same way, so this is not a jammy quirk to dodge
          # by picking another base: any base old enough to give a usable glibc
          # floor is too old for this go.mod. setup-go reads the version out of
          # go.mod and installs exactly it.
          go: setup-go
          libtailscale: host
          cache: ${{ inputs.use_cache }}

      # Without this, this job compiles swift-cross-ui from scratch on every
      # run — which is what made it one of the two jobs setting build.yml's
      # whole wall clock. Shape copied from windows-build.yml's proven cache:
      # split restore/save so a failed compile still banks its objects,
      # `!cancelled()` plus a restore-ran guard because cache keys are
      # immutable, and a restore-keys prefix so a pin bump costs an incremental
      # rebuild rather than a cold one (safe here specifically because llbuild
      # tracks inputs per target).
      #
      # runner.arch AND the configuration are in the key. Either alone would
      # separate today's two callers; both are there because a shared key
      # across architectures is a bug this repo has already shipped once.
      - name: Restore the app's build directory
        id: gtk-build-cache
        if: inputs.use_cache
        uses: actions/cache/restore@v6
        with:
          path: Apps/linux/.build
          key: >-
            linux-app-build-swift6.3-jammy-${{ runner.os }}-${{ runner.arch
            }}-${{ inputs.configuration }}-${{ hashFiles('Apps/linux/Package.resolved') }}
          restore-keys: |
            linux-app-build-swift6.3-jammy-${{ runner.os }}-${{ runner.arch }}-${{ inputs.configuration }}-

      - name: Build the app
        # PKG_CONFIG_PATH resolves libtailscale.pc for the tsnet transport;
        # building the executable PRODUCT specifically prunes SwiftPM to the
        # Linux subgraph (DefaultBackend→GtkBackend) — a bare `swift build`
        # would also try to compile swift-cross-ui's Windows-only WinUI backend.
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            swift build -c ${{ inputs.configuration }} \
            --package-path Apps/linux --product tailscreen

      - name: glibc floor
        # THE PORTABILITY GATE, and the reason this job builds in jammy rather
        # than the newest image available.
        #
        # An AppImage deliberately does NOT bundle glibc — it has to match the
        # host's loader — so every glibc symbol the build binds to becomes a
        # hard requirement on whoever runs it. Built in noble, v0.10.0-rc.1
        # required GLIBC_2.38 and would not start on Debian 12 (2.36), Ubuntu
        # 22.04 LTS (2.35) or RHEL 9 (2.34): the release note said
        # "self-contained, no install step" and the app died in the loader.
        #
        # What made it un-catchable is how little it takes. The app's own floor
        # came down to ONE symbol — `fmod@GLIBC_2.38` — with everything else it
        # calls topping out at 2.34. Nothing in the source says "2.38"; the
        # number is a property of the image the compiler ran in, so it can rise
        # from a base-image bump that looks like routine maintenance. Hence a
        # number asserted here rather than a convention nobody can see.
        #
        # Raising MAX_GLIBC is a deliberate act that drops distros. Check
        # docs/install.md's table in the same commit.
        env:
          MAX_GLIBC: '2.35'
        run: |
          # POSIX sh, not bash: this job runs in a container where the default
          # shell resolves to `sh -e`, so `set -o pipefail` is an "Illegal
          # option" and the step dies before it checks anything.
          set -eu
          bin="Apps/linux/.build/${{ inputs.configuration }}/tailscreen"
          if [ ! -f "$bin" ]; then
            echo "::error::no binary at $bin to check"
            exit 1
          fi
          need="$(readelf -V "$bin" \
                  | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                  | sed 's/GLIBC_//' | sort -uV | tail -1)"
          # Assert the reading rather than the pipeline's exit status, which is
          # `tail`'s and therefore 0 even when readelf found nothing. Without
          # this an empty $need compares equal to the ceiling and the gate
          # PASSES — silence reading as success, on the one step whose whole
          # job is to notice something.
          if [ -z "$need" ]; then
            echo "::error::no GLIBC_ version symbols found in $bin"
            exit 1
          fi
          echo "highest glibc symbol required: $need (ceiling $MAX_GLIBC)"
          # sort -V puts the larger last; if that is not the ceiling, we exceeded it.
          if [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::binary requires glibc $need, above the $MAX_GLIBC ceiling."
            echo "Symbols forcing it:"
            readelf --dyn-syms -W "$bin" | grep "GLIBC_$need" | awk '{print "  " $8}' | sort -u
            exit 1
          fi

      - name: Headless render self-test (Xvfb + software GL)
        # Renders a 4-bar YUV frame through GtkVideoView, reads the pixels back,
        # and exits 0 only if the BT.709 output is correct — a CI-gated proof
        # the GL video path renders, on the exact binary this job ships. The
        # live tsnet leg is local-only (L0b).
        #
        # Assert BOTH: the process exits 0 (bad pixels → exit 3, timeout → 124)
        # AND the PASS marker was actually printed, so a "graceful" early exit
        # (window closed / init failed) that never ran the check can't
        # false-pass.
        #
        # POSIX-sh compatible: the container shell is `sh` (dash), which has no
        # `set -o pipefail`, so we avoid the pipe entirely. Redirect to a file
        # (preserves the process exit code — a pipe to `tee` would mask it) and
        # capture the status via an `if` (so `set -e` doesn't abort first)
        # before printing the log and running the two assertions.
        if: inputs.self_test
        run: |
          if timeout 90 xvfb-run -a -s "-screen 0 800x600x24" \
            env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/${{ inputs.configuration }}/tailscreen --render-self-test \
            > /tmp/gtk-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/gtk-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKVIDEO_SELFTEST result=PASS' /tmp/gtk-selftest.log

      - name: Headless annotation-overlay self-test (Xvfb + compositor)
        # The sharer-side gate, run here as well as in `linux-app` because THIS
        # arch is the reason. The overlay hands `AnnotationRasterizer`'s
        # premultiplied BGRA straight to cairo as CAIRO_FORMAT_ARGB32 with no
        # conversion, and that equivalence holds only on a LITTLE-ENDIAN host
        # — cairo names its formats by 32-bit word. aarch64 is little-endian in
        # every configuration anyone ships, so this should never fire; it costs
        # one apt package and five seconds to know rather than assume, on the
        # exact binary this job uploads.
        #
        # `xcompmgr` explicitly rather than via xvfb-run: it has to own the
        # display before the app opens it, because the overlay reads
        # `gdk_display_is_composited` once at creation and refuses (by design)
        # when there is no compositor. Same dash-compatible status handling as
        # the step above.
        if: inputs.self_test
        run: |
          Xvfb :95 -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:95 xcompmgr >/dev/null 2>&1 &
          sleep 2
          if timeout 90 env DISPLAY=:95 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/${{ inputs.configuration }}/tailscreen --overlay-self-test \
            > /tmp/overlay-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/overlay-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKOVERLAY_SELFTEST result=PASS' /tmp/overlay-selftest.log

      - name: Screenshot the hub and session chrome (Xvfb)
        # The app's own preview modes, built for exactly this: `--ui-preview`
        # seeds the hub with fake sharers and `--ui-preview-video` adds the
        # in-session view with one stroke per annotation tool — deterministic
        # chrome, no tailnet, no network. The capture is the whole 1440x900
        # virtual screen, which for an unmanaged Xvfb window means the app
        # fills the frame. `kill -0` before each capture: a crashed app would
        # otherwise produce a plausible-looking screenshot of an empty root
        # window, and absence-looks-like-success is this repo's least favourite
        # failure shape. Dash-compatible like the self-test steps above.
        if: inputs.screenshots
        run: |
          apt-get install -y --no-install-recommends imagemagick >/dev/null
          mkdir -p screenshots
          Xvfb :96 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 3
          shoot() {
            out="$1"; shift
            env DISPLAY=:96 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              Apps/linux/.build/${{ inputs.configuration }}/tailscreen "$@" &
            pid=$!
            sleep 12
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "app exited before the $out capture" >&2
              exit 1
            fi
            import -display :96 -window root "screenshots/$out"
            kill "$pid" 2>/dev/null || true
            sleep 2
          }
          shoot linux-hub.png --ui-preview
          shoot linux-session.png --ui-preview --ui-preview-video
          ls -la screenshots/

      - name: Upload screenshots
        if: inputs.screenshots
        uses: actions/upload-artifact@v7
        with:
          name: tailscreen-screenshots-linux-${{ env.PACKAGE_ARCH }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Build the AppImage
        # Same script as the x86_64 release job. The app + c-archive are
        # already built above, so the script's own build steps are incremental
        # no-ops; what runs here is the AppDir assembly + linuxdeploy. The
        # container has no FUSE, hence APPIMAGE_EXTRACT_AND_RUN.
        if: contains(inputs.package, 'appimage')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          OUTPUT: Tailscreen-${{ inputs.version }}-${{ env.APPIMAGE_ARCH }}.AppImage
        run: Apps/linux/packaging/appimage/build-appimage.sh

      - name: Stage package + checksums
        id: pkg
        if: inputs.package != 'none'
        # The launch notes are generated HERE, not copied from the repo, on
        # purpose: build.yml's `paths-ignore: '**.md'` means an artifact that
        # shipped a repo .md would be a path-filter hole — edits to it would
        # skip the job and "a missing run reads as success". Keeping the
        # artifact's inputs to the binary plus this workflow file keeps every
        # input inside the trigger paths.
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            FILE="Tailscreen-${{ inputs.version }}-linux-${PACKAGE_ARCH}.tar.gz"
          else
            FILE="tailscreen-linux-${PACKAGE_ARCH}.tar.gz"
          fi
          APPIMAGE="Tailscreen-${{ inputs.version }}-${APPIMAGE_ARCH}.AppImage"
          STAGE="dist/tailscreen-linux-${PACKAGE_ARCH}"
          mkdir -p "$STAGE"
          cp "Apps/linux/.build/${{ inputs.configuration }}/tailscreen" "$STAGE/tailscreen"
          # The string catalog rides BESIDE the binary, which is where
          # LocalizationCatalog looks (`Bundle.main.bundleURL`, i.e. the
          # executable's own directory). Shipping it is what makes the GTK app
          # speak anything but English; not shipping it is invisible in
          # testing, because the lookup degrades to the English keys rather
          # than failing — hence the hard check.
          #
          # Matched on the TARGET NAME, not the full name: SwiftPM calls it
          # `<something>_TailscreenL10n.<ext>`, derives the first half from the
          # package, and uses `.resources` off Darwin where macOS gets
          # `.bundle`. A hard-coded `TailscreenL10n_TailscreenL10n.bundle` is
          # what failed the first run of this step.
          PRODUCTS="Apps/linux/.build/${{ inputs.configuration }}"
          L10N_SRC=$(find -L "$PRODUCTS" -maxdepth 1 -type d \
            \( -name '*_TailscreenL10n.bundle' -o -name '*_TailscreenL10n.resources' \) | head -1)
          if [ -z "$L10N_SRC" ]; then
            echo "::error::no *_TailscreenL10n.{bundle,resources} in $PRODUCTS"
            ls -la "$PRODUCTS" || true
            exit 1
          fi
          cp -R "$L10N_SRC" "$STAGE/$(basename "$L10N_SRC")"

          # THE SWIFT RUNTIME RIDES ALONG, and without it the tarball does not
          # start on ANY machine. The binary's RUNPATH is
          # `/usr/lib/swift/linux:$ORIGIN`: the first entry exists only where
          # somebody installed a Swift toolchain, and no distro packages one,
          # so a tarball with no .so beside the binary resolves libswiftCore
          # nowhere. v0.10.0-rc.1 shipped exactly that — nine files, none of
          # them a library — and its README listed GTK and FFmpeg as the
          # runtime dependencies without mentioning Swift at all.
          #
          # `$ORIGIN` is already in the RUNPATH, so copying them beside the
          # binary is the whole fix; nothing needs patching. GTK, FFmpeg and
          # ALSA are deliberately NOT copied — distros ship those, and the
          # AppImage is the answer for anyone who would rather not install
          # them.
          SWIFT_RT=/usr/lib/swift/linux
          if [ ! -d "$SWIFT_RT" ]; then
            echo "::error::no Swift runtime at $SWIFT_RT to stage"
            exit 1
          fi
          cp -P "$SWIFT_RT"/*.so* "$STAGE/"
          # Assert rather than trust the glob: a silently empty copy is the
          # failure this step exists to prevent, and it looks identical to a
          # working one until somebody unpacks it on a machine without Swift.
          for lib in libswiftCore.so libFoundation.so libdispatch.so \
                     libBlocksRuntime.so libswift_Concurrency.so; do
            if [ ! -e "$STAGE/$lib" ]; then
              echo "::error::$lib missing from the staged tarball"
              ls -la "$STAGE" || true
              exit 1
            fi
          done
          echo "staged $(ls "$STAGE"/*.so* | wc -l) Swift runtime libraries"

          cat > "$STAGE/README.txt" <<EOF
          Tailscreen for Linux (${PACKAGE_ARCH})
          ============================

          Run:  ./tailscreen            (picker mode)
                ./tailscreen <host>     (dial a sharer directly)

          Keep EVERYTHING in this folder together. The *.so files are the
          Swift runtime, which no distro packages — the binary looks for them
          beside itself, so moving it out on its own will not start. The
          *_TailscreenL10n.resources folder carries the translations, and the
          app falls back to English without it. Force a language with
          TAILSCREEN_LANG=sv.

          Runtime dependencies you must have installed (Ubuntu 22.04 package
          names — this build is made on 22.04):
            libgtk-4-1 libepoxy0 libavcodec58 libavutil56 libasound2
            libopus0 mesa/OpenGL drivers

          Those are matched by SONAME, so a much newer distro may carry a
          different generation of FFmpeg (libavcodec60 and up) and not
          satisfy this build. The AppImage carries its own copies and does
          not care — prefer it unless you cannot use FUSE.

          Sign in happens in your browser on first run (tsnet interactive
          login), or export TAILSCREEN_TS_AUTHKEY. See the repository's
          Apps/linux/packaging/README.md for packaged install channels.
          EOF
          tar -C dist -czf "$FILE" "tailscreen-linux-${PACKAGE_ARCH}"
          echo "tarball=$FILE" >> "$GITHUB_OUTPUT"

          if [ -f "$APPIMAGE" ]; then
            sha256sum "$FILE" "$APPIMAGE" > "checksums-linux-${PACKAGE_ARCH}.txt"
            echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          else
            sha256sum "$FILE" > "checksums-linux-${PACKAGE_ARCH}.txt"
            echo "appimage=" >> "$GITHUB_OUTPUT"
          fi
          cat "checksums-linux-${PACKAGE_ARCH}.txt"

      # Uploaded on EVERY trigger: for a per-push or PR build it is the
      # deliverable, for a release build it is the hand-off to the caller's
      # upload job — `gh` is not installed in swift:6.3-jammy, so the release
      # upload cannot happen here.
      - name: Upload build artifact
        if: inputs.package != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || steps.pkg.outputs.tarball }}
          path: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.appimage }}
            checksums-linux-${{ env.PACKAGE_ARCH }}.txt
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: inputs.package != 'none'
        run: |
          {
            echo "## Linux package (${PACKAGE_ARCH})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            while read -r sha file; do
              echo "| \`$file\` | \`$sha\` |"
            done < "checksums-linux-${PACKAGE_ARCH}.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so a failed self-test or a failed staging step still banks the
      # compile. The product binary is excluded — relinked every build, and a
      # smaller archive survives the repo's shared 10 GB cache budget longer.
      - name: Save the app's build directory
        if: >-
          ${{ !cancelled() && inputs.use_cache
          && steps.gtk-build-cache.outcome == 'success'
          && steps.gtk-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Apps/linux/.build
            !Apps/linux/.build/**/${{ inputs.configuration }}/tailscreen
