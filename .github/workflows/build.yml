name: Build

# CI runs only on pushes to `main` (post-merge verification) and on
# pull-requests. Direct pushes to `claude/**` feature branches no longer
# trigger CI — the same branch's PR already covers it, and macOS minutes
# are 10× Linux. Doc-only edits skip CI entirely.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# A new push to the same branch cancels the previous in-flight build —
# avoids paying for runs the user no longer cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Pinned lint/format tool versions — THE ONE PLACE either is named.
#
# Both are pinned because both are style checks that grade code we did not
# change: a SwiftLint release that adds an opt-in-by-default rule, retunes an
# existing one, or changes a violation's reason string turns EVERY open PR red
# on a morning nobody touched the repo — and `lint` is a required check, so
# that is the whole merge queue. The baseline can't absorb it either: it is
# refreshed by hand (`make lint-baseline`), so a new rule is a new violation,
# not a frozen one.
#
# Bumping is a one-line change here. When bumping SWIFTLINT_VERSION, run
# `make lint-baseline` in the same commit — a version bump and a baseline
# refresh belong together, and the baseline diff is reviewable now that it is
# pretty-printed.
#
# The versions below are the ones Homebrew shipped when the pin landed
# (2026-08), i.e. this pin froze CI where it already was rather than moving it.
# ---------------------------------------------------------------------------
env:
  # https://github.com/realm/SwiftLint/releases
  SWIFTLINT_VERSION: '0.65.0'
  # https://github.com/swiftlang/swift-format/tags (603.x tracks Swift 6.3)
  SWIFT_FORMAT_VERSION: '603.0.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    # SwiftPM on Apple-silicon runners does NOT search Homebrew's
    # /opt/homebrew/lib/pkgconfig by default, so OpusKit's `pkgConfig: "opus"`
    # can't find opus.pc from `brew install opus` unless it's on
    # PKG_CONFIG_PATH. Set it job-wide (alongside the TailscaleKit dir) so
    # every build/test step resolves libopus. macos-latest is arm64, so the
    # brew prefix is /opt/homebrew.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive  # Initialize all submodules
          # Full history so the diff-coverage gate can diff against the
          # PR's base (origin/main).
          fetch-depth: 0

      # Patches + Go + libtailscale.a. `make build` below re-enters
      # `make tailscale`, which is a no-op once the archive is in place.
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host

      - name: Install libopus
        # OpusKit's COpus systemLibrary resolves libopus via pkg-config; the
        # app now links it (Opus replaced AudioToolbox AAC). The job-level
        # PKG_CONFIG_PATH points SwiftPM at brew's opus.pc.
        run: brew install opus

      - name: Build
        run: make build

      - name: Run tests (with coverage)
        # `--enable-code-coverage` writes an LLVM profdata bundle under
        # .build/<config>/codecov/. The subsequent step turns that into a
        # human-readable summary and uploads the raw profdata as an artifact.
        # PKG_CONFIG_PATH is set job-wide (libtailscale + libopus).
        working-directory: Apps/macOS
        run: swift test --enable-code-coverage

      - name: Coverage summary
        # Surface a percentage in the job log + the workflow run summary.
        # Uses `xcrun llvm-cov` which ships with Xcode — no third-party
        # service or secrets needed. Best-effort: if the profdata bundle
        # or binary path can't be located the step warns but doesn't fail
        # the build.
        if: always()
        # PKG_CONFIG_PATH (libtailscale + libopus) is set job-wide, so
        # `swift build --show-bin-path` can load the manifest's systemLibrary
        # targets; without it BUILD_BIN_PATH ends up empty, dropping coverage.
        working-directory: Apps/macOS
        run: |
          set -u
          BUILD_BIN_PATH="$(swift build --show-bin-path 2>/dev/null || echo)"
          PROFDATA="${BUILD_BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BUILD_BIN_PATH}" -maxdepth 2 -name '*.xctest' | head -n1 || true)"
          if [ -z "${XCTEST_BUNDLE}" ] || [ ! -f "${PROFDATA}" ]; then
            echo "::warning::could not locate coverage data (profdata=${PROFDATA}, xctest=${XCTEST_BUNDLE})"
            exit 0
          fi
          # On macOS the xctest bundle's binary lives at Contents/MacOS/<name>.
          XCTEST_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          if [ ! -x "${XCTEST_BIN}" ]; then
            XCTEST_BIN="$(find "${XCTEST_BUNDLE}" -type f -perm -u+x | head -n1)"
          fi
          # Exclude .build (SwiftPM checkouts) and Tests/ from the totals.
          REPORT="$(xcrun llvm-cov report \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${XCTEST_BIN}" 2>&1 || true)"
          echo "${REPORT}"
          {
            echo "## Code coverage"
            echo ""
            echo '```'
            echo "${REPORT}" | tail -n 20
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profdata
          path: |
            Apps/macOS/.build/**/codecov/default.profdata
          if-no-files-found: warn
          retention-days: 14

      - name: Diff coverage gate (warn-only)
        # Fails when < 70 % of the changed executable Sources/ lines are
        # covered, printing the uncovered file:line list. Currently
        # informational (continue-on-error: true), same convention as the
        # `format` job: observe it across a few real PRs first, then flip
        # to required.
        # TODO: drop `continue-on-error` once the gate is observed stable —
        # and when flipping, also harden the silent exit-0 paths: the
        # missing-profdata branch below warns-and-passes, and the script
        # swallows git-diff errors (see scripts/diff-coverage.sh header).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # PKG_CONFIG_PATH (libtailscale + libopus) is set job-wide.
        working-directory: Apps/macOS
        run: |
          set -u
          BUILD_BIN_PATH="$(swift build --show-bin-path 2>/dev/null || echo)"
          PROFDATA="${BUILD_BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BUILD_BIN_PATH}" -maxdepth 2 -name '*.xctest' | head -n1 || true)"
          if [ -z "${XCTEST_BUNDLE}" ] || [ ! -f "${PROFDATA}" ]; then
            echo "::warning::diff-coverage: could not locate coverage data — skipping"
            exit 0
          fi
          XCTEST_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          if [ ! -x "${XCTEST_BIN}" ]; then
            XCTEST_BIN="$(find "${XCTEST_BUNDLE}" -type f -perm -u+x | head -n1)"
          fi
          xcrun llvm-cov export -format=lcov \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${XCTEST_BIN}" > coverage.lcov
          ../../scripts/diff-coverage.sh coverage.lcov "origin/${{ github.base_ref }}" 70

  # Release-config compile check: -O + cross-module optimization + stripped
  # assert()s surface a different class of errors than debug builds, and
  # before this job they first broke on a published release. No tests, no
  # artifact — compiling clean is the point. Required (not
  # continue-on-error): a release-config compile break is always real.
  build-release:
    runs-on: macos-latest
    timeout-minutes: 30
    # See the `build` job: SwiftPM on arm64 runners doesn't search brew's
    # pkgconfig dir, so put libopus (and libtailscale) on PKG_CONFIG_PATH.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host
      - name: Install libopus
        run: brew install opus
      - name: Build (release)
        working-directory: Apps/macOS
        run: swift build -c release

  # ---------------------------------------------------------------------
  # The per-package portability gates. Six jobs became six MATRIX LEGS of one
  # job, because they were six copies of the same four steps — container
  # swift:6.3-noble, checkout, `apt-get install <set>`, `swift test
  # --package-path <package>` — differing only in the set and the package.
  #
  # They are NOT collapsed into one leg, and that is the point. Each answers a
  # different question, and the value of a red check here is that it names the
  # LAYER that broke: "libopus does not build on Linux" and "the Windows input
  # injector's decisions regressed" want different people looking. `fail-fast:
  # false` keeps that true when several break at once.
  #
  # `name: ${{ matrix.name }}` rather than the default `linux-packages (…)`
  # label, so the check names are byte-identical to the six jobs they replace
  # — a branch-protection rule or a bookmark pointing at `linux-protocol` goes
  # on pointing at it.
  #
  # Each leg is ~50s and they run concurrently, so this is not a speed change;
  # it is a "a fix to the container image, the apt invocation or the checkout
  # lands once" change.
  # ---------------------------------------------------------------------
  linux-packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portability gate: the TailscreenKit package — wire protocol + pure
          # decision logic, the tsnet-facing TailscreenTransport tier, the Opus
          # codec, and the two host-agnostic data planes (TailscreenViewer and
          # TailscreenSharer, the latter carrying the whole screen-share
          # server) — a real dependency of the app, see
          # Packages/TailscreenKit/README.md. It must build and pass its tests
          # on Linux, where no Apple framework exists. This is what keeps the
          # portable set portable: an AppKit/os/CoreGraphics/VideoToolbox
          # import sneaking into a package file fails here, not on someone's
          # future non-macOS port. Required — a break is always a real
          # portability regression.
          #
          # The submodule is for TailscaleKit, whose sources are symlinks into
          # it. The Go build is for Tests/TailscreenSharerTests (the
          # sharer-tier decision suites): a test target is an executable, and
          # one that links TailscreenSharer links TailscaleKit — so the test
          # bundle has to resolve `tailscale_up` and friends even though no
          # test calls tsnet, exactly the linux-portal situation (see the
          # ci.md pitfall). The bootstrap action's libtailscale.a cache keeps
          # this off the hot path: the archive rebuilds only when the
          # submodule pin or a patch changes.
          #
          # libopus-dev + pkg-config are for the TailscreenAudio target's
          # OpusKit dependency (opus.pc is on the Linux default search path,
          # so no PKG_CONFIG_PATH entry is needed for it). golang-go / make /
          # gcc / libc6-dev are the libtailscale build's toolchain, the same
          # set as linux-tailscalekit (the swift:*-noble images guarantee
          # clang, not gcc, and cgo wants gcc; the host archive build goes
          # through make).
          - name: linux-protocol
            apt: golang-go make gcc libc6-dev libopus-dev pkg-config
            submodules: recursive
            go: preinstalled
            libtailscale: host
            cmd: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift test --package-path Packages/TailscreenKit

          # Localization gate: the shared string catalog
          # (Packages/TailscreenL10n). Its suites scan ALL FOUR source trees —
          # the three apps plus TailscreenHubUI — and fail on any `L("…")` key
          # the catalog does not carry, then exercise the `.strings` parser,
          # the language-preference chain and the `%@`/`%lld` substitution that
          # replaced `String(localized:bundle:)` when the catalog stopped being
          # macOS-only.
          #
          # It has to run HERE rather than on the macOS runner, and that is the
          # whole point: the GTK and WinUI apps' strings are checked by nothing
          # else, and a Linux job is the one that sees their sources on every
          # PR. Free — no apt, no submodules, no Go, no libtailscale: the
          # package depends on Foundation and nothing at all.
          - name: linux-l10n
            cmd: swift test --package-path Packages/TailscreenL10n

          # Audio-codec-portability gate: OpusKit (a systemLibrary wrapper over
          # libopus — see Packages/OpusKit/README.md) must build and pass its
          # encode/decode round-trip tests on Linux. This is the portable
          # foundation for the Opus-only audio decision
          # (plans/porting-plan.md #6). Cheap: one apt install, no submodules,
          # no Go.
          - name: linux-opus
            apt: libopus-dev pkg-config
            cmd: swift test --package-path Packages/OpusKit

          # Video-decode-portability gate: FFmpegKit (a systemLibrary wrapper
          # over libavcodec — see Packages/FFmpegKit/README.md) must build and
          # pass its decode tests on Linux. This is the portable video-decode
          # foundation for the Linux/Windows viewer (plans/porting-plan.md —
          # "Decode"). Cheap: one apt install, no submodules, no Go.
          # (libavutil-dev comes with libavcodec-dev; opus.pc-style
          # default-path resolution means no PKG_CONFIG_PATH entry is needed.)
          - name: linux-ffmpeg
            apt: libavcodec-dev libavutil-dev pkg-config
            cmd: swift test --package-path Packages/FFmpegKit

          # Audio-portability gate, both directions: ALSAKit (a systemLibrary
          # wrapper over libasound — see Packages/ALSAKit/README.md) must build
          # and pass its PCM playback AND capture tests on Linux. This is the
          # Linux viewer's audio-output backend and the Linux sharer's mic
          # input (the counterparts to the mac AVAudioEngine sink and input
          # node); the tests open ALSA's always-present "null" PCM, which works
          # in both stream directions, so they run headless with no sound
          # hardware. Cheap: one apt install, no submodules, no Go.
          - name: linux-alsa
            apt: libasound2-dev pkg-config
            cmd: swift test --package-path Packages/ALSAKit

          # WASAPIKit's PORTABLE half — the Windows audio backend's sample
          # arithmetic and error mapping. Not a portability gate like its
          # neighbours: there is no WASAPI here to exercise and no null endpoint
          # to stand in for one, so this leg deliberately does NOT claim to
          # verify WASAPI. What it verifies is the code that was written to be
          # verifiable — the capture path's mono downmix (averaging, rebased
          # slices, partial frames, a nonsense channel count) and the shim's
          # return-code→case mapping — plus the non-Windows syntax of the whole
          # wrapper, since everything platform-specific in it sits behind
          # `#if os(Windows)`.
          #
          # It runs at all because a downmix that is silently wrong is a
          # microphone that sounds quiet or clipped, with nothing anywhere
          # saying so, and the alternative place to catch it is a human at a
          # Windows desk. No apt, no submodules, no Go: the package's only
          # inputs on this platform are Foundation and an empty translation
          # unit.
          - name: linux-wasapi
            cmd: swift test --package-path Packages/WASAPIKit

          # Screen-capture-portability gate: X11CaptureKit (a C shim over
          # libxcb + MIT-SHM, plus the BGRA→I420 conversion) must build and
          # pass its tests on Linux. The colour-conversion half runs anywhere;
          # the capture half runs under Xvfb, which is the whole reason X11
          # capture landed before the ScreenCast portal — the portal can't be
          # exercised headlessly at all. Cheap: two apt packages, no Go, no
          # submodules.
          - name: linux-x11-capture
            apt: pkg-config libxcb1-dev libxcb-shm0-dev xvfb
            cmd: xvfb-run -a --server-args="-screen 0 1280x720x24" swift test --package-path Packages/X11CaptureKit

          # Input-injection-portability gate for the Linux SHARER's remote
          # control: XTEST. Three checks, each covering something the others
          # can't, and all three fail silently in production if they regress —
          # which is why a leg exists at all rather than trusting the unit
          # tests.
          #
          #   swift test      the injector's decisions (revoke TOCTOU, the
          #                   synthesized button-up, modifier ordering,
          #                   scroll-as-buttons) through an inject-nothing seam
          #   --audit-keysyms every row of X11KeyCodeMapping against Xlib's own
          #                   tables. A typo'd hex constant that lands on an
          #                   UNASSIGNED keysym maps fine, resolves to keycode
          #                   0, and drops the keystroke — one key that does
          #                   nothing, with no error anywhere. Needs no display.
          #   --live-check    real XTEST injection against Xvfb, reading the
          #                   pointer back. Covers the one thing no unit test
          #                   can: the Xlib call itself and the FLUSH, without
          #                   which nothing reaches the server at all.
          - name: linux-xtest
            apt: pkg-config libxtst-dev xvfb
            # Submodules, like `linux-protocol` and for the same reason:
            # XTestInjectKit depends on TailscreenKit, whose manifest names
            # `../TailscaleKit` as a path dependency — and TailscaleKit's
            # `Sources/` are SYMLINKS INTO THE SUBMODULE. Without it SwiftPM
            # cannot even load the graph ("invalid custom path
            # 'Sources/TailscaleKit'"), long before anything is compiled. No Go
            # and no `libtailscale.a`: nothing in this leg links the archive,
            # only resolves the manifest that mentions it.
            submodules: recursive
            go: none
            libtailscale: none
            cmd: |
              export PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit"
              swift test --package-path Packages/XTestInjectKit
              swift build --package-path Packages/XTestInjectKit --product xtest-probe
              Packages/XTestInjectKit/.build/debug/xtest-probe --audit-keysyms
              xvfb-run -a --server-args="-screen 0 1280x720x24" \
                Packages/XTestInjectKit/.build/debug/xtest-probe --live-check

          # The MUTE HOTKEY, both platforms' halves.
          #
          # One leg rather than two because the Windows half has almost nothing
          # here to gate: its shim stubs out off Windows, so all Linux can
          # check is the wrapper's decisions and its syntax (the real
          # `RegisterHotKey` is run by `winhotkey-probe` on the Windows job).
          # The X11 half is the opposite — it can be exercised for real:
          #
          #   swift test      the environment gate (Wayland refused even though
          #                   XWayland would ACCEPT the grab and then
          #                   under-deliver) and the raw-events -> activations
          #                   latch that stops a held chord flipping the mute at
          #                   the keyboard repeat rate
          #   --live-check    a real XGrabKey on Xvfb, the chord synthesized
          #                   through XTEST, and the activation counted. Then
          #                   the same chord pressed WITH NUM LOCK ON — the
          #                   lock-mask grab variants are the single most likely
          #                   way for this feature to look broken while every
          #                   unit test passes — and finally a second grab of an
          #                   owned chord, which must be REFUSED. That last one
          #                   gates the async-error handling: XGrabKey reports
          #                   BadAccess later, so a shim without the error
          #                   handler + XSync reports success for a hotkey that
          #                   can never fire.
          - name: linux-hotkey
            apt: pkg-config libx11-dev libxtst-dev xvfb
            # Submodules for the same reason as linux-xtest: both packages
            # depend on TailscreenKit, whose manifest names ../TailscaleKit,
            # whose Sources/ are symlinks into the submodule. No Go and no
            # libtailscale.a — nothing here links the archive.
            submodules: recursive
            go: none
            libtailscale: none
            cmd: |
              export PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit"
              swift test --package-path Packages/X11HotkeyKit
              swift test --package-path Packages/WinHotkeyKit
              swift build --package-path Packages/WinHotkeyKit --product winhotkey-probe
              swift build --package-path Packages/X11HotkeyKit --product x11-hotkey-probe
              xvfb-run -a --server-args="-screen 0 1280x720x24" \
                Packages/X11HotkeyKit/.build/debug/x11-hotkey-probe --live-check

          # COMPILE, LINK AND LIVE-DAEMON gate for GNotifyKit — desktop
          # notifications over org.freedesktop.Notifications.
          #
          # Unlike linux-portal, this one CAN be a real gate, and is. The
          # portal is defined by a consent dialog a person clicks; a
          # notification daemon is an ordinary D-Bus service, so CI runs a real
          # one (dunst) on a private session bus and the probe talks to it. The
          # button press is real too — `dunstctl action` invokes the default
          # action, which is the daemon emitting ActionInvoked, not this repo
          # simulating it.
          #
          # What this proves:
          #
          #   --live-check   the Notify argument signature. `(susssasa{sv}i)`
          #                  is eight fields and two containers built through
          #                  GVariantBuilder, and getting it wrong is an
          #                  InvalidArgs error at call time that nothing else
          #                  here would produce. Verified by breaking the
          #                  signature deliberately.
          #
          #                  GetCapabilities, i.e. that "actions" and "body"
          #                  are read rather than assumed. A daemon lacking
          #                  "actions" silently DROPS buttons, so a host that
          #                  did not ask would post an Accept/Deny pair that
          #                  renders as a sentence with no way to answer it.
          #
          #                  replaces_id updating a banner in place rather than
          #                  stacking a second one.
          #
          #                  THE SIGNAL PATH, which is the half no unit test
          #                  can reach: GDBus delivers to the thread-default
          #                  GMainContext captured at subscribe time, so a
          #                  notifier built on a thread that never iterates one
          #                  posts perfectly and reports nothing. Withdraw ->
          #                  NotificationClosed(reason=3) and a real button ->
          #                  ActionInvoked both fail if the subscription or the
          #                  pump is wrong; both were verified to fail against
          #                  a build with the subscriptions removed.
          #
          # What it does NOT prove: how any of this LOOKS. dunst under Xvfb
          # draws to a screen nobody sees, and whether GNOME Shell renders two
          # buttons or hides them behind a chevron is not something a probe can
          # answer.
          #
          # Xvfb is not optional: dunst is a drawing daemon and exits without a
          # display, at which point the bus activation below fails and the
          # whole gate would fail rather than pass — which is the right way
          # round, but worth knowing when it breaks.
          - name: linux-notify
            apt: pkg-config libglib2.0-dev libglib2.0-bin dbus dunst xvfb
            # Submodules for WinNotifyKit only: it depends on TailscreenKit,
            # whose manifest names ../TailscaleKit, whose Sources/ are symlinks
            # into the submodule — the same reason linux-hotkey needs them. No
            # Go and no libtailscale.a: nothing here links the archive.
            # GNotifyKit itself still depends on nothing in TailscreenKit.
            submodules: recursive
            go: none
            libtailscale: none
            cmd: |
              export PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit"
              # WinNotifyKit — the WINDOWS backend, typechecked and decided
              # here because Linux is where its decisions can be run at all.
              # Its shim stubs off Windows, so this is the wrapper and the
              # composition, not the platform. There is no Windows equivalent
              # of the dunst gate below and there cannot be: the notification
              # platform is part of the OS, nothing presses a toast button from
              # a command line, and a Windows runner has no interactive session
              # to render one into. See the package README's "What is proven".
              swift test --package-path Packages/WinNotifyKit
              swift build --package-path Packages/WinNotifyKit --product winnotify-probe
              Packages/WinNotifyKit/.build/debug/winnotify-probe
              swift build --package-path Packages/GNotifyKit --product gnotify-probe
              # Exported so the inner single-quoted bash -c inherits it rather
              # than needing three levels of quote escaping.
              export PROBE="$PWD/Packages/GNotifyKit/.build/debug/gnotify-probe"
              # Without a session bus the probe reports "no daemon" and exits 0
              # — that is the link check, and it is deliberately NOT the gate.
              "$PROBE"
              # The gate. dbus-run-session gives a private bus so nothing here
              # touches a developer's real one; dunst is backgrounded rather
              # than bus-activated so its stderr does not hold this step open.
              xvfb-run -a --server-args="-screen 0 1280x720x24" \
                dbus-run-session -- bash -c '
                  dunst > /tmp/dunst-ci.log 2>&1 &
                  # ListNames rather than introspecting the daemon: touching
                  # the notification name ACTIVATES it, which races a second
                  # dunst against the one just backgrounded and fills the log
                  # with a name-lost error that has nothing to do with anything.
                  for _ in $(seq 100); do
                    gdbus call --session --dest org.freedesktop.DBus \
                      --object-path /org/freedesktop/DBus \
                      --method org.freedesktop.DBus.ListNames 2>/dev/null \
                      | grep -q org.freedesktop.Notifications && break
                    sleep 0.1
                  done
                  "$PROBE" --live-check --invoke-with "dunstctl action"
                '

          # COMPILE, LINK, D-BUS-PROTOCOL AND PIPEWIRE gate for
          # PortalCaptureKit — the xdg-desktop-portal ScreenCast + PipeWire
          # capture path.
          #
          # Read the name carefully: THIS IS NOT A PORTAL CAPTURE GATE, and it
          # can never become one. The portal is defined by a consent dialog a
          # compositor draws and a person clicks; there is no headless path to
          # a frame from a real portal, which is why X11 capture landed first
          # (its leg above captures an actual screen, under Xvfb).
          #
          # What DOES now run for real is the PipeWire half, against a local
          # `pipewire` daemon and a synthetic producer this repo owns. That
          # covers everything downstream of the (fd, node id) the portal hands
          # over — which was, until this leg existed, code that had compiled and
          # linked and never once executed. What it still does NOT cover, and
          # what no amount of daemon can:
          #
          #   * a real portal or a real compositor. The fd comes from connecting
          #     a socket to the daemon, not from OpenPipeWireRemote.
          #   * the AUTOCONNECT handshake. On a desktop wireplumber links the
          #     capture stream to the compositor's node; there is no session
          #     manager in a container, so the harness creates the link itself.
          #   * the DMA-BUF constraint. Producing a DMA-BUF needs a GPU, so
          #     `SPA_PARAM_BUFFERS_dataType` being pinned to MemPtr/MemFd is
          #     still argued rather than demonstrated — deleting that constraint
          #     leaves every check here green, which was verified rather than
          #     assumed.
          #
          # What this proves:
          #
          #   swift test          the Request-path derivation against
          #                       hand-written strings, the portal's wire
          #                       constants, and that a DECLINED request maps to
          #                       its own case rather than to an error
          #   --link-check        that libdbus and libpipewire actually LINK. A
          #                       SwiftPM library target is compiled but never
          #                       linked, so a missing -lpipewire-0.3 would stay
          #                       invisible until something downstream linked it
          #                       — how WASAPIKit's missing GUIDs passed their
          #                       own step and failed eleven minutes later
          #   --handshake-test    the whole client handshake against a FAKE
          #                       portal on a private bus: the three calls plus
          #                       OpenPipeWireRemote, the options dicts, the
          #                       subscribe-before-call ordering (the fake
          #                       answers with no pause, so a late subscription
          #                       times out), the streams array, the restore
          #                       token, and an fd surviving the round trip
          #   --handshake-cancel  a declined request reads as declined
          #   --pipewire-capture-test
          #                       REAL PIXELS through portal_stream.c: a format
          #                       negotiated and read back, buffers dequeued on
          #                       PipeWire's own thread, a PADDED chunk->stride
          #                       honoured rather than assumed to be width*4,
          #                       the BGRA channel order BGRAToI420 expects, and
          #                       the source-went-away signal — which turned out
          #                       NOT to be a stream state at all (a producer's
          #                       death drops the consumer to paused, so the
          #                       shipped version would never have fired)
          #   --pipewire-format-guard
          #                       an RGBx-only producer negotiates NOTHING. A
          #                       consumer that accepted it would show every
          #                       viewer swapped red and blue with no error
          #                       anywhere. Runs a BGRx producer first, so
          #                       "nothing arrived" cannot pass by being broken
          #   --pipewire-malformed-guard
          #                       a producer claiming a stride wider than its
          #                       mapping, and one flagging its buffers
          #                       corrupted, are both dropped — the first is a
          #                       read past the end of somebody else's shared
          #                       memory, the second a torn frame every viewer
          #                       keeps until the next keyframe
          #
          # What it proves about a REAL portal: still nothing. See
          # Packages/PortalCaptureKit/README.md, which says all of this at more
          # length and keeps the proven/not-proven table.
          #
          # Two load-bearing bits of plumbing, not decoration. dbus-run-session:
          # without a session bus the two handshake checks SKIP with exit 0,
          # i.e. that half of the gate would pass by not running. And the
          # daemon started below: the three PipeWire checks deliberately FAIL
          # rather than skip when no daemon answers, so this leg has to actually
          # provide one.
          - name: linux-portal
            # The extra apt packages and the Go build are all for
            # TailscreenSharerPortal, the CaptureEncoding conformance built on
            # this package. It links TailscreenKit's `TailscreenSharer`, which
            # depends on TailscaleKit directly — so although nothing in this
            # leg CALLS tsnet, its test executable still has to resolve
            # `tailscale_up` and friends, and a library-only build will not
            # tell you that (only linking an executable does).
            apt: >-
              golang-go make gcc libc6-dev
              pkg-config libdbus-1-dev libpipewire-0.3-dev pipewire dbus
              libavcodec-dev libavutil-dev libswscale-dev libopus-dev
            submodules: recursive
            go: preinstalled
            libtailscale: host
            cmd: |
              export PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit"
              swift test --package-path Packages/PortalCaptureKit
              swift build --package-path Packages/PortalCaptureKit --product portal-probe
              PROBE=Packages/PortalCaptureKit/.build/debug/portal-probe
              "$PROBE" --link-check
              dbus-run-session -- "$PROBE" --handshake-test
              dbus-run-session -- "$PROBE" --handshake-cancel
              export XDG_RUNTIME_DIR=/tmp/pipewire-ci
              mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
              # Redirected, not because the log is noise (it is: the daemon
              # complains about the session bus it does not have here) but
              # because a background process holding this step's stdout keeps
              # the step from ever finishing.
              pipewire > /tmp/pipewire-ci.log 2>&1 &
              for _ in $(seq 100); do
                [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && break
                sleep 0.1
              done
              "$PROBE" --pipewire-capture-test
              "$PROBE" --pipewire-format-guard
              "$PROBE" --pipewire-malformed-guard
              # The CaptureEncoding conformance. Its FrameHandoff suite is the
              # only DETERMINISTIC test of the PipeWire-thread -> encode-thread
              # buffer hand-off, and it needs no daemon and nobody at a
              # keyboard — which is the whole reason that type was split out
              # of PortalCaptureEncoder. Everything above it in that file
              # (opening the stream, opening x264) still has no gate anywhere
              # and cannot have one; see PortalCapturePlan.
              swift test --package-path Packages/TailscreenSharerPortal

          # Transport-portability gate: libtailscale (Go c-archive) + the
          # patched TailscaleKit Swift wrapper must build and pass their unit
          # tests on Linux. This is the compile-time half of the porting plan's
          # Phase 1; the live two-node tsnet exchange (TCP + UDP
          # PacketListener + LocalAPI over local headscale) was verified
          # manually on Linux and stays local-only for now — Linux runners
          # likely CAN run it (unlike the macOS-sandbox-blocked handshake),
          # which is a candidate follow-up.
          #
          # noble's golang-go is 1.22 — above the repo's 1.21 floor. Kept
          # apt-simple because setup-go's tool cache doesn't apply inside this
          # container. The swift:*-noble images are slim: make isn't present
          # (the host libtailscale build goes through it, for the macOS
          # deployment-target flags), and cgo wants gcc — the image only
          # guarantees clang.
          - name: linux-tailscalekit
            apt: golang-go make gcc libc6-dev
            submodules: recursive
            go: preinstalled
            libtailscale: host
            cmd: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift test --package-path Packages/TailscaleKit

          # Data-race gate: the same TailscreenKit suites `linux-protocol`
          # runs, rebuilt under ThreadSanitizer.
          #
          # Its own leg rather than a flag on `linux-protocol` because the two
          # answer different questions and have to fail separately: that one is
          # the PORTABILITY gate (an Apple import in a package file), this one
          # reads the actual memory accesses. Same apt set, same submodule, and
          # the same `libtailscale: host` + `go: preinstalled` pair for the
          # same reason — Tests/TailscreenSharerTests links TailscreenSharer →
          # TailscaleKit, so the archive is a link-time input even though no
          # test calls tsnet (see ci.md's link-a-symbol-nothing-calls pitfall).
          #
          # Whole package, not scoped to the audio and sharer targets: the
          # instrumented build shares no object tree with the plain one, so it
          # compiles from scratch either way, and the full run measured ~31 s
          # locally (981 tests) — cheaper than the argument for narrowing it.
          #
          # NOT `continue-on-error`, unlike the macOS `test-tsan` job. That one
          # runs the app target, where TSan trips over third-party C nothing
          # here can fix (libtailscale's Go runtime, ScreenCaptureKit's XPC),
          # and is informational for exactly that reason. This package imports
          # no Apple framework and calls no tsnet; it was clean on its first
          # run, so there is no noise to tolerate and a warning is a real race.
          - name: linux-tsan
            apt: golang-go make gcc libc6-dev libopus-dev pkg-config
            submodules: recursive
            go: preinstalled
            libtailscale: host
            cmd: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift test --package-path Packages/TailscreenKit --sanitize=thread

    steps:
      - uses: actions/checkout@v7
        with:
          # 'false' for every leg that omits it — only the TailscaleKit-
          # touching legs need the submodule, and cloning it costs the others
          # nothing they use.
          submodules: ${{ matrix.submodules || 'false' }}
      - name: Install ${{ matrix.apt }}
        # The swift:*-noble images are slim, so every leg brings its own
        # system libraries. One apt invocation, one place to fix.
        #
        # Skipped outright for a leg that omits `apt` rather than run with an
        # empty package list: `linux-wasapi` wraps an API that ships with
        # Windows and `linux-l10n` depends on Foundation alone, so neither has
        # anything to install — and an install step listing nothing reads as a
        # leg whose dependencies were forgotten.
        if: matrix.apt != ''
        run: apt-get update && apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - name: Bootstrap TailscaleKit
        # Only the submodule legs. Skipping it entirely on the others is what
        # keeps an empty `libtailscale:` from ever reaching the action.
        if: matrix.submodules == 'recursive'
        uses: ./.github/actions/bootstrap
        with:
          go: ${{ matrix.go }}
          libtailscale: ${{ matrix.libtailscale }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # Viewer-integration gate: the portable Linux viewer library package
  # (Packages/TailscreenLinuxBackends) must build and pass its pipeline integration test on Linux.
  # This is where the concrete backends plug into the portable ViewerSession
  # core — FFmpegKit decode + ALSAKit audio behind the
  # VideoDecoding/VideoSink/AudioSink seams (plans/porting-plan.md, "Viewer
  # wiring"). The `swift test` run:
  #   • runs `PipelineIntegrationTests` (real H.264 encode → RTP → ViewerSession
  #     → FFmpeg decode → collecting sinks — no tsnet, no window, no device), and
  #   • compiles AND LINKS `TailscreenViewerTsnet`, which pulls in the tsnet
  #     transport, so this doubles as the Linux link-check for that code (a live
  #     run needs a real tailnet and stays local-only). The native GTK viewer
  #     that consumes these targets is built by `linux-app`.
  # Heavier than the per-backend gates above: it needs the A/V dev libs plus
  # the libtailscale Go c-archive (same build as linux-tailscalekit).
  linux-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools + A/V dev libraries
        # golang-go/make/gcc for the libtailscale c-archive (see
        # linux-tailscalekit); the rest are the viewer's decode/audio system
        # libs (FFmpeg / ALSA / Opus) plus, for the SHARER backend in this same
        # package, libxcb + Xvfb — X11 capture is the one capture path that can
        # run headlessly (the ScreenCast portal needs a session bus, a
        # compositor, and a consent dialog, so it never can).
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            golang-go make gcc libc6-dev pkg-config \
            libavcodec-dev libavutil-dev libasound2-dev libopus-dev \
            libxcb1-dev libxcb-shm0-dev libxtst-dev xvfb
      - name: Build libtailscale (patched) on Linux
        uses: ./.github/actions/bootstrap
        with:
          go: preinstalled
          libtailscale: host
      - name: Build + test the Linux viewer + sharer package
        # PKG_CONFIG_PATH resolves libtailscale.pc (→ -L for libtailscale.a);
        # the A/V libs are on the default pkg-config path. xvfb-run supplies
        # the $DISPLAY the sharer's capture tests need — without it they
        # self-skip and the capture path would go ungated.
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            swift test --package-path Packages/TailscreenLinuxBackends

      # The shared FFmpeg decoder + the sharer-side encoder scaffolding
      # (`TailscreenSharerFFmpegBase` — the base class the X11/WGC/portal
      # capture backends extend): its ladder/budget/anchoring/pacing decision
      # tests. This job rather than linux-ffmpeg because the package's decoder
      # target reaches TailscreenViewer → TailscreenAudio → OpusKit, and this
      # leg already installs libopus; the test bundle itself links no
      # libtailscale (the base deliberately does not depend on
      # TailscreenSharer — the backends declare the conformance).
      - name: Test the shared FFmpeg video package
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            swift test --package-path Packages/TailscreenVideoFFmpeg

      # The WINDOWS sharer's capture backend, typechecked HERE.
      #
      # It cannot run on Linux — WGCCaptureKit stubs every entry point to
      # `unsupportedPlatform` off Windows — but it compiles, because it is
      # deliberately a package with no WinUI in it. That is worth a step: the
      # alternative is discovering a type error in the capture loop eleven
      # minutes into a Windows job, when everything it is made of (the
      # `CaptureEncoding` seam, FFmpegKit, BGRAToI420, ParameterSetExtraction)
      # is checkable here in seconds. The Windows job still builds it, for the
      # half this cannot see: that the real WGC API matches the calls.
      #
      # This job rather than linux-ffmpeg because the graph reaches
      # TailscreenSharer → TailscaleKit, which needs the submodule and the
      # patch series that only the jobs with `submodules: recursive` have.
      # The remote-control injector's gate, modifier synthesis and
      # stuck-button release, all asserted through its test seam so no real
      # SendInput runs and no cursor moves. The Win32 shim stubs out here, so
      # what is checked is every decision and none of the syscalls — which is
      # the right split, because the decisions are where the damage is (an
      # event landing after a revoke, a button left held down on someone's
      # desktop with no input path able to release it).
      - name: Test the Windows input injector on Linux
        run: swift test --package-path Packages/SendInputKit

      # The annotation overlay's Swift half. Its shim stubs out here, so what
      # this checks is the store/rasterize/update plumbing — and the halves
      # with any decisions in them (`AnnotationStore`, `AnnotationRasterizer`)
      # are tested outright in the linux-protocol job.
      - name: Typecheck the Windows annotation overlay on Linux
        run: swift build --package-path Packages/WinOverlayKit

      # `swift test`, not `swift build`: this package now carries
      # `WindowsShareSessionTests`, the Windows share ENGINE's only tests
      # anywhere. `Apps/windows` has no test target, and everything
      # Windows-bound the engine touches stubs out off Windows — so this
      # runner, with no display, no capture item and no node, is where the
      # share-generation stamp, the held-invite replay, the approval-gate
      # mirror and the mute latch are asserted rather than merely typechecked.
      # Testing builds too, so the typecheck this step used to be is kept.
      - name: Test the Windows sharer backend on Linux
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            swift test --package-path Packages/TailscreenSharerWGC

  # Was `linux-app`, which had gone stale in both directions.
  #
  # `Apps/linux` is not a viewer: it has `SharerModel`, imports
  # `TailscreenSharer` + `TailscreenSharerLinux`, and carries the approval
  # gate, annotation forwarding and input forwarding. It views AND shares, and
  # its executable has been plain `tailscreen` since the rename. `gtk` is an
  # implementation detail of the backend, not what the job gates.
  #
  # And the job is not only the Linux app — its second build typechecks the
  # WINDOWS app on Linux, which is the leg that catches the mistakes a Windows
  # runner would otherwise surface forty minutes in (see that step's comment).
  # That rides here rather than in its own job purely for cost: a separate job
  # would re-install this one's ~480 apt packages to compile the same
  # swift-cross-ui.
  #
  # `linux-app` pairs it with the `linux-app-arm64` sibling below.
  linux-app:
    # The native GTK desktop viewer (Apps/linux) — a separate package from
    # the Packages/TailscreenLinuxBackends core so swift-cross-ui + GTK4 don't burden the linux-viewer job.
    # No libtailscale/Go: this L0a build reaches only TailscreenProtocol/Viewer/
    # Audio + swift-cross-ui, and the render path is gated headlessly.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GTK4 + GL + headless display + A/V + Go
        # swift-cross-ui's GtkBackend needs gtk4 (+ gobject-introspection for
        # its bindings); CGtkVideo links epoxy + gtk-4; the render self-test runs
        # under a virtual X server with Mesa software GL. The live path reuses
        # Packages/TailscreenLinuxBackends's Core (FFmpeg/ALSA/Opus) + Tsnet (→ libtailscale, hence
        # golang-go/make), though the render self-test itself needs no network.
        # libdbus + libpipewire are for the ScreenCast portal backend: the app
        # links PortalCaptureKit so it can capture a Wayland session at all,
        # and those are COMPILE-time headers as well as runtime libraries —
        # without them the C shim fails at `pipewire/pipewire.h`, long before
        # anything gets as far as linking.
        #
        # `xcompmgr` is for the ANNOTATION-OVERLAY self-test and is not
        # optional set dressing: the sharer's overlay refuses to exist on an
        # uncomposited X11 session (no compositor means no per-pixel alpha,
        # which would make it an opaque black rectangle over the screen), so
        # without a compositing manager here that test would be checking the
        # refusal rather than the drawing. Xvfb ships no compositor of its own.
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libgtk-4-dev gir1.2-gtk-4.0 libgirepository1.0-dev libepoxy-dev \
            libgl1-mesa-dri xvfb xcompmgr libxtst-dev libopus-dev pkg-config \
            golang-go make gcc libc6-dev \
            libavcodec-dev libavutil-dev libasound2-dev \
            libdbus-1-dev libpipewire-0.3-dev
      - name: Build libtailscale (patched) on Linux
        uses: ./.github/actions/bootstrap
        with:
          # setup-go, NOT the container's apt Go, and this is the one place
          # that differs from the sibling container legs. jammy ships Go 1.18,
          # which cannot even PARSE libtailscale's `go 1.25.5` directive — the
          # three-component form arrived in 1.21, along with the automatic
          # toolchain download that lets noble's 1.22 build it at all. Debian
          # 12's 1.19 fails the same way, so this is not a jammy quirk to dodge
          # by picking another base: any base old enough to give a usable glibc
          # floor is too old for this go.mod. setup-go reads the version out of
          # go.mod and installs exactly it.
          go: setup-go
          libtailscale: host

      # ---------------------------------------------------------------------
      # The two builds below are what sets this workflow's WALL CLOCK. Measured
      # on a recent run: build.yml took 8m26s end to end, and this job took
      # 8m26s of it — every other job finished in 2-3 minutes and ran
      # concurrently, contributing nothing. The reason is that both builds
      # compile swift-cross-ui from scratch, in two separate .build
      # directories, on every single push, for a dependency whose revisions
      # move only when a pin does.
      #
      # windows-build.yml already solved exactly this and its solution is
      # copied here in shape, including the parts that are non-obvious:
      #
      #   • restore/save as SEPARATE steps, not `actions/cache`, because that
      #     action's post step is `post-if: success()` — a run that compiles
      #     the whole dependency graph and then fails on one line of our own
      #     Swift throws away every object worth keeping, and the next run
      #     pays for all of it again. That happened twice in one afternoon on
      #     the Windows side.
      #   • the save's condition is `!cancelled()` AND the restore having run,
      #     because cache keys are IMMUTABLE. This workflow has
      #     cancel-in-progress, so a run cancelled at 20 % is routine, and it
      #     must never claim a key with a fifth of a build directory that no
      #     later run could replace.
      #   • runner.arch is IN THE KEY. linux-app-arm64 runs this same package
      #     in the same container on a different architecture, and an x64
      #     object tree restored into an arm64 build is the cross-arch staging
      #     bug this repo has already shipped once.
      #   • restore-keys prefix fallback, so a lockfile bump costs an
      #     incremental rebuild rather than a cold one. Safe for a SwiftPM
      #     .build specifically: llbuild tracks inputs per target, so a stale
      #     tree plus a fresh resolve rebuilds exactly the targets whose pins
      #     moved. (The libtailscale cache deliberately has no such fallback —
      #     an opaque .a has no such referee.)
      #
      # Two directories, not one, and deliberately NOT a shared
      # --scratch-path: Apps/windows and Apps/linux resolve different
      # build plans from the same dependencies, so sharing would thrash.
      # ---------------------------------------------------------------------
      # The path lists on these restores are IDENTICAL to their saves',
      # exclusions included: the path list is hashed into the cache entry's
      # VERSION, and an entry saved under one list is invisible to a restore
      # using another — see the restore step in app-windows.yml for the
      # fingerprint this bug leaves in the logs.
      - name: Restore the GTK app's build directory
        id: gtk-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Apps/linux/.build
            !Apps/linux/.build/**/debug/tailscreen
          key: >-
            linux-app-build-swift6.3-jammy-${{ runner.os }}-${{ runner.arch
            }}-debug-${{ hashFiles('Apps/linux/Package.resolved') }}
          restore-keys: |
            linux-app-build-swift6.3-jammy-${{ runner.os }}-${{ runner.arch }}-debug-

      # A SECOND cache for the Windows app's Linux typecheck, because it is a
      # second full swift-cross-ui compile. Its key prefix is distinct from
      # windows-build.yml's `windows-app-build-*` so a Linux object tree can
      # never be restored into a Windows job — same package, incompatible
      # everything.
      - name: Restore the Windows app's Linux typecheck directory
        id: winapp-typecheck-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Apps/windows/.build
            !Apps/windows/.build/**/debug/tailscreen
          key: >-
            linux-typecheck-windows-app-swift6.3-jammy-${{ runner.os }}-${{
            runner.arch }}-${{ hashFiles('Apps/windows/Package.resolved') }}
          restore-keys: |
            linux-typecheck-windows-app-swift6.3-jammy-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the Linux app
        # PKG_CONFIG_PATH resolves libtailscale.pc for the tsnet transport.
        # Build the executable product specifically so SwiftPM prunes to the
        # Linux subgraph (DefaultBackend→GtkBackend) — a bare `swift build`
        # would also try to compile swift-cross-ui's Windows-only WinUI backend.
        run: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift build --package-path Apps/linux --product tailscreen
      - name: Typecheck the Windows app
        # The Windows app builds HERE, on Linux, and that is the point.
        #
        # Its one genuinely Windows-bound file is WinUIVideoView, which carries
        # an `#if os(Windows)` and an off-Windows stub; the WinUI dependencies
        # are conditioned on `.windows` in its manifest so SwiftPM prunes them
        # away and swift-cross-ui resolves to GtkBackend, which this job already
        # has installed. Everything else in the app — the whole view layer, the
        # state machine, the share wiring — is portable and compiles here.
        #
        # It earns its place: a `condition ? closure : nil` in the app's `body`
        # made the Windows compiler answer "failed to produce diagnostic for
        # expression" and nothing else, forty minutes into a run, having built
        # 1,450 units of dependency first. The same error appears here in about
        # three, on a Linux runner that costs a tenth as much. The Windows job
        # remains the authority on whether it LINKS and RUNS; this one is the
        # authority on whether it typechecks, which is where the mistakes are.
        run: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift build --package-path Apps/windows --product tailscreen
      - name: Headless render self-test (Xvfb + software GL)
        # Renders a 4-bar YUV frame through GtkVideoView, reads the pixels back,
        # and exits 0 only if the BT.709 output is correct — a CI-gated proof
        # the GL video path renders. The live tsnet leg is local-only (L0b).
        # Assert BOTH: the process exits 0 (bad pixels → exit 3, timeout → 124)
        # AND the PASS marker was actually printed, so a "graceful" early exit
        # (window closed / init failed) that never ran the check can't false-pass.
        # POSIX-sh compatible: the job's container shell is `sh` (dash), which
        # has no `set -o pipefail`, so we avoid the pipe entirely. Redirect to a
        # file (preserves the process exit code — a pipe to `tee` would mask it)
        # and capture the status via an `if` (so `set -e` doesn't abort first)
        # before printing the log and running the two assertions.
        run: |
          if timeout 90 xvfb-run -a -s "-screen 0 800x600x24" \
            env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/debug/tailscreen --render-self-test \
            > /tmp/gtk-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/gtk-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKVIDEO_SELFTEST result=PASS' /tmp/gtk-selftest.log

      - name: Headless annotation-overlay self-test (Xvfb + compositor)
        # The SHARER-side counterpart of the render gate above, and the reason
        # it is worth a whole extra Xvfb: every way the annotation overlay can
        # fail is invisible. A window that never maps, one the compositor
        # ignores, one placed at the wrong origin, one whose premultiplied BGRA
        # cairo reads as the wrong channel order — all four give you a share
        # that works perfectly and annotations nobody can see, with no error
        # anywhere and nothing for a unit test to catch.
        #
        # So this draws a red stroke on the overlay and reads the screen back
        # THROUGH THE SHARER'S OWN X11 CAPTURE, then asserts the chroma at the
        # stroke against a control point elsewhere on the screen. Both halves
        # of that assertion have been checked to fail: displacing the overlay
        # by 300 px, and running with no compositor.
        #
        # `xcompmgr` is started by hand rather than by xvfb-run because it must
        # own the display before the app opens it — `gdk_display_is_composited`
        # is read once at overlay-creation time, and a compositor that arrives
        # afterwards is a compositor the app never sees. Same POSIX-sh
        # constraints as the step above (the container shell is dash: no
        # pipefail, so redirect and check the status separately).
        run: |
          Xvfb :95 -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:95 xcompmgr >/dev/null 2>&1 &
          sleep 2
          if timeout 90 env DISPLAY=:95 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/debug/tailscreen --overlay-self-test \
            > /tmp/overlay-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/overlay-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKOVERLAY_SELFTEST result=PASS' /tmp/overlay-selftest.log

      - name: Headless capture-OUTLINE self-test (Xvfb + compositor)
        # The recording indicator: a border around exactly the captured region,
        # composited onto the sharer's own desktop for the life of a share.
        #
        # `CaptureOutlineTests` covers the arithmetic on a buffer, and covers it
        # better than a screenshot could — every edge, the thickness clamp, the
        # premultiplication. What no unit test reaches is whether those pixels
        # are composited onto a real X11 desktop at all.
        #
        # And one thing this step checks that the unit tests cannot make
        # convincing: THE MIDDLE OF THE SCREEN IS UNTOUCHED. That buffer sits
        # over the sharer's whole desktop, so an outline that filled it would
        # paint a solid rectangle over the thing being shared, on the sharer's
        # own machine, with no error anywhere. It is read back through the
        # sharer's own capture path, so the assertion is on real pixels.
        #
        # Both halves were checked to fail: skipping the compositing step (no
        # border at the edge), and a border wide enough to reach the middle
        # (interior no longer neutral). The self-test asks for a 24 px border
        # rather than the shipping 4 px because chroma is half resolution in
        # both axes — sampling four pixels would be a test of the sampler.
        #
        # Same xcompmgr-before-the-app constraint as the step above, and the
        # same dash-shell constraint (no pipefail).
        run: |
          Xvfb :96 -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:96 xcompmgr >/dev/null 2>&1 &
          sleep 2
          if timeout 90 env DISPLAY=:96 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/debug/tailscreen --outline-self-test \
            > /tmp/outline-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/outline-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKOUTLINE_SELFTEST result=PASS' /tmp/outline-selftest.log

      - name: Headless overlay-INPUT self-test (Xvfb + compositor + XTEST)
        # The other half of the same window. The step above asks whether the
        # overlay's pixels reach the screen; this asks whether it can take the
        # POINTER back from the desktop when the sharer arms a tool, and give it
        # up again on Escape.
        #
        # Worth its own gate because the two ways it breaks are the two worst
        # this feature has, and neither errors:
        #   • the input region never flips → every click sails through to the
        #     desktop, so drawing silently does nothing while the sharer's
        #     clicks land on whatever is underneath;
        #   • Escape never arrives → the sharer is behind a fullscreen,
        #     override-redirect, click-swallowing window with no decoration and
        #     no way out. That is a person locked out of their own machine.
        #
        # It drives REAL X11 events through XTEST rather than calling the GTK
        # handlers, because calling the handlers would prove the Swift wiring
        # and skip precisely those two failures. All four mutations have been
        # checked to fail it: no input-region flip, drag offsets not rebased on
        # the press point, Escape swallowed, and focus never taken (which must
        # make the overlay REFUSE to arm rather than trap anyone).
        #
        # Its own Xvfb, for the same compositor-ordering reason as above.
        run: |
          Xvfb :96 -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:96 xcompmgr >/dev/null 2>&1 &
          sleep 2
          if timeout 90 env DISPLAY=:96 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            GALLIUM_DRIVER=llvmpipe \
            Apps/linux/.build/debug/tailscreen --overlay-input-self-test \
            > /tmp/overlay-input-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/overlay-input-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKOVERLAY_INPUT_SELFTEST result=PASS' /tmp/overlay-input-selftest.log

      - name: Capture-backend selection report
        # The WIRING gate for `CaptureBackendSelection`. Its unit tests cover
        # every branch of the decision; nothing covers whether this app feeds
        # it the right environment, and a decision handed the wrong inputs is
        # exactly as wrong as a wrong decision.
        #
        # The middle case is the one worth having. `$DISPLAY` is set on Wayland
        # by XWayland, so a session-detection regression (reading DISPLAY as
        # evidence of X11, which is what this app used to do) puts Wayland
        # users back on X11 root capture — a share that succeeds, says
        # "Sharing", and sends viewers an XWayland root that is usually blank.
        # Asserting `backend=x11` never appears under a Wayland session is what
        # catches that; a `canShare` check alone would not.
        #
        # No portal on this runner, so the portal branches report unavailable.
        # That is honest rather than unfortunate: a leg cannot gate the portal
        # path, because the portal is a dialog a person clicks.
        run: |
          Xvfb :95 -screen 0 640x480x24 >/dev/null 2>&1 &
          sleep 2
          BIN=Apps/linux/.build/debug/tailscreen
          DISPLAY=:95 "$BIN" --capture-backend-report > /tmp/backend-x11.log 2>&1
          cat /tmp/backend-x11.log
          grep -q 'intent=entire-screen backend=x11(:95)' /tmp/backend-x11.log
          grep -q 'canShare=true' /tmp/backend-x11.log

          XDG_SESSION_TYPE=wayland DISPLAY=:95 "$BIN" --capture-backend-report \
            > /tmp/backend-wayland.log 2>&1
          cat /tmp/backend-wayland.log
          grep -q 'session=wayland' /tmp/backend-wayland.log
          if grep -q 'backend=x11' /tmp/backend-wayland.log; then
            echo "FAIL: a Wayland session was routed to X11 capture (XWayland trap)" >&2
            exit 1
          fi

          # WAYLAND_DISPLAY with NO session type — a real configuration, and
          # the one where detection ORDER decides the answer. The case above
          # returns on the first branch and so cannot catch a regression that
          # consults DISPLAY too early; this one can, and was checked to fail
          # against exactly that mutation.
          env -u XDG_SESSION_TYPE WAYLAND_DISPLAY=wayland-0 DISPLAY=:95 \
            "$BIN" --capture-backend-report > /tmp/backend-wayland-implicit.log 2>&1
          cat /tmp/backend-wayland-implicit.log
          grep -q 'session=wayland' /tmp/backend-wayland-implicit.log
          if grep -q 'backend=x11' /tmp/backend-wayland-implicit.log; then
            echo "FAIL: WAYLAND_DISPLAY session routed to X11 capture" >&2
            exit 1
          fi

          env -u DISPLAY "$BIN" --capture-backend-report > /tmp/backend-none.log 2>&1
          cat /tmp/backend-none.log
          grep -q 'canShare=false' /tmp/backend-none.log

      # Both saves live at the end so they bank objects from a run that failed
      # the typecheck or the self-test — the compile is the expensive part and
      # it already happened. The product binaries are excluded: they are
      # relinked on every build regardless, and a smaller archive survives the
      # repo's shared 10 GB cache budget longer. The exclusions appear on the
      # restore steps too, and must — the path list is part of the cache
      # entry's version (see the restore steps above).
      #
      # SwiftPM 6.3 rewrites the committed 6.1-format lockfiles during the
      # builds above — format/originHash churn, same pins, the same rewrite
      # app-windows.yml's resolve step discards. Both cache keys hash these
      # files, the save steps evaluate hashFiles AFTER the rewrite, and the
      # restore steps evaluated it BEFORE — so without the discard every save
      # lands on a key no restore ever computes, and the cache silently does
      # nothing while looking healthy (run 31297064304 restored
      # `…debug-b50c2c…` and saved `…debug-efb24da…`). `!cancelled()` because
      # the saves it protects run under the same condition.
      - name: Keep the cache keys consistent with the committed lockfiles
        if: ${{ !cancelled() }}
        run: git checkout -- Apps/linux/Package.resolved Apps/windows/Package.resolved

      # Saved only from main: a branch save is scoped to its branch and can
      # warm nothing else, while its ~500 MB generation spends the shared
      # budget and evicts the main caches every branch's restore falls back
      # to. Measured consequence and full rationale: the save step in
      # app-windows.yml.
      - name: Save the GTK app's build directory
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && steps.gtk-build-cache.outcome == 'success'
          && steps.gtk-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Apps/linux/.build
            !Apps/linux/.build/**/debug/tailscreen
          key: >-
            linux-app-build-swift6.3-jammy-${{ runner.os }}-${{ runner.arch
            }}-debug-${{ hashFiles('Apps/linux/Package.resolved') }}

      - name: Save the Windows app's Linux typecheck directory
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && steps.winapp-typecheck-cache.outcome == 'success'
          && steps.winapp-typecheck-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Apps/windows/.build
            !Apps/windows/.build/**/debug/tailscreen
          key: >-
            linux-typecheck-windows-app-swift6.3-jammy-${{ runner.os }}-${{
            runner.arch }}-${{ hashFiles('Apps/windows/Package.resolved') }}

  # The native Linux app on arm64 — GitHub's free arm64 runner for public
  # repos (ubuntu-24.04-arm) in the SAME swift:6.3-jammy container as every
  # other Linux job. Three deliberate differences from the x64
  # `linux-app` leg:
  #   • builds -c release, not debug — one build does triple duty: the arm64
  #     release-config compile check, the binary the self-test gates, and the
  #     binary the artifact ships (the debug leg is already covered on x64;
  #     building both configs here would roughly double the job for no extra
  #     signal),
  #   • runs the same headless GL YUV-readback self-test — the proof this is a
  #     real leg (llvmpipe renders + BT.709 math verified on arm64), not
  #     compile-only,
  #   • stages + uploads `tailscreen-linux-arm64.tar.gz`. A plain tarball here
  #     on purpose: the arm64 AppImage exists, but it lives in
  #     release.yml (aarch64 linuxdeploy + appimagetool) — AppImage
  #     assembly is a packaging concern, not a per-PR gate, exactly as the
  #     x86_64 AppImage is release-only too.
  #
  # The steps live in app-linux.yml, shared with release.yml's arm64
  # packaging job — which was this job plus a tarball rename, down to the
  # duplicated README.txt wording inside the tarball.
  #
  # It stays on every push rather than being demoted to a nightly because the
  # reason to demote it was cost, and app-linux.yml's build cache is the cost.
  # Hard gate: no continue-on-error — an arm64 break is a real break.
  linux-app-arm64:
    name: linux-app-arm64
    uses: ./.github/workflows/app-linux.yml
    with:
      arch: arm64
      package: tarball
      artifact_name: tailscreen-linux-arm64

  lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint (pinned)
        # PINNED — see the SWIFTLINT_VERSION comment at the top of this file.
        # This deliberately does NOT use Homebrew: homebrew-core carries no
        # versioned `swiftlint@X.Y.Z` formula, and `brew install <homebrew-core
        # commit URL>` is refused outright ("Installation from a GitHub commit
        # URL is unsupported"), so brew can only ever install "latest". Each
        # SwiftLint release publishes its own prebuilt universal macOS binary
        # as portable_swiftlint.zip, which is both reproducible and a
        # one-line bump.
        run: |
          set -euo pipefail
          url="https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -fsSL "$url" -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Verify the pinned SwiftLint is the one on PATH
        # Assert rather than log: a pin that silently isn't in effect (a stale
        # brew swiftlint earlier on PATH, a redirected download) is exactly the
        # failure this whole step exists to prevent, and it would otherwise
        # only show up as a mystery violation.
        run: |
          set -euo pipefail
          got="$(swiftlint version)"
          if [ "$got" != "$SWIFTLINT_VERSION" ]; then
            echo "::error::SwiftLint version mismatch: expected ${SWIFTLINT_VERSION}, got ${got} (from $(command -v swiftlint))"
            exit 1
          fi
          echo "SwiftLint ${got} from $(command -v swiftlint)"
      - name: Run SwiftLint (baseline-gated)
        run: make lint

  format:
    # `make format-check` needs a `swift-format` binary. The macos-latest
    # runner image doesn't ship one on PATH (the Xcode toolchain on the hosted
    # runners doesn't expose `swift-format` directly — `swift-format
    # --version` exits 127), so the job provides it.
    #
    # It is BUILT FROM A PINNED TAG rather than `brew install swift-format`,
    # for the same reason SwiftLint is pinned (see SWIFT_FORMAT_VERSION at the
    # top of this file) plus one more: swift-format's whole job is to rewrite
    # source, so a release that changes one line-breaking heuristic reformats
    # files nobody touched. There is no prebuilt release artifact for it — the
    # swiftlang/swift-format releases are source tags — so the pin is a
    # shallow clone of the tag plus `swift build -c release`. That is minutes
    # of swift-syntax compile, which is why the built binary is cached under
    # its version: only a version bump (or a 7-day-idle cache eviction) pays
    # it, and the timeout below is sized for the cold path.
    #
    # REQUIRED as of the repo-wide sweep. It was informational for as long as
    # the config had only ever been applied to five of the ~43 trees, so
    # turning it on would have failed every PR for reasons predating the PR.
    # The sweep formatted all of them and fixed the three `--strict`
    # violations swift-format cannot fix itself, so a clean run is the
    # baseline now rather than an aspiration.
    #
    # If this starts failing everywhere at once, suspect SWIFT_FORMAT_VERSION
    # at the top of this file before suspecting the diff: swift-format's whole
    # job is rewriting source, so a release that retunes one line-breaking
    # heuristic reformats files nobody touched. That is why it is pinned.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore the pinned swift-format
        id: swift-format-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/swift-format
          # runner.arch is in the key on purpose — the sibling caches in this
          # repo have shipped an arch-mismatched restore before.
          key: swift-format-${{ env.SWIFT_FORMAT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build the pinned swift-format
        if: steps.swift-format-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/swift-format-src"
          git clone --depth 1 --branch "$SWIFT_FORMAT_VERSION" \
            https://github.com/swiftlang/swift-format "$src"
          swift build -c release --package-path "$src" --product swift-format
          mkdir -p "$HOME/.local/bin"
          cp "$src/.build/release/swift-format" "$HOME/.local/bin/swift-format"
      - name: Put swift-format on PATH
        run: |
          set -euo pipefail
          chmod +x "$HOME/.local/bin/swift-format"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify swift-format is available
        # Logged, not asserted: the tag we cloned IS the pin, and the version
        # string a source build reports is the swift-syntax one, which has not
        # always matched the tag.
        run: swift-format --version
      - name: Run swift-format check
        # `make format-check` runs `swift-format lint --strict` against
        # Sources/ and Tests/ using the repo's `.swift-format` config.
        run: make format-check

  release-version:
    # The MSIX identity/version derivation, which used to live inline in
    # release.yml where its ONLY feedback was publishing a release. It shipped
    # a bug that way: a candidate and the release it precedes derived the same
    # MSIX Identity Version, so Windows refused the real release as an upgrade
    # on any machine that had installed the candidate. Nothing could have
    # caught that except installing both.
    #
    # Now it is scripts/release-version.sh and this runs its table of
    # orderings on every push — seconds on the cheapest runner, no toolchain,
    # no checkout cost worth mentioning. It gates the ORDERINGS rather than the
    # strings: a release never shares an identity with its candidates,
    # candidates ascend within their own, and a release outranks the version
    # before it. Each of those was checked to fail against a deliberate break.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Derivation table
        run: ./scripts/test-release-version.sh
      # The other half of the release plumbing nothing else can reach: the job
      # graph and the upload calls, which only ever execute on a published
      # release. v0.10.0-rc.1 shipped two bugs there — a macOS job silently
      # skipped by a pull_request-only `needs`, and a `gh release upload` in
      # the one job that never checks out the repo. Neither is observable
      # before the release that hits them; both are decidable from the YAML.
      - name: Release workflow wiring
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --quiet --disable-pip-version-check pyyaml
          ./scripts/test-release-wiring.py

  test-tsan:
    # Thread Sanitizer build. Catches lock/continuation races that
    # strict-concurrency lets through. TSan flags a handful of known-OK
    # patterns in third-party C code (libtailscale, ScreenCaptureKit's
    # XPC) that we can't fix from Swift, so this job is informational
    # rather than required.
    #
    # TODO: Once the remaining noise is suppressed (via a TSan
    # suppressions file under .build/) or fixed upstream, remove
    # `continue-on-error` so this becomes a required check. Until then
    # we deliberately tolerate failures here — making it required
    # without first fixing the false positives would block every PR.
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    # See the `build` job: put libopus (+ libtailscale) on PKG_CONFIG_PATH so
    # SwiftPM resolves them on arm64 runners. The Makefile appends this.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host
      - name: Install libopus
        run: brew install opus
      - name: Run tests under TSan
        run: make test-tsan

  # NOTE: there is deliberately no CI job for the tsnet E2E suites
  # (ScreenShareControlChannelTests / ScreenShareRequestToShareTests /
  # ScreenShareFanoutTests). They were tried on macos-latest via a Docker-free
  # native headscale (scripts/e2e-up-native.sh): headscale itself came up
  # healthy and minted a key, but the first tsnet `node.up()` hung indefinitely
  # — GitHub's hosted macOS runner sandbox doesn't let the userspace-WireGuard
  # handshake / DERP-STUN (:3478/udp) complete. `node.up()` has no internal
  # timeout, so the job just stalled. These suites are local-only; run them with
  # `make test-e2e-local` (Docker) or `scripts/e2e-up-native.sh` (Docker-free).
