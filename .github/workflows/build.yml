name: Build

# CI runs only on pushes to `main` (post-merge verification) and on
# pull-requests. Direct pushes to `claude/**` feature branches no longer
# trigger CI — the same branch's PR already covers it, and macOS minutes
# are 10× Linux. Doc-only edits skip CI entirely.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# A new push to the same branch cancels the previous in-flight build —
# avoids paying for runs the user no longer cares about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    # SwiftPM on Apple-silicon runners does NOT search Homebrew's
    # /opt/homebrew/lib/pkgconfig by default, so OpusKit's `pkgConfig: "opus"`
    # can't find opus.pc from `brew install opus` unless it's on
    # PKG_CONFIG_PATH. Set it job-wide (alongside the TailscaleKit dir) so
    # every build/test step resolves libopus. macos-latest is arm64, so the
    # brew prefix is /opt/homebrew.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive  # Initialize all submodules
          # Full history so the diff-coverage gate can diff against the
          # PR's base (origin/main).
          fetch-depth: 0

      # Patches + Go + libtailscale.a. `make build` below re-enters
      # `make tailscale`, which is a no-op once the archive is in place.
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host

      - name: Install libopus
        # OpusKit's COpus systemLibrary resolves libopus via pkg-config; the
        # app now links it (Opus replaced AudioToolbox AAC). The job-level
        # PKG_CONFIG_PATH points SwiftPM at brew's opus.pc.
        run: brew install opus

      - name: Build
        run: make build

      - name: Run tests (with coverage)
        # `--enable-code-coverage` writes an LLVM profdata bundle under
        # .build/<config>/codecov/. The subsequent step turns that into a
        # human-readable summary and uploads the raw profdata as an artifact.
        # PKG_CONFIG_PATH is set job-wide (libtailscale + libopus).
        working-directory: Apps/macOS
        run: swift test --enable-code-coverage

      - name: Coverage summary
        # Surface a percentage in the job log + the workflow run summary.
        # Uses `xcrun llvm-cov` which ships with Xcode — no third-party
        # service or secrets needed. Best-effort: if the profdata bundle
        # or binary path can't be located the step warns but doesn't fail
        # the build.
        if: always()
        # PKG_CONFIG_PATH (libtailscale + libopus) is set job-wide, so
        # `swift build --show-bin-path` can load the manifest's systemLibrary
        # targets; without it BUILD_BIN_PATH ends up empty, dropping coverage.
        working-directory: Apps/macOS
        run: |
          set -u
          BUILD_BIN_PATH="$(swift build --show-bin-path 2>/dev/null || echo)"
          PROFDATA="${BUILD_BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BUILD_BIN_PATH}" -maxdepth 2 -name '*.xctest' | head -n1 || true)"
          if [ -z "${XCTEST_BUNDLE}" ] || [ ! -f "${PROFDATA}" ]; then
            echo "::warning::could not locate coverage data (profdata=${PROFDATA}, xctest=${XCTEST_BUNDLE})"
            exit 0
          fi
          # On macOS the xctest bundle's binary lives at Contents/MacOS/<name>.
          XCTEST_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          if [ ! -x "${XCTEST_BIN}" ]; then
            XCTEST_BIN="$(find "${XCTEST_BUNDLE}" -type f -perm -u+x | head -n1)"
          fi
          # Exclude .build (SwiftPM checkouts) and Tests/ from the totals.
          REPORT="$(xcrun llvm-cov report \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${XCTEST_BIN}" 2>&1 || true)"
          echo "${REPORT}"
          {
            echo "## Code coverage"
            echo ""
            echo '```'
            echo "${REPORT}" | tail -n 20
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profdata
          path: |
            Apps/macOS/.build/**/codecov/default.profdata
          if-no-files-found: warn
          retention-days: 14

      - name: Diff coverage gate (warn-only)
        # Fails when < 70 % of the changed executable Sources/ lines are
        # covered, printing the uncovered file:line list. Currently
        # informational (continue-on-error: true), same convention as the
        # `format` job: observe it across a few real PRs first, then flip
        # to required.
        # TODO: drop `continue-on-error` once the gate is observed stable —
        # and when flipping, also harden the silent exit-0 paths: the
        # missing-profdata branch below warns-and-passes, and the script
        # swallows git-diff errors (see scripts/diff-coverage.sh header).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # PKG_CONFIG_PATH (libtailscale + libopus) is set job-wide.
        working-directory: Apps/macOS
        run: |
          set -u
          BUILD_BIN_PATH="$(swift build --show-bin-path 2>/dev/null || echo)"
          PROFDATA="${BUILD_BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BUILD_BIN_PATH}" -maxdepth 2 -name '*.xctest' | head -n1 || true)"
          if [ -z "${XCTEST_BUNDLE}" ] || [ ! -f "${PROFDATA}" ]; then
            echo "::warning::diff-coverage: could not locate coverage data — skipping"
            exit 0
          fi
          XCTEST_BIN="${XCTEST_BUNDLE}/Contents/MacOS/$(basename "${XCTEST_BUNDLE}" .xctest)"
          if [ ! -x "${XCTEST_BIN}" ]; then
            XCTEST_BIN="$(find "${XCTEST_BUNDLE}" -type f -perm -u+x | head -n1)"
          fi
          xcrun llvm-cov export -format=lcov \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='\.build/|Tests/' \
            "${XCTEST_BIN}" > coverage.lcov
          ../../scripts/diff-coverage.sh coverage.lcov "origin/${{ github.base_ref }}" 70

  # Release-config compile check: -O + cross-module optimization + stripped
  # assert()s surface a different class of errors than debug builds, and
  # before this job they first broke on a published release. No tests, no
  # artifact — compiling clean is the point. Required (not
  # continue-on-error): a release-config compile break is always real.
  build-release:
    runs-on: macos-latest
    timeout-minutes: 30
    # See the `build` job: SwiftPM on arm64 runners doesn't search brew's
    # pkgconfig dir, so put libopus (and libtailscale) on PKG_CONFIG_PATH.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host
      - name: Install libopus
        run: brew install opus
      - name: Build (release)
        working-directory: Apps/macOS
        run: swift build -c release

  # ---------------------------------------------------------------------
  # The per-package portability gates. Six jobs became six MATRIX LEGS of one
  # job, because they were six copies of the same four steps — container
  # swift:6.3-noble, checkout, `apt-get install <set>`, `swift test
  # --package-path <package>` — differing only in the set and the package.
  #
  # They are NOT collapsed into one leg, and that is the point. Each answers a
  # different question, and the value of a red check here is that it names the
  # LAYER that broke: "libopus does not build on Linux" and "the Windows input
  # injector's decisions regressed" want different people looking. `fail-fast:
  # false` keeps that true when several break at once.
  #
  # `name: ${{ matrix.name }}` rather than the default `linux-packages (…)`
  # label, so the check names are byte-identical to the six jobs they replace
  # — a branch-protection rule or a bookmark pointing at `linux-protocol` goes
  # on pointing at it.
  #
  # Each leg is ~50s and they run concurrently, so this is not a speed change;
  # it is a "a fix to the container image, the apt invocation or the checkout
  # lands once" change.
  # ---------------------------------------------------------------------
  linux-packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portability gate: the TailscreenKit package — wire protocol + pure
          # decision logic, the tsnet-facing TailscreenTransport tier, the Opus
          # codec, and the two host-agnostic data planes (TailscreenViewer and
          # TailscreenSharer, the latter carrying the whole screen-share
          # server) — a real dependency of the app, see
          # Packages/TailscreenKit/README.md. It must build and pass its tests
          # on Linux, where no Apple framework exists. This is what keeps the
          # portable set portable: an AppKit/os/CoreGraphics/VideoToolbox
          # import sneaking into a package file fails here, not on someone's
          # future non-macOS port. Cheap (Linux minutes, no Go build — the
          # transport tier compiles against the patched tailscale.h; only
          # linking needs the .a, and nothing here links it) and required — a
          # break is always a real portability regression.
          #
          # The submodule is for TailscaleKit, whose sources are symlinks into
          # it; `swift test` builds every tier including TailscreenSharer,
          # which needs only the patched HEADER, so no Go build.
          #
          # libopus-dev + pkg-config are for the TailscreenAudio target's
          # OpusKit dependency (opus.pc is on the Linux default search path, so
          # no PKG_CONFIG_PATH entry is needed for it). `make` used to be in
          # this set too, purely so the Makefile's patch loop could run; the
          # bootstrap action inlines that loop, so it is gone.
          - name: linux-protocol
            apt: libopus-dev pkg-config
            submodules: recursive
            go: none
            libtailscale: none
            cmd: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift test --package-path Packages/TailscreenKit

          # Audio-codec-portability gate: OpusKit (a systemLibrary wrapper over
          # libopus — see Packages/OpusKit/README.md) must build and pass its
          # encode/decode round-trip tests on Linux. This is the portable
          # foundation for the Opus-only audio decision
          # (docs/porting-plan.md #6). Cheap: one apt install, no submodules,
          # no Go.
          - name: linux-opus
            apt: libopus-dev pkg-config
            cmd: swift test --package-path Packages/OpusKit

          # Video-decode-portability gate: FFmpegKit (a systemLibrary wrapper
          # over libavcodec — see Packages/FFmpegKit/README.md) must build and
          # pass its decode tests on Linux. This is the portable video-decode
          # foundation for the Linux/Windows viewer (docs/porting-plan.md —
          # "Decode"). Cheap: one apt install, no submodules, no Go.
          # (libavutil-dev comes with libavcodec-dev; opus.pc-style
          # default-path resolution means no PKG_CONFIG_PATH entry is needed.)
          - name: linux-ffmpeg
            apt: libavcodec-dev libavutil-dev pkg-config
            cmd: swift test --package-path Packages/FFmpegKit

          # Audio-playback-portability gate: ALSAKit (a systemLibrary wrapper
          # over libasound — see Packages/ALSAKit/README.md) must build and
          # pass its PCM-playback tests on Linux. This is the Linux viewer's
          # audio-output backend (the counterpart to the mac viewer's
          # AVAudioEngine sink); the tests open ALSA's always-present "null"
          # PCM so they run headless with no sound hardware. Cheap: one apt
          # install, no submodules, no Go.
          - name: linux-alsa
            apt: libasound2-dev pkg-config
            cmd: swift test --package-path Packages/ALSAKit

          # Screen-capture-portability gate: X11CaptureKit (a C shim over
          # libxcb + MIT-SHM, plus the BGRA→I420 conversion) must build and
          # pass its tests on Linux. The colour-conversion half runs anywhere;
          # the capture half runs under Xvfb, which is the whole reason X11
          # capture landed before the ScreenCast portal — the portal can't be
          # exercised headlessly at all. Cheap: two apt packages, no Go, no
          # submodules.
          - name: linux-x11-capture
            apt: pkg-config libxcb1-dev libxcb-shm0-dev xvfb
            cmd: xvfb-run -a --server-args="-screen 0 1280x720x24" swift test --package-path Packages/X11CaptureKit

          # Transport-portability gate: libtailscale (Go c-archive) + the
          # patched TailscaleKit Swift wrapper must build and pass their unit
          # tests on Linux. This is the compile-time half of the porting plan's
          # Phase 1; the live two-node tsnet exchange (TCP + UDP
          # PacketListener + LocalAPI over local headscale) was verified
          # manually on Linux and stays local-only for now — Linux runners
          # likely CAN run it (unlike the macOS-sandbox-blocked handshake),
          # which is a candidate follow-up.
          #
          # noble's golang-go is 1.22 — above the repo's 1.21 floor. Kept
          # apt-simple because setup-go's tool cache doesn't apply inside this
          # container. The swift:*-noble images are slim: make isn't present
          # (the host libtailscale build goes through it, for the macOS
          # deployment-target flags), and cgo wants gcc — the image only
          # guarantees clang.
          - name: linux-tailscalekit
            apt: golang-go make gcc libc6-dev
            submodules: recursive
            go: preinstalled
            libtailscale: host
            cmd: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift test --package-path Packages/TailscaleKit

    steps:
      - uses: actions/checkout@v7
        with:
          # 'false' for the four legs that omit it — only the TailscaleKit-
          # touching legs need the submodule, and cloning it costs the others
          # nothing they use.
          submodules: ${{ matrix.submodules || 'false' }}
      - name: Install ${{ matrix.apt }}
        # The swift:*-noble images are slim, so every leg brings its own
        # system libraries. One apt invocation, one place to fix.
        run: apt-get update && apt-get install -y --no-install-recommends ${{ matrix.apt }}
      - name: Bootstrap TailscaleKit
        # Only the submodule legs. Skipping it entirely on the others is what
        # keeps an empty `libtailscale:` from ever reaching the action.
        if: matrix.submodules == 'recursive'
        uses: ./.github/actions/bootstrap
        with:
          go: ${{ matrix.go }}
          libtailscale: ${{ matrix.libtailscale }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # Viewer-integration gate: the portable Linux viewer library package
  # (Apps/linux) must build and pass its pipeline integration test on Linux.
  # This is where the concrete backends plug into the portable ViewerSession
  # core — FFmpegKit decode + ALSAKit audio behind the
  # VideoDecoding/VideoSink/AudioSink seams (docs/porting-plan.md, "Viewer
  # wiring"). The `swift test` run:
  #   • runs `PipelineIntegrationTests` (real H.264 encode → RTP → ViewerSession
  #     → FFmpeg decode → collecting sinks — no tsnet, no window, no device), and
  #   • compiles AND LINKS `TailscreenViewerTsnet`, which pulls in the tsnet
  #     transport, so this doubles as the Linux link-check for that code (a live
  #     run needs a real tailnet and stays local-only). The native GTK viewer
  #     that consumes these targets is built by `linux-app`.
  # Heavier than the per-backend gates above: it needs the A/V dev libs plus
  # the libtailscale Go c-archive (same build as linux-tailscalekit).
  linux-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools + A/V dev libraries
        # golang-go/make/gcc for the libtailscale c-archive (see
        # linux-tailscalekit); the rest are the viewer's decode/audio system
        # libs (FFmpeg / ALSA / Opus) plus, for the SHARER backend in this same
        # package, libxcb + Xvfb — X11 capture is the one capture path that can
        # run headlessly (the ScreenCast portal needs a session bus, a
        # compositor, and a consent dialog, so it never can).
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            golang-go make gcc libc6-dev pkg-config \
            libavcodec-dev libavutil-dev libasound2-dev libopus-dev \
            libxcb1-dev libxcb-shm0-dev xvfb
      - name: Build libtailscale (patched) on Linux
        uses: ./.github/actions/bootstrap
        with:
          go: preinstalled
          libtailscale: host
      - name: Build + test the Linux viewer + sharer package
        # PKG_CONFIG_PATH resolves libtailscale.pc (→ -L for libtailscale.a);
        # the A/V libs are on the default pkg-config path. xvfb-run supplies
        # the $DISPLAY the sharer's capture tests need — without it they
        # self-skip and the capture path would go ungated.
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            swift test --package-path Apps/linux

      # The WINDOWS sharer's capture backend, typechecked HERE.
      #
      # It cannot run on Linux — WGCCaptureKit stubs every entry point to
      # `unsupportedPlatform` off Windows — but it compiles, because it is
      # deliberately a package with no WinUI in it. That is worth a step: the
      # alternative is discovering a type error in the capture loop eleven
      # minutes into a Windows job, when everything it is made of (the
      # `CaptureEncoding` seam, FFmpegKit, BGRAToI420, ParameterSetExtraction)
      # is checkable here in seconds. The Windows job still builds it, for the
      # half this cannot see: that the real WGC API matches the calls.
      #
      # This job rather than linux-ffmpeg because the graph reaches
      # TailscreenSharer → TailscaleKit, which needs the submodule and the
      # patch series that only the jobs with `submodules: recursive` have.
      # The remote-control injector's gate, modifier synthesis and
      # stuck-button release, all asserted through its test seam so no real
      # SendInput runs and no cursor moves. The Win32 shim stubs out here, so
      # what is checked is every decision and none of the syscalls — which is
      # the right split, because the decisions are where the damage is (an
      # event landing after a revoke, a button left held down on someone's
      # desktop with no input path able to release it).
      - name: Test the Windows input injector on Linux
        run: swift test --package-path Packages/SendInputKit

      # The annotation overlay's Swift half. Its shim stubs out here, so what
      # this checks is the store/rasterize/update plumbing — and the halves
      # with any decisions in them (`AnnotationStore`, `AnnotationRasterizer`)
      # are tested outright in the linux-protocol job.
      - name: Typecheck the Windows annotation overlay on Linux
        run: swift build --package-path Packages/WinOverlayKit

      - name: Typecheck the Windows sharer backend on Linux
        run: |
          PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" \
            swift build --package-path Packages/TailscreenSharerWGC

  # Was `linux-app`, which had gone stale in both directions.
  #
  # `Apps/linux-gtk` is not a viewer: it has `SharerModel`, imports
  # `TailscreenSharer` + `TailscreenSharerLinux`, and carries the approval
  # gate, annotation forwarding and input forwarding. It views AND shares, and
  # its executable has been plain `tailscreen` since the rename. `gtk` is an
  # implementation detail of the backend, not what the job gates.
  #
  # And the job is not only the Linux app — its second build typechecks the
  # WINDOWS app on Linux, which is the leg that catches the mistakes a Windows
  # runner would otherwise surface forty minutes in (see that step's comment).
  # That rides here rather than in its own job purely for cost: a separate job
  # would re-install this one's ~480 apt packages to compile the same
  # swift-cross-ui.
  #
  # `linux-app` pairs it with the `linux-app-arm64` sibling below.
  linux-app:
    # The native GTK desktop viewer (Apps/linux-gtk) — a separate package from
    # the Apps/linux core so swift-cross-ui + GTK4 don't burden the linux-viewer job.
    # No libtailscale/Go: this L0a build reaches only TailscreenProtocol/Viewer/
    # Audio + swift-cross-ui, and the render path is gated headlessly.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install GTK4 + GL + headless display + A/V + Go
        # swift-cross-ui's GtkBackend needs gtk4 (+ gobject-introspection for
        # its bindings); CGtkVideo links epoxy + gtk-4; the render self-test runs
        # under a virtual X server with Mesa software GL. The live path reuses
        # Apps/linux's Core (FFmpeg/ALSA/Opus) + Tsnet (→ libtailscale, hence
        # golang-go/make), though the render self-test itself needs no network.
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libgtk-4-dev gir1.2-gtk-4.0 libgirepository1.0-dev libepoxy-dev \
            libgl1-mesa-dri xvfb libopus-dev pkg-config \
            golang-go make gcc libc6-dev \
            libavcodec-dev libavutil-dev libasound2-dev
      - name: Build libtailscale (patched) on Linux
        uses: ./.github/actions/bootstrap
        with:
          go: preinstalled
          libtailscale: host

      # ---------------------------------------------------------------------
      # The two builds below are what sets this workflow's WALL CLOCK. Measured
      # on a recent run: build.yml took 8m26s end to end, and this job took
      # 8m26s of it — every other job finished in 2-3 minutes and ran
      # concurrently, contributing nothing. The reason is that both builds
      # compile swift-cross-ui from scratch, in two separate .build
      # directories, on every single push, for a dependency whose revisions
      # move only when a pin does.
      #
      # windows-build.yml already solved exactly this and its solution is
      # copied here in shape, including the parts that are non-obvious:
      #
      #   • restore/save as SEPARATE steps, not `actions/cache`, because that
      #     action's post step is `post-if: success()` — a run that compiles
      #     the whole dependency graph and then fails on one line of our own
      #     Swift throws away every object worth keeping, and the next run
      #     pays for all of it again. That happened twice in one afternoon on
      #     the Windows side.
      #   • the save's condition is `!cancelled()` AND the restore having run,
      #     because cache keys are IMMUTABLE. This workflow has
      #     cancel-in-progress, so a run cancelled at 20 % is routine, and it
      #     must never claim a key with a fifth of a build directory that no
      #     later run could replace.
      #   • runner.arch is IN THE KEY. linux-app-arm64 runs this same package
      #     in the same container on a different architecture, and an x64
      #     object tree restored into an arm64 build is the cross-arch staging
      #     bug this repo has already shipped once.
      #   • restore-keys prefix fallback, so a lockfile bump costs an
      #     incremental rebuild rather than a cold one. Safe for a SwiftPM
      #     .build specifically: llbuild tracks inputs per target, so a stale
      #     tree plus a fresh resolve rebuilds exactly the targets whose pins
      #     moved. (The libtailscale cache deliberately has no such fallback —
      #     an opaque .a has no such referee.)
      #
      # Two directories, not one, and deliberately NOT a shared
      # --scratch-path: Apps/windows and Apps/linux-gtk resolve different
      # build plans from the same dependencies, so sharing would thrash.
      # ---------------------------------------------------------------------
      - name: Restore the GTK app's build directory
        id: gtk-build-cache
        uses: actions/cache/restore@v6
        with:
          path: Apps/linux-gtk/.build
          key: >-
            linux-gtk-build-swift6.3-noble-${{ runner.os }}-${{ runner.arch
            }}-debug-${{ hashFiles('Apps/linux-gtk/Package.resolved') }}
          restore-keys: |
            linux-gtk-build-swift6.3-noble-${{ runner.os }}-${{ runner.arch }}-debug-

      # A SECOND cache for the Windows app's Linux typecheck, because it is a
      # second full swift-cross-ui compile. Its key prefix is distinct from
      # windows-build.yml's `windows-app-build-*` so a Linux object tree can
      # never be restored into a Windows job — same package, incompatible
      # everything.
      - name: Restore the Windows app's Linux typecheck directory
        id: winapp-typecheck-cache
        uses: actions/cache/restore@v6
        with:
          path: Apps/windows/.build
          key: >-
            linux-typecheck-windows-app-swift6.3-noble-${{ runner.os }}-${{
            runner.arch }}-${{ hashFiles('Apps/windows/Package.resolved') }}
          restore-keys: |
            linux-typecheck-windows-app-swift6.3-noble-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the Linux app
        # PKG_CONFIG_PATH resolves libtailscale.pc for the tsnet transport.
        # Build the executable product specifically so SwiftPM prunes to the
        # Linux subgraph (DefaultBackend→GtkBackend) — a bare `swift build`
        # would also try to compile swift-cross-ui's Windows-only WinUI backend.
        run: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift build --package-path Apps/linux-gtk --product tailscreen
      - name: Typecheck the Windows app
        # The Windows app builds HERE, on Linux, and that is the point.
        #
        # Its one genuinely Windows-bound file is WinUIVideoView, which carries
        # an `#if os(Windows)` and an off-Windows stub; the WinUI dependencies
        # are conditioned on `.windows` in its manifest so SwiftPM prunes them
        # away and swift-cross-ui resolves to GtkBackend, which this job already
        # has installed. Everything else in the app — the whole view layer, the
        # state machine, the share wiring — is portable and compiles here.
        #
        # It earns its place: a `condition ? closure : nil` in the app's `body`
        # made the Windows compiler answer "failed to produce diagnostic for
        # expression" and nothing else, forty minutes into a run, having built
        # 1,450 units of dependency first. The same error appears here in about
        # three, on a Linux runner that costs a tenth as much. The Windows job
        # remains the authority on whether it LINKS and RUNS; this one is the
        # authority on whether it typechecks, which is where the mistakes are.
        run: PKG_CONFIG_PATH="$PWD/Packages/TailscaleKit" swift build --package-path Apps/windows --product tailscreen
      - name: Headless render self-test (Xvfb + software GL)
        # Renders a 4-bar YUV frame through GtkVideoView, reads the pixels back,
        # and exits 0 only if the BT.709 output is correct — a CI-gated proof
        # the GL video path renders. The live tsnet leg is local-only (L0b).
        # Assert BOTH: the process exits 0 (bad pixels → exit 3, timeout → 124)
        # AND the PASS marker was actually printed, so a "graceful" early exit
        # (window closed / init failed) that never ran the check can't false-pass.
        # POSIX-sh compatible: the job's container shell is `sh` (dash), which
        # has no `set -o pipefail`, so we avoid the pipe entirely. Redirect to a
        # file (preserves the process exit code — a pipe to `tee` would mask it)
        # and capture the status via an `if` (so `set -e` doesn't abort first)
        # before printing the log and running the two assertions.
        run: |
          if timeout 90 xvfb-run -a -s "-screen 0 800x600x24" \
            env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            Apps/linux-gtk/.build/debug/tailscreen --render-self-test \
            > /tmp/gtk-selftest.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat /tmp/gtk-selftest.log
          test "$status" -eq 0
          grep -q 'CGTKVIDEO_SELFTEST result=PASS' /tmp/gtk-selftest.log

      # Both saves live at the end so they bank objects from a run that failed
      # the typecheck or the self-test — the compile is the expensive part and
      # it already happened. The product binaries are excluded: they are
      # relinked on every build regardless, and a smaller archive survives the
      # repo's shared 10 GB cache budget longer. (Exclusions apply at save;
      # restore extracts whatever the archive holds, so the two path specs need
      # not match.)
      - name: Save the GTK app's build directory
        if: >-
          ${{ !cancelled() && steps.gtk-build-cache.outcome == 'success'
          && steps.gtk-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Apps/linux-gtk/.build
            !Apps/linux-gtk/.build/**/debug/tailscreen
          key: >-
            linux-gtk-build-swift6.3-noble-${{ runner.os }}-${{ runner.arch
            }}-debug-${{ hashFiles('Apps/linux-gtk/Package.resolved') }}

      - name: Save the Windows app's Linux typecheck directory
        if: >-
          ${{ !cancelled() && steps.winapp-typecheck-cache.outcome == 'success'
          && steps.winapp-typecheck-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            Apps/windows/.build
            !Apps/windows/.build/**/debug/tailscreen
          key: >-
            linux-typecheck-windows-app-swift6.3-noble-${{ runner.os }}-${{
            runner.arch }}-${{ hashFiles('Apps/windows/Package.resolved') }}

  # The native Linux app on arm64 — GitHub's free arm64 runner for public
  # repos (ubuntu-24.04-arm) in the SAME swift:6.3-noble container as every
  # other Linux job. Three deliberate differences from the x64
  # `linux-app` leg:
  #   • builds -c release, not debug — one build does triple duty: the arm64
  #     release-config compile check, the binary the self-test gates, and the
  #     binary the artifact ships (the debug leg is already covered on x64;
  #     building both configs here would roughly double the job for no extra
  #     signal),
  #   • runs the same headless GL YUV-readback self-test — the proof this is a
  #     real leg (llvmpipe renders + BT.709 math verified on arm64), not
  #     compile-only,
  #   • stages + uploads `tailscreen-linux-arm64.tar.gz`. A plain tarball here
  #     on purpose: the arm64 AppImage exists, but it lives in
  #     release.yml (aarch64 linuxdeploy + appimagetool) — AppImage
  #     assembly is a packaging concern, not a per-PR gate, exactly as the
  #     x86_64 AppImage is release-only too.
  #
  # The steps live in app-linux.yml, shared with release.yml's arm64
  # packaging job — which was this job plus a tarball rename, down to the
  # duplicated README.txt wording inside the tarball.
  #
  # It stays on every push rather than being demoted to a nightly because the
  # reason to demote it was cost, and app-linux.yml's build cache is the cost.
  # Hard gate: no continue-on-error — an arm64 break is a real break.
  linux-app-arm64:
    name: linux-app-arm64
    uses: ./.github/workflows/app-linux.yml
    with:
      arch: arm64
      package: tarball
      artifact_name: tailscreen-linux-arm64

  lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint (baseline-gated)
        run: make lint

  format:
    # Apple's swift-format is published as a Homebrew core formula and
    # provides the `swift-format` binary that `make format-check` invokes.
    # The macos-latest runner image doesn't ship it on PATH (the Xcode
    # toolchain on the hosted runners doesn't expose `swift-format`
    # directly — `swift-format --version` exits 127), so we install it
    # explicitly via brew.
    #
    # Currently informational (continue-on-error: true) because the
    # config was tuned without a local swift-format run — we want the
    # first CI run on this branch to surface any drift between the
    # config and the existing style, then we flip this to required.
    # TODO: drop `continue-on-error` once the check is observed to pass.
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install swift-format
        run: brew install swift-format
      - name: Verify swift-format is available
        run: swift-format --version
      - name: Run swift-format check
        # `make format-check` runs `swift-format lint --strict` against
        # Sources/ and Tests/ using the repo's `.swift-format` config.
        run: make format-check

  test-tsan:
    # Thread Sanitizer build. Catches lock/continuation races that
    # strict-concurrency lets through. TSan flags a handful of known-OK
    # patterns in third-party C code (libtailscale, ScreenCaptureKit's
    # XPC) that we can't fix from Swift, so this job is informational
    # rather than required.
    #
    # TODO: Once the remaining noise is suppressed (via a TSan
    # suppressions file under .build/) or fixed upstream, remove
    # `continue-on-error` so this becomes a required check. Until then
    # we deliberately tolerate failures here — making it required
    # without first fixing the false positives would block every PR.
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    # See the `build` job: put libopus (+ libtailscale) on PKG_CONFIG_PATH so
    # SwiftPM resolves them on arm64 runners. The Makefile appends this.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Bootstrap libtailscale
        uses: ./.github/actions/bootstrap
        with:
          libtailscale: host
      - name: Install libopus
        run: brew install opus
      - name: Run tests under TSan
        run: make test-tsan

  # NOTE: there is deliberately no CI job for the tsnet E2E suites
  # (ScreenShareControlChannelTests / ScreenShareRequestToShareTests /
  # ScreenShareFanoutTests). They were tried on macos-latest via a Docker-free
  # native headscale (scripts/e2e-up-native.sh): headscale itself came up
  # healthy and minted a key, but the first tsnet `node.up()` hung indefinitely
  # — GitHub's hosted macOS runner sandbox doesn't let the userspace-WireGuard
  # handshake / DERP-STUN (:3478/udp) complete. `node.up()` has no internal
  # timeout, so the job just stalled. These suites are local-only; run them with
  # `make test-e2e-local` (Docker) or `scripts/e2e-up-native.sh` (Docker-free).

  # TEMPORARY DIAGNOSTIC — remove once the cache-reservation failure is
  # understood. See the W12 PR discussion.
  #
  # Every `Apps/*/.build` cache save in this workflow fails, on every run, with
  # "Unable to reserve cache with key <k>, another job may be creating this
  # cache" — for two different keys, with no other job referencing either, and
  # with the restores missing every time. Because the saves never land, the
  # builds stay cold AND pay ~75 s of tar-and-upload for nothing, which makes
  # this workflow about a minute SLOWER than before the caches were added.
  #
  # The leading hypothesis is the repo's 10 GB Actions cache budget: one save
  # (Windows x64, 313 MB) has been seen to succeed, so the mechanism works, and
  # a full bucket is one of the few things that fails a reservation rather than
  # a restore. That is unfalsifiable from job logs alone — it needs the cache
  # API, which needs a token no local checkout has but every workflow run does.
  # Hence a job: run the query where the credential already is.
  cache-audit:
    name: cache-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A diagnostic must never be the reason a PR is red. `set -euo pipefail`
    # below is there so a broken query is visible in THIS job rather than
    # silently printing zeroes; continue-on-error keeps that visibility from
    # blocking anything else.
    continue-on-error: true
    permissions:
      actions: read       # the caches API is gated on this, and nothing else here needs it
    steps:
      - name: Inventory the repository's Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # One row per cache so the sum is computed here rather than trusted
          # from a summary field.
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.size_in_bytes, .ref, .key] | @tsv' > rows.tsv

          count=$(wc -l < rows.tsv | tr -d ' ')
          total=$(awk -F'\t' '{s+=$1} END {print s+0}' rows.tsv)
          # GitHub's documented per-repository ceiling. Printed as the ratio
          # because "9.6 GB" only means something next to it.
          limit=$((10 * 1024 * 1024 * 1024))
          pct=$(awk -v t="$total" -v l="$limit" 'BEGIN {printf "%.1f", (t*100)/l}')

          {
            echo "## Actions cache inventory"
            echo ""
            echo "- entries: **$count**"
            echo "- total: **$(awk -v b="$total" 'BEGIN {printf "%.2f", b/1073741824}') GiB** of 10 GiB (**${pct}%**)"
            echo ""
            echo "### Largest 20"
            echo ""
            echo '```'
            sort -t$'\t' -k1,1nr rows.tsv | head -20 \
              | awk -F'\t' '{printf "%8.2f MiB  %-28s %s\n", $1/1048576, $2, $3}'
            echo '```'
            echo ""
            echo "### Do this workflow's own keys exist?"
            echo ""
            echo '```'
            for prefix in linux-gtk-build linux-typecheck-windows-app windows-app-build libtailscale; do
              n=$(cut -f3 rows.tsv | grep -c "^$prefix" || true)
              echo "$prefix: $n"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also to the job log, so this is readable without opening the summary.
          echo "entries=$count total=$total (${pct}% of 10 GiB)"
          sort -t$'\t' -k1,1nr rows.tsv | head -20 | awk -F'\t' '{printf "%8.2f MiB  %-28s %s\n", $1/1048576, $2, $3}'
