name: Build (docs-only)

# Companion to build.yml. That workflow's paths-ignore (**.md, LICENSE,
# .gitignore) makes it — and its REQUIRED build check — skip entirely on a
# docs-only pull request. The required check then stays permanently "expected"
# and the ruleset blocks the merge (there is no way for a docs-only PR to ever
# satisfy it). This workflow triggers on exactly those ignored paths and
# reports a passing build check with the SAME context name, so a docs-only PR
# is mergeable — without weakening the gate for any PR that touches code.
#
# On a mixed docs+code PR, both fire: build.yml runs the real macOS build
# (minutes) while this no-op finishes in seconds, so the real build is the
# most-recently-completed build check and remains authoritative — this no-op
# cannot mask a genuine build failure.
on:
  pull_request:
    paths:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Match build.yml so a superseding push cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id MUST stay `build` so the produced status-check context matches the
  # build context required by branch protection.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No build needed for docs-only changes
        run: |
          echo "Docs-only PR. build.yml is path-skipped, so this companion satisfies the required build check."
