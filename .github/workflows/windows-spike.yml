name: Windows spike

# Runs the Windows Go↔native bridge spike (spikes/windows-tsnet-bridge) on a
# real Windows runner. Cross-compiling from Linux proves it builds and links;
# only this proves it works.
#
# NOT a merge gate — nothing in the shipping product depends on it yet, and it
# needs a Windows runner the normal CI matrix doesn't carry.
#
# The push trigger is deliberately path-scoped to the spike itself: a Windows
# runner shouldn't start for unrelated work, but a spike whose whole purpose is
# to produce an answer is useless if running it needs a PR and a label first.
# The label and dispatch triggers remain for re-running it on demand.
on:
  push:
    paths:
      - 'spikes/windows-tsnet-bridge/**'
      - '.github/workflows/windows-spike.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Go↔native bridge
    # `pull_request: [labeled]` fires for every label; only ours should start a
    # Windows runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-spike'
    runs-on: windows-latest

    defaults:
      run:
        shell: bash
        working-directory: spikes/windows-tsnet-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      # Leg A: the primitives, no C toolchain involved. If this fails, the
      # Windows replacements for socketpair/SCM_RIGHTS don't hold and the whole
      # bridge design needs rethinking.
      - name: Leg A — bridge primitives (pure Go)
        env:
          CGO_ENABLED: '0'
        run: go test -v ./...

      # Leg B: the same handle, read by real C across a c-archive boundary.
      - name: Leg B — build the c-archive
        env:
          CGO_ENABLED: '1'
        run: go build -buildmode=c-archive -o spike.a .

      - name: Leg B — link the C harness
        run: |
          # windows-latest ships mingw-w64 gcc; fall back to the MSYS2 copy if
          # the bare name isn't on PATH.
          if command -v gcc >/dev/null; then
            CC=gcc
          elif [ -x /c/msys64/mingw64/bin/gcc.exe ]; then
            CC=/c/msys64/mingw64/bin/gcc.exe
          else
            echo "no gcc found on the runner" >&2
            exit 1
          fi
          echo "using $CC"
          "$CC" -I. -o harness.exe harness/harness.c spike.a \
            -lws2_32 -lntdll -lbcrypt -lwinmm -luserenv -lsynchronization \
            -ladvapi32 -lkernel32

      - name: Leg B — run the C harness
        run: ./harness.exe

      - name: Summary
        if: always()
        run: |
          {
            echo "## Windows bridge spike (W0)"
            echo ""
            echo "Leg A — socketpair/SCM_RIGHTS replacements, pure Go."
            echo "Leg B — the same handle read by real C recv() across a c-archive."
            echo ""
            echo "Green means the Windows bridge can keep libtailscale's existing"
            echo "C API shape (an \`int\` the caller recv()s on). It says nothing"
            echo "about tsnet, throughput, or the sharer's inbound listeners."
          } >> "$GITHUB_STEP_SUMMARY"

  libtailscale:
    name: libtailscale c-archive
    # W1: the bridge for real. Proves the patched libtailscale — the actual
    # shipping dependency, not a spike — builds for Windows with a native
    # toolchain. Cross-building from Linux with mingw proves less: it can hide
    # toolchain differences that only surface here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-spike'
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      # The Makefile's patch loop, run directly: `make` here would also try to
      # build for the host, and the point is the Windows archive.
      - name: Apply the TailscaleKit patch series
        working-directory: Packages/TailscaleKit
        run: |
          for p in Patches/*.patch; do
            echo "applying $(basename "$p")"
            patch -p1 -N -F0 -r - --no-backup-if-mismatch < "$p"
          done

      - name: Build libtailscale.a for windows/amd64
        working-directory: Packages/TailscaleKit/upstream/libtailscale
        env:
          CGO_ENABLED: '1'
        run: |
          go build -buildmode=c-archive -o libtailscale.a .
          ls -la libtailscale.a libtailscale.h

      - name: Summary
        if: always()
        run: |
          {
            echo "## libtailscale on Windows (W1)"
            echo ""
            echo "The patched c-archive built for windows/amd64 with a native"
            echo "toolchain. This is the real dependency, not the spike — the"
            echo "socketpair and SCM_RIGHTS paths now go through the platform"
            echo "seam in bridge.go / bridge_unix.go / bridge_windows.go."
            echo ""
            echo "Still unproven here: a live tsnet node on Windows."
          } >> "$GITHUB_STEP_SUMMARY"
