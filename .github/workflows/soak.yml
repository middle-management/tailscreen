name: Soak

# Nightly long-run soak tier: the ParserFuzzTests harness at ~50× the PR
# iteration budget plus the seeded LossyChannel impairment matrix (see
# Apps/macOS/Tests/TailscreenTests/SoakTests.swift). Everything is deterministic — every
# case derives its seed from its matrix coordinates, so a red nightly names
# the exact reproducing configuration. `workflow_dispatch` for on-demand runs
# (used once to validate the workflow itself).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  soak:
    runs-on: macos-latest
    # Budget guard: the run is tens of minutes; the runner default of 360
    # minutes on a 10×-billed macOS runner would be an expensive hang.
    timeout-minutes: 60
    # Same reason as `build.yml`'s build job: SwiftPM on Apple-silicon runners
    # does not search Homebrew's pkgconfig dir, so OpusKit's `pkgConfig: "opus"`
    # cannot find opus.pc without this. Set job-wide rather than exported inside
    # the run step, which is what this workflow used to do — an inline export
    # naming only the TailscaleKit dir SHADOWS the brew path instead of adding
    # to it, so installing libopus alone would not have been enough.
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/Packages/TailscaleKit:/opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Version derived from the submodule's go.mod, not pinned here.
          #
          # That file says `go 1.25.5`, so a literal '1.21' provisioned a
          # toolchain Go then immediately replaced itself: the arm64 probe's log
          # showed `go: downloading go1.25.5 (windows/arm64)` mid-build, ~22s of
          # it. The pin was simultaneously a fiction and a download — every job
          # here paid for a toolchain it did not end up using.
          #
          # go.mod is now the single source of truth, so a submodule bump moves
          # CI with it instead of silently re-triggering the same download.
          go-version-file: Packages/TailscaleKit/upstream/libtailscale/go.mod
          # Explicit rather than relying on the action's default, and
          # paired with cache-dependency-path — without a path the
          # action looks for go.sum in the working directory, finds
          # none at the repo root, and caches nothing while appearing
          # configured. Three workflows here were in exactly that state.
          cache: true
          cache-dependency-path: Packages/TailscaleKit/upstream/libtailscale/go.sum
      - name: Build libtailscale
        run: make tailscale
      # The step this workflow never had. OpusKit's COpus systemLibrary resolves
      # libopus through pkg-config, and the soak target links it transitively —
      # so without this the job dies in `emit-module` with "'opus.h' file not
      # found" about 20 seconds in, before a single soak case runs. Nineteen
      # consecutive nightlies failed that way (last green 2026-07-17), which is
      # what a red check nobody reads costs: the fuzz-and-impairment tier has not
      # actually run since the Opus migration landed.
      - name: Install libopus
        run: brew install opus
      - name: Run soak tests
        # SoakTests self-skip without TAILSCREEN_SOAK=1, so PR CI and local
        # `make test` never pay for the long run. Tee the console so a red
        # nightly's reproducing seed/config survives as an artifact.
        run: |
          set -o pipefail
          cd Apps/macOS
          TAILSCREEN_SOAK=1 swift test --filter SoakTests 2>&1 | tee "$GITHUB_WORKSPACE/soak.log"
      - name: Upload soak log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-log
          path: |
            soak.log
            Apps/macOS/.build/**/*.xcresult
          if-no-files-found: warn
          retention-days: 14
