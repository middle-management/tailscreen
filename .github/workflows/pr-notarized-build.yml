name: PR Notarized Build

# Builds a universal (arm64 + x86_64), signed + notarized Tailscreen.app for a
# pull request on demand, and uploads it as a workflow artifact. Use this to
# smoke-test features that only work in a bundled/notarized .app —
# UNUserNotificationCenter, TCC prompts, Gatekeeper — which a plain
# `swift build` debug binary can't exercise (no CFBundleIdentifier).
#
# The BUILD lives in app-macos.yml, shared with release.yml. What
# remains here is the PR-shaped half: the label dance and the result comment.
# Those are separate JOBS rather than steps because a job that calls a reusable
# workflow can carry no steps of its own — that is the one structural cost of
# sharing the definition, and it buys eleven steps that no longer exist twice.
#
# Trigger: add the `build:notarized` label to a PR. The label is removed again
# when the run starts, so re-adding it kicks off a fresh build against the
# latest PR head.
#
# SECURITY: this uses `pull_request` (NOT `pull_request_target`), so the Apple
# signing secrets are exposed only to same-repo branch PRs. A PR from a fork
# gets no secrets and falls through to the unsigned path (same behaviour as the
# Release workflow). Never switch this to `pull_request_target` — that would
# hand the Developer ID signing identity to untrusted fork code. `secrets:
# inherit` below does not widen that: it passes the same (possibly empty) set
# this workflow already had.
#
# Signing + notarization run only when ALL of these secrets are set; otherwise
# the app is built unsigned:
#   APPLE_DEVELOPER_ID_CERT_P12      base64-encoded .p12 of the
#                                    "Developer ID Application" cert
#   APPLE_DEVELOPER_ID_CERT_PASSWORD password protecting the .p12
#   APPLE_NOTARY_API_KEY_P8          base64-encoded App Store Connect
#                                    API key (.p8)
#   APPLE_NOTARY_API_KEY_ID          API key id (10 chars)
#   APPLE_NOTARY_API_ISSUER_ID       API issuer UUID

on:
  pull_request:
    types: [labeled]

# One in-flight build per PR; a newer label re-add supersedes an older run.
#
# The label name is part of the group for the same reason windows-build.yml's
# is: `pull_request: [labeled]` fires once PER LABEL, so adding two labels in
# one API call produces two runs. Every job here gates on
# `label.name == 'build:notarized'`, so the run for the OTHER label exists only
# to evaluate its `if` and skip — and with the label out of the group it lands
# in the same one and cancels a real build mid-flight.
concurrency:
  group: pr-notarized-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # remove the trigger label + post a result comment

jobs:
  # Its own job only because the build below is a reusable-workflow call, which
  # admits no sibling steps. Kept FIRST so re-adding the label always yields a
  # fresh run, and a failed/cancelled run doesn't leave a stale label implying
  # success.
  unlabel:
    name: Remove trigger label
    if: github.event.label.name == 'build:notarized'
    runs-on: ubuntu-latest
    steps:
      - name: Remove trigger label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/build:notarized" \
            || true

  build:
    # Only when the `build:notarized` label was the one just added.
    if: github.event.label.name == 'build:notarized'
    name: Build & notarize PR app
    needs: unlabel
    uses: ./.github/workflows/app-macos.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      # macOS wants a numeric CFBundleShortVersionString; the SHA rides the
      # artifact name, not the plist.
      version: 0.0.${{ github.event.pull_request.number }}
      label: pr${{ github.event.pull_request.number }}
      include_commit_in_name: true
      upload_artifact: true
      # A PR smoke-test build is not shipped, so it may take the libtailscale
      # cache — the whole point is a fast turnaround on a labelled PR.
      cache: true
    secrets: inherit

  comment:
    name: Comment result on PR
    if: always() && github.event.label.name == 'build:notarized'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Comment result on PR
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: Tailscreen
          SHORT: ${{ needs.build.outputs.short_sha }}
          SIGNED: ${{ needs.build.outputs.signed }}
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            if [ "$SIGNED" = "true" ]; then
              state="✅ Signed + notarized \`${APP_NAME}.app\` built for \`${SHORT}\`."
            else
              state="⚠️ **Unsigned** \`${APP_NAME}.app\` built for \`${SHORT}\` (signing secrets unavailable — fork PR?)."
            fi
            body="${state}

          Download the artifact from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (GitHub login required). Re-add the \`build:notarized\` label to rebuild against the latest commit."
          else
            body="❌ Notarized build failed for \`${SHORT:-this commit}\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
          # --repo is REQUIRED here: this is a bare job with no checkout (it
          # became its own job because one that `uses:` a reusable workflow can
          # carry no steps), so gh has no git remote to infer from and exits
          # with "fatal: not a git repository". The `unlabel` job above never
          # hit this because `gh api` takes the repo in its path.
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body "$body"
