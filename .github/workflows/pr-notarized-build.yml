name: PR Notarized Build

# Builds a universal (arm64 + x86_64), signed + notarized Tailscreen.app for a
# pull request on demand, and uploads it as a workflow artifact. Use this to
# smoke-test features that only work in a bundled/notarized .app —
# UNUserNotificationCenter, TCC prompts, Gatekeeper — which a plain
# `swift build` debug binary can't exercise (no CFBundleIdentifier).
#
# Trigger: add the `build:notarized` label to a PR. The label is removed again
# when the run starts, so re-adding it kicks off a fresh build against the
# latest PR head.
#
# SECURITY: this uses `pull_request` (NOT `pull_request_target`), so the Apple
# signing secrets are exposed only to same-repo branch PRs. A PR from a fork
# gets no secrets and falls through to the unsigned path (same behaviour as the
# Release workflow). Never switch this to `pull_request_target` — that would
# hand the Developer ID signing identity to untrusted fork code.
#
# Signing + notarization run only when ALL of these secrets are set; otherwise
# the app is built unsigned:
#   APPLE_DEVELOPER_ID_CERT_P12      base64-encoded .p12 of the
#                                    "Developer ID Application" cert
#   APPLE_DEVELOPER_ID_CERT_PASSWORD password protecting the .p12
#   APPLE_NOTARY_API_KEY_P8          base64-encoded App Store Connect
#                                    API key (.p8)
#   APPLE_NOTARY_API_KEY_ID          API key id (10 chars)
#   APPLE_NOTARY_API_ISSUER_ID       API issuer UUID

on:
  pull_request:
    types: [labeled]

# One in-flight build per PR; a newer label re-add supersedes an older run.
concurrency:
  group: pr-notarized-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # remove the trigger label + post a result comment

jobs:
  build:
    # Only when the `build:notarized` label was the one just added.
    if: github.event.label.name == 'build:notarized'
    name: Build & notarize PR app
    runs-on: macos-15

    env:
      APP_NAME: Tailscreen
      BUNDLE_ID: se.middlemanagement.tailscreen
      # macOS wants a numeric CFBundleShortVersionString; the SHA rides the
      # artifact name, not the plist.
      APP_VERSION: 0.0.${{ github.event.pull_request.number }}

    steps:
      - name: Remove trigger label
        # Do this first so re-adding the label always yields a fresh run, and a
        # failed/cancelled run doesn't leave a stale label implying success.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/build:notarized" \
            || true

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Version derived from the submodule's go.mod, not pinned here.
          #
          # That file says `go 1.25.5`, so a literal '1.21' provisioned a
          # toolchain Go then immediately replaced itself: the arm64 probe's log
          # showed `go: downloading go1.25.5 (windows/arm64)` mid-build, ~22s of
          # it. The pin was simultaneously a fiction and a download — every job
          # here paid for a toolchain it did not end up using.
          #
          # go.mod is now the single source of truth, so a submodule bump moves
          # CI with it instead of silently re-triggering the same download.
          go-version-file: Packages/TailscaleKit/upstream/libtailscale/go.mod
          # Explicit rather than relying on the action's default, and
          # paired with cache-dependency-path — without a path the
          # action looks for go.sum in the working directory, finds
          # none at the repo root, and caches nothing while appearing
          # configured. Three workflows here were in exactly that state.
          cache: true
          cache-dependency-path: Packages/TailscaleKit/upstream/libtailscale/go.sum

      - name: Apply libtailscale patches
        working-directory: Packages/TailscaleKit
        run: make apply-patches

      - name: Build universal libtailscale.a
        working-directory: Packages/TailscaleKit/upstream/libtailscale
        run: |
          set -euxo pipefail

          rm -f libtailscale.a libtailscale.h

          GOARCH=arm64 \
            CGO_CFLAGS="-arch arm64" \
            CGO_LDFLAGS="-arch arm64" \
            make c-archive
          cp libtailscale.a /tmp/libtailscale-arm64.a
          rm -f libtailscale.a

          GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" \
            CGO_LDFLAGS="-arch x86_64" \
            make c-archive
          cp libtailscale.a /tmp/libtailscale-amd64.a

          lipo -create \
            /tmp/libtailscale-arm64.a \
            /tmp/libtailscale-amd64.a \
            -output libtailscale.a

          lipo -info libtailscale.a

      - name: Build universal static libopus
        # OpusKit links libopus. A Homebrew `libopus.dylib` is (a) host-arch
        # only — it can't satisfy the x86_64 slice of the universal build —
        # and (b) an absolute /opt/homebrew path that wouldn't exist on a
        # user's Mac. So build a *static, universal* libopus from source and
        # point pkg-config at it: the .a's right slice links into each arch
        # and nothing dynamic ships in the .app. Cross-arch autotools uses
        # `--host` so configure never executes a wrong-arch test binary.
        run: |
          set -euxo pipefail
          OPUS_VERSION=1.5.2
          curl -fsSL "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz" \
            -o /tmp/opus.tar.gz
          mkdir -p /tmp/opus-src
          tar xzf /tmp/opus.tar.gz -C /tmp/opus-src --strip-components=1
          cd /tmp/opus-src
          build_arch() {
            arch="$1"; host="$2"
            make distclean >/dev/null 2>&1 || true
            ./configure --host="$host" --disable-shared --enable-static \
              --disable-doc --disable-extra-programs \
              CFLAGS="-arch $arch -O2" LDFLAGS="-arch $arch"
            make -j"$(sysctl -n hw.ncpu)"
            cp .libs/libopus.a "/tmp/libopus-${arch}.a"
          }
          # aarch64, not arm: an `arm-*` host makes opus configure target
          # 32-bit ARM and emit GNU-syntax .S assembly that Apple's clang
          # assembler rejects; aarch64 uses NEON intrinsics instead.
          build_arch arm64 aarch64-apple-darwin
          build_arch x86_64 x86_64-apple-darwin
          PREFIX=/tmp/opus-universal
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include/opus"
          lipo -create /tmp/libopus-arm64.a /tmp/libopus-x86_64.a \
            -output "$PREFIX/lib/libopus.a"
          lipo -info "$PREFIX/lib/libopus.a"
          cp include/*.h "$PREFIX/include/opus/"
          cat > "$PREFIX/lib/pkgconfig/opus.pc" <<PC
          prefix=$PREFIX
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: opus
          Description: Opus codec (universal static, release build)
          Version: ${OPUS_VERSION}
          Libs: -L\${libdir} -lopus
          Cflags: -I\${includedir}/opus
          PC

      - name: Build universal Tailscreen binary
        env:
          PKG_CONFIG_PATH: /tmp/opus-universal/lib/pkgconfig:${{ github.workspace }}/Packages/TailscaleKit
        working-directory: Apps/macOS
        run: |
          set -euxo pipefail
          swift build -c release --arch arm64 --arch x86_64
          lipo -info .build/apple/Products/Release/${APP_NAME}
          if otool -L ".build/apple/Products/Release/${APP_NAME}" | grep -qi 'opus'; then
            echo "error: Tailscreen dynamically links libopus — expected static" >&2
            otool -L ".build/apple/Products/Release/${APP_NAME}" | grep -i opus >&2
            exit 1
          fi

      - name: Assemble Tailscreen.app
        run: |
          set -euxo pipefail
          APP="${APP_NAME}.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "Apps/macOS/.build/apple/Products/Release/${APP_NAME}" "$APP/Contents/MacOS/"
          cp -R "Apps/macOS/.build/apple/Products/Release/${APP_NAME}_${APP_NAME}.bundle" \
            "$APP/Contents/Resources/"
          cp Apps/macOS/Resources/Tailscreen.icns "$APP/Contents/Resources/${APP_NAME}.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIconFile</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.2</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>Tailscreen uses your microphone for two-way voice during screen sharing.</string>
          </dict>
          </plist>
          EOF

      - name: Check signing availability
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PW:  ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PW" ] \
             && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] \
             && [ -n "$NOTARY_ISSUER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not fully set (e.g. a fork PR) — building unsigned app."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Codesign Tailscreen.app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euxo pipefail

          echo "--- All identities in build keychain ---"
          security find-identity "$KEYCHAIN_PATH" || true
          echo "--- Valid codesigning identities (search list) ---"
          security find-identity -v -p codesigning || true
          echo "--------------------------------------------------"

          IDENTITY_HASH="$(security find-identity -v -p codesigning \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::No valid 'Developer ID Application' codesigning identity. See identity dump above."
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --deep \
            --sign "$IDENTITY_HASH" \
            "${APP_NAME}.app"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "${APP_NAME}.app"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$APPLE_NOTARY_API_KEY_P8" | base64 --decode > "$KEY_PATH"

          NOTARIZE_ZIP="$RUNNER_TEMP/${APP_NAME}-notarize.zip"
          /usr/bin/ditto -c -k --keepParent "${APP_NAME}.app" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "${APP_NAME}.app"
          xcrun stapler validate "${APP_NAME}.app"

          rm -f "$KEY_PATH" "$NOTARIZE_ZIP"

      - name: Package zip
        id: package
        run: |
          set -euxo pipefail
          ZIP_NAME="${APP_NAME}-pr${{ github.event.pull_request.number }}-${{ steps.sha.outputs.short }}-macOS.zip"
          /usr/bin/ditto -c -k --keepParent "${APP_NAME}.app" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload app artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-pr${{ github.event.pull_request.number }}-${{ steps.sha.outputs.short }}
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Comment result on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          signed="${{ steps.signing.outputs.enabled }}"
          if [ "${{ job.status }}" = "success" ]; then
            if [ "$signed" = "true" ]; then
              state="✅ Signed + notarized \`${APP_NAME}.app\` built for \`${{ steps.sha.outputs.short }}\`."
            else
              state="⚠️ **Unsigned** \`${APP_NAME}.app\` built for \`${{ steps.sha.outputs.short }}\` (signing secrets unavailable — fork PR?)."
            fi
            body="${state}

          Download the artifact from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) (GitHub login required). Re-add the \`build:notarized\` label to rebuild against the latest commit."
          else
            body="❌ Notarized build failed for \`${{ steps.sha.outputs.short }}\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body"

      - name: Cleanup keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
