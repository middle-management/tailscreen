name: Windows build

# Builds the Swift side of Tailscreen on Windows, on the way to a runnable WinUI
# app (docs/viewer-windows-plan.md, W2–W4). Not a merge gate yet — nothing on
# Windows ships.
#
# Pinned to Swift 6.1. A matrix over 6.0.3/6.1/6.2 was used to find which
# toolchain works on this runner image (win25-vs2026), and it answered:
#
#   6.0.3 — fails with `could not build module 'ucrt'` before compiling any of
#           our code. Its module maps predate the image's Windows SDK.
#   6.1   — builds everything: protocol tier, the WinUI app, viewer and sharer.
#   6.2   — dies compiling swift-cross-ui, twice, at the same file
#           (_RemoveGlobalActorIsolation.swift), with exit code 1 and NO
#           diagnostic — a frontend killed rather than a source error. Capping
#           parallelism at -j 2 did not change it, which rules out the memory
#           pressure that was the obvious first guess. Same sources compile
#           clean on 6.1, so this reads as a 6.2 defect on a third-party
#           dependency rather than anything in this repo.
#
# 6.2 is therefore not in the matrix: a permanently red leg for a compiler bug
# we don't control teaches nothing and hides real regressions. Worth retrying
# when 6.3 lands or swift-cross-ui moves.
#
# Steps deliberately do NOT use continue-on-error: a failing step should BE the
# error, with its compiler output attached, rather than something a later
# summary step reports second-hand.
#
# The push trigger is path-scoped: a Windows runner shouldn't start for unrelated
# work, but a job whose whole purpose is to produce an answer is useless if
# running it needs a label first.
#
# EVERY package the Windows job builds from must be listed below, and the list
# had a hole: `Packages/WASAPIKit/**` was missing when W5 added it, so the commit
# that fixed the shim's STL error changed only files under that path and no
# Windows runner started. The branch then showed fourteen green checks while the
# last actual Windows result was a failure two commits earlier. TailscaleKit and
# OpusKit were missing for the same reason and had been all along — a patch-025
# change is exactly what this job exists to validate.
#
# The rule was originally written as "if a package is in the app's dependency
# graph, it belongs in both the trigger and the cache key" — and that phrasing is
# what let the hole happen a SECOND time. `packaging/windows/` and
# `scripts/windows/` are not packages and are not in any dependency graph; they
# are inputs to the MSIX job, and the rule as stated did not reach them.
#
# So, stated to cover what it actually needs to cover: IF A FILE IS AN INPUT TO
# ANY JOB IN THIS WORKFLOW, IT BELONGS IN THIS LIST. Packages, scripts, manifests,
# assets. Then separately check the cache key, which only cares about the subset
# that changes what gets compiled.
on:
  push:
    paths:
      - 'Packages/TailscreenKit/**'
      - 'Packages/TailscaleKit/**'
      - 'Packages/OpusKit/**'
      - 'Packages/FFmpegKit/**'
      - 'Packages/TailscreenVideoFFmpeg/**'
      - 'Packages/WASAPIKit/**'
      - 'Packages/WGCCaptureKit/**'
      - 'Packages/TailscreenSharerWGC/**'
      - 'Packages/SendInputKit/**'
      - 'Packages/WinOverlayKit/**'
      - 'Packages/TailscreenHubUI/**'
      - 'Apps/windows/**'
      - 'scripts/materialize-symlinks.sh'
      # The MSIX job's inputs. Missing at first, and the hole reproduced the
      # WASAPIKit one described above almost exactly: the commit fixing
      # make-msix.ps1's exit-code bug touched that script and a .md, so the
      # negation below removed the doc and nothing matched the script — no
      # Windows runner started, and the fix sat unverified while the branch
      # looked fine. Found only by going to read a run that did not exist.
      - 'packaging/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-build.yml'
      # Doc-only edits under those paths still don't warrant a 20-minute
      # Windows runner. Negative patterns are evaluated after the positive
      # ones, so this subtracts rather than replacing them.
      - '!**/*.md'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer push to the same branch cancels the older in-flight run, exactly as
# `build.yml` already does.
#
# Added after four Windows runs sat in the queue at once for four consecutive
# commits, three of them already superseded — at ~25 minutes each that is both
# a lot of runner time and, worse, a long delay before the run that actually
# matters gets an answer. A superseded Windows result teaches nothing: the
# branch tip is what ships.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Swift ${{ matrix.swift }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        swift: ['6.1']

    steps:
      # Windows checkouts don't create symlinks unless this is on and the
      # account may create them. TailscaleKit's Sources/ and include/ are
      # symlinks into the submodule, and without this they arrive as text files
      # containing their target path — which SwiftPM reports as an invalid
      # custom path, aborting the entire package graph before anything compiles.
      - name: Allow symlinks in git
        run: git config --global core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The patch series MUST be applied before the symlinks are materialized:
      # the patches edit the submodule's Swift sources in place, and
      # materialize copies that directory. Copy first and you get pristine
      # upstream, whose `import Combine` is ungated and fails on Windows with
      # `no such module 'Combine'` — a portability error for code that is
      # already portable, just not yet patched.
      #
      # This is the Makefile's apply-patches loop inlined, because `make` isn't
      # on the Windows image. GNU `patch` is: Git for Windows ships it in
      # usr/bin, which is already on PATH. Compile-time only — no Go build is
      # needed for the header.
      - name: Apply the TailscaleKit patch series
        shell: bash
        working-directory: Packages/TailscaleKit
        run: |
          for p in Patches/*.patch; do
            echo "applying $(basename "$p")"
            patch -p1 -N -F0 -r - --no-backup-if-mismatch < "$p"
          done
          grep -n 'canImport(Combine)' Sources/TailscaleKit/IncomingConnection.swift \
            || { echo "patches did not take: Combine import still ungated" >&2; exit 1; }

      # Belt and braces: core.symlinks only helps if the runner is also allowed
      # to create them. This makes real copies of any that came through as text.
      - name: Materialize symlinks
        shell: bash
        run: ./scripts/materialize-symlinks.sh --force

      # From W3 the app links libtailscale, so the Go c-archive has to exist
      # before `swift build` runs. The patch series above supplies
      # bridge_windows.go (patch 024), without which this does not compile at
      # all — it is what replaces the socketpair + SCM_RIGHTS handoff that has
      # no Windows equivalent.
      #
      # Not `make tailscale`: make isn't on the Windows image, and the Makefile
      # target does Unix-only path handling around the same two commands.
      #
      # The module cache is keyed on the submodule's go.sum — most of the
      # c-archive step's ~100s is downloading Tailscale's dependency set, and
      # that set moves only when the submodule does.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Version derived from the submodule's go.mod, not pinned here.
          #
          # That file says `go 1.25.5`, so a literal '1.21' provisioned a
          # toolchain Go then immediately replaced itself: the arm64 probe's log
          # showed `go: downloading go1.25.5 (windows/arm64)` mid-build, ~22s of
          # it. The pin was simultaneously a fiction and a download — every job
          # here paid for a toolchain it did not end up using.
          #
          # go.mod is now the single source of truth, so a submodule bump moves
          # CI with it instead of silently re-triggering the same download.
          go-version-file: Packages/TailscaleKit/upstream/libtailscale/go.mod
          # Explicit rather than relying on the action's default, and
          # paired with cache-dependency-path — without a path the
          # action looks for go.sum in the working directory, finds
          # none at the repo root, and caches nothing while appearing
          # configured. Three workflows here were in exactly that state.
          cache: true
          cache-dependency-path: Packages/TailscaleKit/upstream/libtailscale/go.sum

      - name: Build libtailscale.a for windows/amd64
        shell: bash
        working-directory: Packages/TailscaleKit/upstream/libtailscale
        env:
          CGO_ENABLED: '1'
        run: |
          go build -buildmode=c-archive -o libtailscale.a .
          ls -la libtailscale.a libtailscale.h

      # `Packages/TailscaleKit/lib/libtailscale.a` is a symlink whose target is
      # this build artifact, so materialize-symlinks.sh deliberately skipped it
      # earlier ("target absent; leaving as-is") and it is still a dangling link
      # (or a text file) now. Delete before copying: `cp` onto a dangling
      # symlink follows it and would try to copy the archive over itself.
      - name: Stage libtailscale for the linker
        shell: bash
        run: |
          rm -f Packages/TailscaleKit/lib/libtailscale.a
          mkdir -p Packages/TailscaleKit/lib
          cp Packages/TailscaleKit/upstream/libtailscale/libtailscale.a Packages/TailscaleKit/lib/

          # ALSO under the MSVC name. Modules/libtailscale/module.modulemap says
          # `link "tailscale"`, so the Swift driver emits -ltailscale, and on
          # Windows that resolves to `tailscale.lib` — not `libtailscale.a`,
          # which is the Unix spelling the Makefile produces and every other
          # platform expects. Without this the build compiles cleanly and dies at
          # the very last step with
          #
          #   lld-link: error: could not open 'tailscale.lib'
          #
          # Same bytes under both names rather than a rename, so nothing that
          # looks for the Unix artifact (the Makefile, the Linux jobs, the
          # symlink's own target path) stops finding it.
          cp Packages/TailscaleKit/upstream/libtailscale/libtailscale.a \
             Packages/TailscaleKit/lib/tailscale.lib
          ls -la Packages/TailscaleKit/lib/
          # The module map reads include/tailscale.h — the hand-written API
          # header, not cgo's generated libtailscale.h. Materialization already
          # made it a real file; assert that rather than assume it.
          test -f Packages/TailscaleKit/include/tailscale.h

          # A native path for the linker's /LIBPATH:, which does not understand
          # the MSYS `/d/a/...` form bash reports.
          #
          # Computed in plain steps rather than as one clever substitution: the
          # first version was `cd X && pwd -W 2>/dev/null || cd X && pwd`, and
          # `A && B || C && D` parses as `((A && B) || C) && D` — so BOTH pwds
          # ran and wrote two lines into GITHUB_ENV, the second of which is not
          # KEY=VALUE. GitHub rejected the whole file command.
          lib_dir="$PWD/Packages/TailscaleKit/lib"
          if native=$(cygpath -w "$lib_dir" 2>/dev/null) && [ -n "$native" ]; then
            lib_dir="$native"
          fi
          echo "staged libtailscale at: $lib_dir"
          echo "TAILSCALE_LIB=$lib_dir" >> "$GITHUB_ENV"

      # From W4 the app decodes video, so it links libavcodec. Same prebuilt
      # LGPL 7.1 build the `ffmpeg` job gates on — see that job for why LGPL is
      # a licensing requirement and not a convenience.
      - name: Download FFmpeg (LGPL shared, 7.1)
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$url"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
          root=$(find "$RUNNER_TEMP/ffmpeg" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$root" ] || { echo "unexpected archive layout" >&2; exit 1; }
          native=$(cygpath -w "$root" 2>/dev/null || echo "$root")
          echo "FFMPEG_ROOT=$native" >> "$GITHUB_ENV"

      - name: Setup Swift ${{ matrix.swift }}
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      # libopus for the TailscreenAudio tier. vcpkg ships with the runner
      # image, so this is an install rather than a bootstrap.
      #
      # COpus is a systemLibrary with `pkgConfig: "opus"`, but Windows has no
      # pkg-config binary, so the header and library paths are passed
      # explicitly on the build lines below instead. Note the include path ends
      # in /opus: as COpus/shim.h documents, opus.pc's Cflags point *into* the
      # opus/ header dir, so the include is <opus.h>, not <opus/opus.h>.
      #
      # Retried because this step fetches opus's source tarball from github.com
      # and a `curl error 35 (SSL connect error)` there failed a whole run once.
      # vcpkg prints "Not a transient network error, won't retry" for code 35,
      # which is its classification, not a fact — an SSL handshake that fails
      # against github.com is exactly the kind of thing that succeeds seconds
      # later. Retrying here rather than arguing with vcpkg's taxonomy.
      - name: Install libopus (vcpkg)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install opus:x64-windows; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "vcpkg install opus failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::vcpkg install opus failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "OPUS_ROOT=$root" >> "$GITHUB_ENV"
          ls -la "$root/include/opus/opus.h"
          ls -la "$root/lib/"

      # ---------------------------------------------------------------------
      # Only PROBE steps survive here, and that is a deliberate cut.
      #
      # This job used to build nine packages before the app: TailscreenProtocol,
      # WASAPIKit, WGCCaptureKit, SendInputKit, WinOverlayKit, TailscreenHubUI,
      # TailscreenSharerWGC, TailscreenViewer, TailscreenSharer. Measured on a
      # warm run they cost 787s of a 1303s job — 60 % — and TailscreenHubUI
      # alone was 463s, 35 % of the whole thing, because building it standalone
      # compiles swift-cross-ui from scratch in ITS OWN .build directory.
      #
      # Every one of them is a dependency of Apps/windows (directly, or through
      # TailscreenSharerWGC), so `Build the app` already compiles all of them —
      # in the .build directory that IS cached. The pre-steps were therefore
      # doing the same work twice, and the expensive copy was the uncached one.
      #
      # What they bought was a precise failure location. That is worth paying
      # for, but not twice: Linux CI already typechecks every one of them on a
      # cheap runner, and names the file when it fails —
      #
      #   TailscreenHubUI      → linux-gtk-viewer, "Typecheck the Windows app"
      #   TailscreenSharerWGC  → linux-viewer, "Typecheck the Windows sharer backend"
      #   WinOverlayKit        → linux-viewer, "Typecheck the Windows annotation overlay"
      #   TailscreenProtocol   → linux-protocol
      #   TailscreenViewer     → linux-viewer, TailscreenSharer → linux-protocol
      #
      # So localization moved to the runner where it costs three minutes instead
      # of the one where it cost thirteen.
      #
      # The three that remain build PROBE EXECUTABLES, and that is the whole
      # reason they are not redundant: a SwiftPM library target is compiled but
      # never LINKED, so Linux typechecking cannot catch a missing import
      # library — the failure mode that once let WASAPIKit's four undefined GUID
      # symbols pass their own step and surface eleven minutes later in the app.
      # Linking is Windows-only, it is what these probes force, and together
      # they cost 112s.
      #
      # If you add a package to the app's graph, do NOT add a build step here.
      # Add it to the Linux typecheck job instead, and add a probe here only if
      # it links something new.
      # ---------------------------------------------------------------------

      # WASAPIKit before the app, not with it. It is a few hundred lines of COM
      # against SDK headers that nothing off Windows can compile, so a mistake in
      # it should surface in seconds here rather than eleven minutes into the app
      # build. No system package: WASAPI ships with Windows.
      #
      # `--product wasapi-probe` on purpose, not a bare build. A SwiftPM library
      # target is compiled but never LINKED, so the first version of this step
      # passed while the shim referenced four GUID symbols that no import library
      # defined — and the app's link found them eleven minutes later. The probe
      # is an executable, so building it runs the linker. It is not executed:
      # this runner has no audio endpoint, so "no device" would fail a healthy
      # build.
      - name: WASAPIKit
        run: swift build --package-path Packages/WASAPIKit --product wasapi-probe

      # Same reasoning as WASAPIKit, more so: this is raw WinRT ABI against four
      # import libraries, built early and via its PROBE so the LINKER runs here
      # in seconds rather than eleven minutes into the app build.
      - name: WGCCaptureKit
        run: swift build --package-path Packages/WGCCaptureKit --product wgc-probe

      # Remote control: Win32 SendInput behind the portable `InputInjecting`
      # seam. Via its PROBE, so the LINKER runs — a library target is compiled
      # but never linked, which is how WASAPIKit's four missing GUID symbols
      # passed their own step and failed eleven minutes later in the app.
      #
      # Built, not RUN, unlike wasapi-probe. wasapi-probe's failure mode on a
      # runner is silence; this one moves a real cursor, and it takes
      # `--inject` before it will.
      - name: SendInputKit
        run: swift build --package-path Packages/SendInputKit --product sendinput-probe

      # There are no per-tier build steps after this any more — see the note
      # above the probes. The app build is now the first and only thing that
      # compiles the package graph on Windows, which is also what makes the
      # cache below worth as much as it is.
      #
      # swift-cross-ui's WinUIBackend targets the Windows App SDK through
      # CWinAppSDK. Resolving as its own step keeps a dependency-resolution
      # failure distinguishable from a compile failure — different fixes.
      # Two thirds of this job is compiling swift-cross-ui, swift-winui and the
      # WindowsAppSDK bindings — ~1,450 compile units against our one app file,
      # 14m20s of a 21m30s run. They change only when a pinned revision moves,
      # so the cache key is the manifests plus the toolchain: our own sources
      # changing does NOT invalidate it, and SwiftPM still recompiles the app
      # target because its inputs changed.
      #
      # The tension worth naming: this workflow's job is partly to prove things
      # build on Windows, and a warm .build weakens that. The key covers the
      # inputs that would make a stale object wrong (dependency revisions, Swift
      # version, runner OS), and the FFmpegKit job plus every Linux job still
      # build cold — so the cold-build signal survives where it matters, while
      # the expensive dependency compile stops being repeated for every one-line
      # workflow edit.
      #
      # No restore-keys on purpose: a partial hit here would mix objects built
      # against a different dependency revision, which is exactly the failure
      # mode that makes build caches untrustworthy.
      #
      # RESOLVE FIRST, so the key can be `Package.resolved` — which is precisely
      # the set of remote revisions and nothing else. The key used to hash every
      # manifest in the graph, ours included, and that was wrong in the
      # expensive direction: swift-cross-ui's objects do not depend on
      # TailscreenHubUI's manifest, but adding that package to the graph changed
      # the key and threw away fourteen minutes of third-party compile. A run
      # went from 14 minutes to 42 for a change that touched no remote
      # dependency at all.
      #
      # `Package.resolved` also closes the hole the old comment worried about
      # without anyone having to maintain a list: a local package bumping its
      # OWN remote dependency moves a pin, and a moved pin is a new key. Path
      # dependencies never appear in it, which is the whole point — editing our
      # own packages is now free.
      # Restore BEFORE resolve, which is the opposite of the original order and
      # is only possible because Apps/windows/Package.resolved is committed (see
      # the note in .gitignore). While it was ignored, the key's hashFiles input
      # did not exist at checkout, so resolve had to run first purely to
      # manufacture it — 61s of a warm job spent producing something that could
      # simply be read.
      - name: Restore the app's build directory
        id: app-build-cache
        uses: actions/cache/restore@v4
        with:
          path: Apps/windows/.build
          key: >-
            windows-app-build-${{ matrix.swift }}-${{ runner.os }}-${{
            hashFiles('Apps/windows/Package.resolved') }}

      # Now a no-op on the happy path: the restored .build carries the checkouts
      # and the pins already match. Kept as its own step because a resolution
      # failure and a compile failure want different fixes, which is why it was
      # separated in the first place.
      - name: Resolve the app's dependencies
        working-directory: Apps/windows
        run: swift package resolve

      # If resolve CHANGED the lockfile, stop.
      #
      # Both cache steps key on hashFiles('Apps/windows/Package.resolved'). A
      # rewrite here would mean the save key no longer matches the restore key,
      # so every run would miss, save under a fresh key, and miss again — a
      # cache that silently does nothing while looking healthy. That is a worse
      # failure than a red step, and it is exactly the "absence looks like
      # success" shape this workflow has already been burned by once.
      #
      # A stale lockfile is a real condition: it happens whenever a dependency
      # requirement in Package.swift moves without the pins being refreshed. The
      # fix is local and mechanical, so the message says it.
      - name: Check the lockfile is current
        shell: bash
        run: |
          if ! git diff --quiet -- Apps/windows/Package.resolved; then
            # Single quotes: backticks in a double-quoted bash string are command
            # substitution, so the prose spelling of the command would have RUN
            # the command.
            echo '::error::Apps/windows/Package.resolved is stale — swift package resolve rewrote it.'
            echo "The Windows build cache is keyed on this file, so a rewrite mid-job would"
            echo "split the restore and save keys and quietly disable the cache."
            echo ""
            echo "Fix locally, in Apps/windows:  swift package resolve && git add Package.resolved"
            echo ""
            git --no-pager diff -- Apps/windows/Package.resolved
            exit 1
          fi
          echo "lockfile unchanged by resolve — restore and save keys agree"

      # Built FROM the package directory, not with --package-path from the repo
      # root, because the manifest's `-L ../../Packages/TailscaleKit/lib` is
      # resolved by the linker against ITS working directory. On Linux that
      # relative flag is unused padding — libtailscale.pc supplies an absolute
      # path via PKG_CONFIG_PATH — but Windows has no pkg-config (the build log
      # says so: "couldn't find pc file for libtailscale"), which makes the
      # manifest flag the only thing pointing at the archive.
      #
      # The absolute /LIBPATH: is belt and braces on top, in the same form the
      # opus steps below already use.
      # The opus flags are here as well as on the tier steps below because from
      # W3 the app's dependency graph reaches them: TailscreenViewerTsnet →
      # TailscreenViewer → TailscreenAudio → OpusKit → COpus. Before W3 the app
      # depended only on TailscreenProtocol, which needs neither.
      # Stamp the commit into the binary.
      #
      # Without it, "the new counter isn't showing" and "you're running last
      # hour's exe" are the same observation, and telling them apart costs a
      # download and a test session each time. The footer names the commit and
      # the configuration, so the running app answers it.
      #
      # The grep is the point of the step, not decoration: a silently-failed
      # substitution ships a binary that CLAIMS to be a dev build, which is
      # worse than no stamp at all — and this workflow has already been bitten
      # twice by a skippable miss (the absent path filter, the un-staged
      # probe). Fail loudly instead.
      - name: Stamp the build
        shell: bash
        run: |
          set -euo pipefail
          file=Apps/windows/Sources/tailscreen-windows/BuildInfo.swift
          short=$(git rev-parse --short HEAD)
          sed -i "s/static let commit = \"dev\"/static let commit = \"$short\"/" "$file"
          grep -q "static let commit = \"$short\"" "$file" \
            || { echo "build stamp did not apply — refusing to ship an exe labelled 'dev'" >&2; exit 1; }
          echo "stamped $short"

      # RELEASE, not debug.
      #
      # A real share came back at 1.4 fps with the sharer pinning half a core,
      # while the viewer's stats showed 17 ms latency and zero loss — so the
      # network was innocent and the sharer was the bottleneck. The prime
      # suspect is the config: `BGRAToI420` is a scalar per-pixel loop over two
      # million pixels per frame, and a Swift debug build keeps bounds checks,
      # skips inlining and does no cross-module optimisation. That is an order
      # of magnitude on exactly this kind of code, and it applies equally to
      # the viewer's `I420Converter` blit.
      #
      # It costs one full rebuild (debug and release use separate .build
      # directories) and nothing after. The compile check is no weaker for it —
      # if anything release config catches more, which is why the mac side has
      # a `build-release` job at all.
      - name: Build the app
        shell: bash
        working-directory: Apps/windows
        run: |
          swift build -c release --product tailscreen-windows \
            -Xcc -I"$OPUS_ROOT/include/opus" \
            -Xcc -I"$FFMPEG_ROOT/include" \
            -Xlinker "/LIBPATH:$OPUS_ROOT/lib" \
            -Xlinker "/LIBPATH:$FFMPEG_ROOT/lib" \
            -Xlinker "/LIBPATH:$TAILSCALE_LIB"

      # A console tsnet bring-up, shipped in the artifact beside the app.
      #
      # The app cannot tell "libtailscale hangs on Windows" from "the app's
      # environment hangs it" — it carries WinUI, the Windows App SDK, a COM
      # apartment and swift-cross-ui's run loop, and cannot subtract any of
      # them. This links the same archive with none of that, so the two cases
      # give visibly different answers on the same machine.
      #
      # Built here rather than run: a CI runner has no tailnet to join, and the
      # question is what happens on the user's desktop.
      # Same link flags as the app minus FFmpeg. The probe imports only the
      # transport, but the transport depends on TailscreenViewer, which depends
      # on TailscreenAudio, which links libopus — so "it imports less" does not
      # mean "it links less", and the first version of this step failed on
      # `could not open 'opus.lib'`.
      - name: Build the tsnet probe
        shell: bash
        working-directory: Apps/windows
        run: |
          swift build -c release --product tsnet-probe \
            -Xcc -I"$OPUS_ROOT/include/opus" \
            -Xlinker "/LIBPATH:$OPUS_ROOT/lib" \
            -Xlinker "/LIBPATH:$TAILSCALE_LIB"

      # `if: always()` is the entire reason this is a separate save step rather
      # than `actions/cache`, whose post step is `post-if: success()` and so
      # saves NOTHING when a job fails.
      #
      # That default is exactly backwards for a build cache. A run that compiles
      # 1,450 units of swift-cross-ui, swift-winui and the WindowsAppSDK
      # bindings and then fails on one line of our own Swift has produced every
      # object worth keeping — and threw all of them away, so the next run,
      # carrying the one-line fix, paid the twenty-eight minutes over again.
      # That happened twice in one afternoon.
      #
      # Saving a build directory from a failed compile is safe: SwiftPM tracks
      # inputs per target, so a partial .build is simply fewer finished objects,
      # and the target that failed recompiles.
      #
      # The condition is `!cancelled()`, not `always()`, and it is guarded on
      # the restore step having run — both because **cache keys are immutable**.
      # A run cancelled at 20 % (this workflow has cancel-in-progress, so that
      # happens on every rapid push) would otherwise claim the key with a
      # fifth of a build directory that no later run could replace, and an
      # early failure would claim it with a `.build` that does not exist yet.
      # One poisoned key is worse than one cold build.
      - name: Save the app's build directory
        if: >-
          ${{ !cancelled() && steps.app-build-cache.outcome == 'success'
          && steps.app-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: Apps/windows/.build
          key: >-
            windows-app-build-${{ matrix.swift }}-${{ runner.os }}-${{
            hashFiles('Apps/windows/Package.resolved') }}

      # Stage the exe TOGETHER WITH THE SWIFT RUNTIME.
      #
      # Swift links its runtime dynamically on Windows, so a bare
      # tailscreen-windows.exe dies before `main` with
      #
      #   The code execution cannot proceed because swiftCore.dll was not found
      #
      # on any machine without a Swift toolchain installed — which is every
      # machine we would ask someone to test on. Uploading just the exe made the
      # artifact runnable only by people who didn't need it.
      #
      # Windows searches the executable's own directory first, so co-locating
      # the DLLs needs no PATH edit, no installer and no admin rights: unzip and
      # double-click.
      #
      # The runtime directory is discovered from PATH rather than hardcoded.
      # swift-driver is itself a Swift program, so if `swift build` ran at all
      # then a directory containing swiftCore.dll is necessarily on PATH — which
      # makes this independent of where the toolchain installer put things, a
      # layout that has already moved once (C:\Library → %LOCALAPPDATA%).
      #
      # The exe is staged into a flat dist/ rather than uploaded from .build
      # directly: a `Apps/windows/.build/**/tailscreen-windows.exe` pattern
      # matched nothing even though this very step's `find` located the file,
      # and an artifact upload is not worth debugging glob semantics over a
      # dot-directory. An explicit path can't be ambiguous.
      - name: Stage the app with its runtime
        shell: bash
        run: |
          set -euo pipefail

          # Scoped to the release directory, not just the name. The build
          # cache restores the whole .build tree, so a debug exe from before
          # the switch to release config can still be sitting there — and an
          # unscoped `head -1` would happily ship it, which is the one binary
          # this change exists to stop shipping.
          exe=$(find Apps/windows/.build -path '*/release/*' -name 'tailscreen-windows.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "no tailscreen-windows.exe produced" >&2
            exit 1
          fi
          ls -la "$exe"
          mkdir -p dist
          cp "$exe" dist/tailscreen-windows.exe

          # The diagnostic probe rides along: it shares every staged runtime DLL
          # with the app, so shipping it costs one file and saves the user a
          # second download when the app misbehaves.
          #
          # Located the same way as the app, and for the same reason the first
          # version of this was wrong: THIS STEP HAS NO `working-directory`, so
          # it runs at the repo root while the two build steps above run in
          # Apps/windows. A relative `.build/…` path therefore missed, and
          # because the miss was written as a skippable note the artifact
          # shipped without the probe and the job still went green — the same
          # shape of hole as a missing path filter. It is a hard failure now:
          # the build step above is unconditional, so if the exe is absent here
          # something is wrong with this step, not with the build.
          probe=$(find Apps/windows/.build -path '*/release/*' -name 'tsnet-probe.exe' | head -1)
          if [ -z "$probe" ]; then
            echo "no tsnet-probe.exe produced" >&2
            exit 1
          fi
          cp "$probe" dist/tsnet-probe.exe

          # The toolchain ships the runtime and the COMPILER in one bin
          # directory, so copying every DLL beside swiftCore.dll produced a
          # 1.1 GB artifact: liblldb (160 MB), sourcekitdInProc (150 MB),
          # _InternalSwiftScan (150 MB), libclang (84 MB) and all of SwiftPM's
          # own libraries, none of which an app loads. Hence an explicit list of
          # what a Swift program actually links against.
          #
          # A name list can go stale when a toolchain adds or renames a runtime
          # library — which is why the load check below is not optional. It is
          # what makes an allow-list safe: anything missing from this list shows
          # up as STATUS_DLL_NOT_FOUND on the runner, not on a tester's desktop.
          #
          # No bare `swift*.dll` glob: the compiler DLLs are `SwiftSyntax.dll`,
          # `SwiftParser.dll` and friends, and one case-insensitive match would
          # quietly put the 1.1 GB back.
          runtime_dlls=(
            swiftCore.dll swiftCRT.dll swiftWinSDK.dll swiftDispatch.dll
            swiftSynchronization.dll swiftObservation.dll swiftRegexBuilder.dll
            swiftSwiftOnoneSupport.dll swiftDistributed.dll
            'swift_*.dll'
            'Foundation*.dll' '_Foundation*.dll'
            dispatch.dll BlocksRuntime.dll
            'vcruntime140*.dll' 'msvcp140*.dll' concrt140.dll vccorlib140.dll
          )

          found=0
          while IFS= read -r d; do
            [ -d "$d" ] || continue
            if compgen -G "$d/swiftCore.dll" > /dev/null || compgen -G "$d/Foundation*.dll" > /dev/null; then
              echo "runtime dir: $d"
              for pattern in "${runtime_dlls[@]}"; do
                compgen -G "$d/$pattern" > /dev/null || continue
                cp -n "$d"/$pattern dist/ 2>/dev/null || true
              done
              found=$((found + 1))
            fi
          done < <(echo "$PATH" | tr ':' '\n')

          if [ "$found" -eq 0 ]; then
            echo "no Swift runtime directory found on PATH" >&2
            exit 1
          fi

          # SwiftPM RESOURCE BUNDLES — directories, and their structure is
          # load-bearing.
          #
          # swift-winui looks for the Windows App SDK bootstrapper at an exact
          # relative path beside the executable:
          #
          #   swift-winui_CWinAppSDK.resources\Microsoft.WindowsAppRuntime.Bootstrap.dll
          #
          # and when it isn't there it throws, which SwiftApplication.main turns
          # into fatalError("fatal"). A previous version of this step swept
          # `find .build -name '*.dll'` into a FLAT dist/, which put that DLL
          # (if it copied it at all) somewhere the lookup does not check — so
          # the app died at startup on every machine including the runner,
          # having loaded every library it needed. Copy the directories.
          exedir=$(dirname "$exe")
          shopt -s nullglob
          for bundle in "$exedir"/*.resources "$exedir"/*.bundle; do
            [ -d "$bundle" ] || continue
            echo "resource bundle: $(basename "$bundle")"
            cp -R "$bundle" dist/
          done
          shopt -u nullglob

          # If the Windows App Runtime is absent from the test machine, the
          # bootstrapper runs this installer when it sits beside the exe, rather
          # than popping a "go download it" dialog. Worth shipping: the whole
          # point of the artifact is that a tester needs nothing preinstalled.
          installer=$(find Apps/windows/.build -name 'WindowsAppRuntimeInstaller.exe' | head -1)
          if [ -n "$installer" ]; then
            echo "runtime installer: $installer"
            cp "$installer" dist/
          else
            echo "note: no WindowsAppRuntimeInstaller.exe in the build tree;" \
                 "a machine without the Windows App Runtime will be prompted to install it"
          fi

          # Any remaining loose DLLs in the build tree, after the bundles so a
          # flat copy can never stand in for a structured one.
          while IFS= read -r dll; do
            cp -n "$dll" dist/ 2>/dev/null || true
          done < <(find Apps/windows/.build -maxdepth 4 -name '*.dll')

          # libopus. vcpkg's x64-windows triplet builds SHARED libraries, so the
          # app links an import library and needs opus.dll at run time. It lives
          # in vcpkg's bin/, which is not on the PATH scan above (that only
          # walks directories holding Swift/Foundation DLLs). libtailscale needs
          # no equivalent — it is a static archive.
          opus_root="${OPUS_ROOT:-}"
          if [ -n "$opus_root" ] && [ -d "$opus_root/bin" ]; then
            cp -n "$opus_root"/bin/*.dll dist/ 2>/dev/null || true
            ls "$opus_root/bin/"
          else
            echo "note: no vcpkg opus bin/ — a shared libopus would be missing" >&2
          fi

          # libavcodec and friends, for the same reason: BtbN's is a SHARED
          # build, so the exe carries import libraries and needs the DLLs. The
          # architecture gate below checks these too, which is worth having —
          # this is a third-party archive, not something we compiled.
          ffmpeg_root=$(cygpath -u "${FFMPEG_ROOT:-}" 2>/dev/null || echo "${FFMPEG_ROOT:-}")
          if [ -n "$ffmpeg_root" ] && [ -d "$ffmpeg_root/bin" ]; then
            cp -n "$ffmpeg_root"/bin/*.dll dist/ 2>/dev/null || true
          else
            echo "note: no FFmpeg bin/ — video decode would fail at load" >&2
          fi

          if [ ! -f dist/swiftCore.dll ]; then
            echo "swiftCore.dll was not staged — the artifact would not run" >&2
            exit 1
          fi

          # Assert the exact path the app will look up, not an approximation of
          # it. This is the invariant whose violation produced a green build and
          # an app that quit instantly.
          if [ ! -f dist/swift-winui_CWinAppSDK.resources/Microsoft.WindowsAppRuntime.Bootstrap.dll ] \
             && [ ! -f dist/swift-winui_CWinAppSDK.bundle/Microsoft.WindowsAppRuntime.Bootstrap.dll ]; then
            echo "FAILED: the Windows App SDK bootstrapper is not at the path swift-winui looks up." >&2
            echo "The app would print 'Expected to find bootstrapper dll at one of ...' and abort." >&2
            find Apps/windows/.build -name 'Microsoft.WindowsAppRuntime.Bootstrap.dll' >&2 || true
            exit 1
          fi

          ls -la dist/
          du -sh dist/

      # Every staged binary must be the app's architecture.
      #
      # swift-winui carries BOTH arm64 and x86_64 copies of
      # Microsoft.WindowsAppRuntime.Bootstrap.dll in its source tree, and its
      # manifest picks between them with #if arch(...). The old flat sweep
      # ignored that: `find` yields arm64/ before x86_64/, and `cp -n` took the
      # first and then declined to overwrite it — so the artifact shipped an
      # ARM64 bootstrapper beside an x64 exe. An x64 process cannot load an
      # ARM64 DLL, so it failed with "Failed to load bootstrapper dll", which
      # reads like a missing-file problem and is not one. Reported from a
      # Windows-on-ARM VM, where PowerShell (itself ARM64) loaded the same DLL
      # happily — a detail that makes the mismatch easy to misread.
      #
      # Checking the whole directory rather than just that one DLL: the defect
      # was "a wrong-architecture file got staged", and nothing makes the
      # bootstrapper the only file that can happen to.
      - name: Check the staged binaries match the app's architecture
        shell: pwsh
        working-directory: dist
        run: |
          function Get-PEMachine($path) {
            $fs = [IO.File]::OpenRead($path)
            try {
              $br = [IO.BinaryReader]::new($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              return '{0:X4}' -f $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $want = Get-PEMachine 'tailscreen-windows.exe'
          Write-Host "app architecture: $want (8664 = x64, AA64 = ARM64)"
          $bad = @()
          Get-ChildItem -Recurse -File |
            Where-Object { $_.Extension -in '.dll', '.exe' } |
            ForEach-Object {
              $m = Get-PEMachine $_.FullName
              if ($m -ne $want) {
                $bad += "  $($_.FullName.Substring($PWD.Path.Length + 1)) is $m"
              }
            }
          if ($bad.Count -gt 0) {
            Write-Error ("architecture mismatch — these cannot load into a $want process:`n" + ($bad -join "`n"))
            exit 1
          }
          Write-Host "all staged binaries are $want"

      # Catch a missing DLL HERE rather than on a tester's desktop.
      #
      # A WinUI app can't run to completion on a headless runner, so this does
      # not assert success — it asserts the absence of two specific NTSTATUS
      # exit codes that mean the loader gave up before any of our code ran:
      #
      #   0xC0000135 STATUS_DLL_NOT_FOUND       — a DLL is missing
      #   0xC0000139 STATUS_ENTRYPOINT_NOT_FOUND — a DLL is the wrong version
      #
      # Every other outcome (including a headless-display failure, and including
      # a timeout, which means it got far enough to sit in an event loop) is
      # accepted. Narrow on purpose: this is a packaging check, not a UI test.
      #
      # 0xC000001D is called out separately because it is what a Swift trap
      # looks like on Windows — fatalError, a failed precondition and a nil
      # force-unwrap all emit `ud2`, which the OS reports as an illegal
      # instruction. That means the loader was satisfied and OUR code ran and
      # then rejected something, which is a completely different bug class from
      # a missing DLL and worth naming rather than lumping into "other". It does
      # not fail the build: a WinUI app with no interactive desktop session may
      # legitimately trap during backend init, and the runner cannot tell that
      # apart from a real defect. A human with a real desktop can.
      #
      # ExitCode is an Int32 and these statuses are negative when read as one.
      # `[uint32]` on a negative Int32 THROWS in PowerShell rather than
      # reinterpreting the bits, and `-band 0xFFFFFFFF` does NOT rescue it:
      # PowerShell types that literal as Int32 -1, so the mask is a no-op and
      # the value stays negative. Both mistakes were made here in turn.
      #
      # BitConverter reinterprets the four bytes with no dependency on how the
      # language types integer literals, which is the property that matters.
      #
      # The classification is wrapped because a bug in THIS step must not fail
      # the build: it can only legitimately fail for the two loader statuses,
      # and if the code can't be read then it can't be claimed to be either.
      - name: Check the app loads
        shell: pwsh
        working-directory: dist
        run: |
          # Capture both streams. A Swift trap prints "Fatal error: ..." on the
          # way down, and the first version of this step threw that away — which
          # turned "the app aborted" into an unanswerable question exactly when
          # linking tsnet made it start aborting. Written to RUNNER_TEMP rather
          # than dist/ so the capture files don't end up in the artifact.
          $out = Join-Path $env:RUNNER_TEMP 'app-stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'app-stderr.txt'
          $p = Start-Process -FilePath .\tailscreen-windows.exe -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err

          function Show-Output {
            foreach ($f in @($out, $err)) {
              if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
                Write-Host "--- $(Split-Path $f -Leaf) ---"
                Get-Content $f | ForEach-Object { Write-Host $_ }
              }
            }
          }

          if (-not $p.WaitForExit(20000)) {
            Write-Host "still running after 20s — the loader was satisfied"
            Stop-Process -Id $p.Id -Force
            Show-Output
            exit 0
          }
          Show-Output
          try {
            $code = [System.BitConverter]::ToUInt32([System.BitConverter]::GetBytes([int32]$p.ExitCode), 0)
          } catch {
            Write-Host "::warning::could not classify exit code '$($p.ExitCode)': $_"
            exit 0
          }
          $hex = '0x{0:X8}' -f $code
          Write-Host "exited with $hex"
          # Compared as STRINGS, not numbers. Every one of these constants is
          # above Int32.MaxValue, so PowerShell types the literal `0xC0000135`
          # as a NEGATIVE Int32, and `$code -eq 0xC0000135` — UInt32 against
          # that — is false no matter what the app did. The first version of
          # this check printed "exited with 0xC000001D" and then fell through to
          # the no-match branch, which is how the bug surfaced: the gate meant
          # to catch a missing DLL could never have fired.
          #
          # $hex comes straight from $code via a fixed format, so string
          # equality is exact, and it is immune to the literal-typing rules that
          # have now broken this step twice.
          if ($hex -eq '0xC0000135') {
            Write-Error "STATUS_DLL_NOT_FOUND — a required DLL is missing from dist/"
            exit 1
          }
          if ($hex -eq '0xC0000139') {
            Write-Error "STATUS_ENTRYPOINT_NOT_FOUND — a staged DLL is the wrong version"
            exit 1
          }
          # Both forms of "our own code decided to die" are named. A Swift trap
          # reaches the OS either as an illegal instruction (`ud2`) or through
          # __fastfail, and BOTH have been observed here from the same sources
          # on consecutive runs — 0xC000001D then 0xC0000409 — so neither is
          # the canonical one to test for.
          if ($hex -eq '0xC000001D' -or $hex -eq '0xC0000409') {
            Write-Host "::warning::Swift trap ($hex) — every DLL loaded, then the app aborted. SwiftApplication.main turns a failed Windows App SDK init into fatalError, so check the staged resource bundle and the runtime before suspecting the UI code."
            exit 0
          }
          Write-Host "no loader failure; $hex is this app's own business"

      # The whole point of the UI stage: a human runs this on a real desktop.
      # The artifact is the WHOLE directory now — an exe on its own is not a
      # thing anyone can run.
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: tailscreen-windows-swift${{ matrix.swift }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Does the Go c-archive come up on Windows AT ALL?
      #
      # The app freezes with two lines on stderr — "creating state dir" then
      # "creating tsnet node" — and nothing after, which puts the stall inside
      # `TailscaleNode.init` → `tailscale_new()`, the first call into the Go
      # archive. That was being investigated by asking the user to run the probe
      # on their desktop, which is a slow loop and, it turns out, an unnecessary
      # one: `tailscale_new()` allocates a server struct. It contacts nothing,
      # needs no tailnet and needs no desktop, so a headless runner can reach it
      # exactly as a user's machine does.
      #
      # So this asserts the probe gets PAST node creation, by looking for the
      # next line the transport logs. It deliberately does not wait for `up()` —
      # with no auth key that blocks on a browser login forever, and that is not
      # the step under suspicion. A timeout with only the first two lines
      # present is the reproduction; a third line means the archive is fine on
      # this machine and the difference is the user's environment.
      #
      # After the upload, like the tiers below it: a diagnostic must never cost
      # us the artifact a human is waiting to run.
      - name: Check tsnet node creation returns
        shell: pwsh
        working-directory: dist
        run: |
          $err = Join-Path $env:RUNNER_TEMP 'probe-stderr.txt'
          $out = Join-Path $env:RUNNER_TEMP 'probe-stdout.txt'
          # inittrace names the Go package if the stall is in runtime init.
          $env:GODEBUG = 'inittrace=1'
          $p = Start-Process -FilePath .\tsnet-probe.exe -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err

          # POLL for the marker instead of waiting for exit.
          #
          # The probe does not exit on the success path — it goes on to block in
          # up() waiting for a browser login that never comes — so
          # WaitForExit(90000) always burned the full 90 seconds, on every run,
          # including every green one. That was 7 % of this job spent watching a
          # process we had already learned everything from.
          #
          # The marker is what the step asserts on anyway, so appearing is the
          # real completion condition. 90s stays as the ceiling because node
          # creation is sub-second when it works, so anything near it is the
          # hang this step exists to catch — the timeout is unchanged, only the
          # success path got faster.
          $deadline = 90
          $found = $false
          for ($i = 0; $i -lt $deadline * 2; $i++) {
            $so_far = ''
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) { $so_far += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
            }
            if ($so_far -match 'subscribing to the IPN bus' -or $so_far -match 'calling up\(\)') {
              $found = $true
              Write-Host "marker seen after ~$([math]::Round($i / 2.0, 1))s"
              break
            }
            if ($p.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $p.HasExited) { $p.Kill() }
          $p.WaitForExit()

          foreach ($f in @($out, $err)) {
            if (Test-Path $f) {
              Write-Host "--- $(Split-Path -Leaf $f) ---"
              Get-Content $f | ForEach-Object { Write-Host $_ }
            }
          }

          $text = ''
          foreach ($f in @($out, $err)) {
            if (Test-Path $f) { $text += (Get-Content $f -Raw) }
          }

          if ($text -notmatch 'creating tsnet node') {
            Write-Host "::warning::probe never reached node creation — this step is not measuring what it claims"
            exit 0
          }
          # Any line the transport logs after `TailscaleNode.init` returns. The
          # no-auth-key path is the one the app takes and the one that hangs.
          if ($text -match 'subscribing to the IPN bus' -or $text -match 'calling up\(\)') {
            Write-Host "tailscale_new() returned — the Go archive initialises on Windows"
            exit 0
          }
          Write-Error "tsnet-probe stalled inside tailscale_new() — reproduces the app's freeze with no UI, no COM apartment and no WinUI in the process"
          exit 1

  # W4 gate: can a Swift program on Windows decode H.264 with libavcodec?
  #
  # This is the load-bearing question for the video stage, and it is worth
  # answering before any decoder code exists — if libavcodec can't be linked
  # here, the choice is Media Foundation and W4 looks completely different.
  #
  # Deliberately a SEPARATE job from `app`: it needs neither the submodule, the
  # Go toolchain, nor libtailscale, and keeping it independent means an FFmpeg
  # problem reads as an FFmpeg problem.
  ffmpeg:
    name: FFmpegKit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A PREBUILT FFmpeg rather than vcpkg. The vcpkg `ffmpeg` port builds from
      # source and would dominate this job's runtime for a dependency we only
      # need to link against; BtbN publishes ready-made Windows builds with
      # headers and MSVC import libraries.
      #
      # LGPL, not GPL, and that is a licensing decision rather than a
      # convenience one: Tailscreen is MIT, and linking a GPL FFmpeg build would
      # impose GPL on the whole app. The LGPL build has no libx264, so it cannot
      # ENCODE H.264 — which is exactly right for a viewer, and which FFmpegKit's
      # tests already handle by self-skipping the encode cases
      # (`FFmpeg.firstAvailableEncoder(...) != nil` guards).
      #
      # The version is pinned to 7.1 even though the build itself rolls: a fully
      # floating `master` asset would turn an upstream FFmpeg change into a
      # mystery failure here.
      - name: Download FFmpeg (LGPL shared, 7.1)
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$url"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"

          # The archive has one top-level directory whose name embeds the build
          # date, so discover it rather than reconstructing it.
          root=$(find "$RUNNER_TEMP/ffmpeg" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$root" ] || { echo "unexpected archive layout" >&2; exit 1; }
          ls "$root/include/libavcodec/avcodec.h" "$root/lib/avcodec.lib"

          native=$(cygpath -w "$root" 2>/dev/null || echo "$root")
          echo "FFMPEG_ROOT=$native" >> "$GITHUB_ENV"
          # The DLLs live in bin/ and are needed to RUN the tests, not to link.
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.1'

      # `swift test`, not `swift build`: linking proves the import libraries
      # resolve, but only running proves the DLLs load and that this build
      # actually carries an H.264 decoder (`testH264DecoderAvailable`). The
      # AVCC↔Annex-B conversion tests are pure Swift and run regardless — they
      # are the part the RTP path depends on most.
      - name: Test FFmpegKit
        shell: bash
        run: |
          swift test --package-path Packages/FFmpegKit \
            -Xcc -I"$FFMPEG_ROOT/include" \
            -Xlinker "/LIBPATH:$FFMPEG_ROOT/lib"

  # W8a — does the toolchain chain work on windows/arm64 AT ALL?
  #
  # Shaped like the W0 bridge spike deliberately: the smallest artifact that can
  # answer a toolchain question, with none of the app in it, so a failure names
  # the primitive rather than one of forty layers above it. Three things have to
  # hold at once and none of them is ours — the Swift Windows arm64 toolchain,
  # Go's `-buildmode=c-archive` for GOARCH=arm64 with cgo, and lld-link joining
  # them. If any fails, every downstream arm64 decision (dual-arch MSIX, a
  # second winget architecture) is moot, so it is worth knowing before planning
  # around it.
  #
  # Unlike W0 this needs no new directory and no throwaway code: `tsnet-probe`
  # already exists and already asserts the thing under suspicion. That was the
  # lesson of deleting the spike — the value was the answer, and the real build
  # subsumed the scaffold.
  #
  # NOT the app: no WinUI, no FFmpeg (the probe links neither), no staging. It
  # runs from .build/release with the toolchain's runtime on PATH, because the
  # question is "does the archive initialise on arm64", not "is the artifact
  # correctly staged" — that is W8's problem and it has its own assertion.
  #
  # continue-on-error while it is exploratory, following the same flip-to-
  # required convention as the `format` and diff-coverage jobs in build.yml. It
  # must be flipped the moment it goes green, because an exploratory job left
  # permissive forever is the "missing run reads as success" failure this
  # workflow's own history already paid for once.
  # ON DEMAND ONLY. It has produced its finding and is blocked on an upstream
  # toolchain bind (below), so running it on every push would add a permanently
  # red check for a reason nobody can act on from this repo. Re-run it with
  # `workflow_dispatch`, or by labelling a PR `run-arm64-probe`, when a new Swift
  # release or runner image makes it worth another look.
  #
  # THE BIND, measured over three runs, and the reason this is parked:
  #
  #   Swift 6.1.3   cgo/c-archive WORKS (55 MB)   WinSDK module BROKEN
  #   Swift 6.3.3   cgo/c-archive BROKEN          WinSDK never reached
  #
  # 6.1.3 builds the archive, then cannot build the `WinSDK` Swift module —
  # its bundled clang `arm64intr.h` and the image's Windows SDK 10.0.26100 both
  # define `_ARM64_BARRIER_ISH`, so the reference is ambiguous. Unworkaroundable
  # here: patch 025's POSIX shims import WinSDK.
  #
  # 6.3.3 fails earlier and more fundamentally:
  #
  #   clang: error: unsupported option '-mthreads' for target
  #          'aarch64-unknown-windows-msvc'
  #
  # That is not a version quirk. Go's cgo assumes a MinGW-flavoured driver on
  # Windows and passes MinGW flags like `-mthreads` unconditionally; Swift's
  # clang targets windows-MSVC and rejects them. 6.1.3's clang happened to
  # tolerate the flag, which is why it got further — not because it was the
  # right compiler.
  #
  # So the real fix is to stop using Swift's clang for cgo and supply an
  # aarch64 MinGW toolchain (llvm-mingw) for the archive, keeping the MSVC
  # toolchain for Swift. That is a genuine piece of work, not a retry, which is
  # why this is parked rather than iterated.
  arm64-probe:
    name: arm64 probe (on demand)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'run-arm64-probe')
    # GA for public repositories since Aug 2025, 4 vCPU, free — so this is a
    # NATIVE arm64 build, not a cross-compile. That removes the biggest unknown
    # from the list above: no sysroot to assemble, no --triple to get wrong.
    runs-on: windows-11-arm
    continue-on-error: true

    steps:
      - name: Allow symlinks in git
        run: git config --global core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same order as the app job, and for the same reason: patches BEFORE
      # materializing, or you copy pristine upstream and lose bridge_windows.go.
      - name: Apply the TailscaleKit patch series
        shell: bash
        working-directory: Packages/TailscaleKit
        run: |
          for p in Patches/*.patch; do
            echo "applying $(basename "$p")"
            patch -p1 -N -F0 -r - --no-backup-if-mismatch < "$p"
          done

      - name: Materialize symlinks
        shell: bash
        run: ./scripts/materialize-symlinks.sh --force

      # Swift comes BEFORE Go, which is the opposite of the app job's order and
      # is deliberate: the Swift toolchain ships the clang that cgo needs below.
      # The first version of this job installed Go first, and cgo picked up
      # whatever `gcc` was on PATH — an x86_64 one — which tried to assemble
      # runtime/cgo's ARM64 `gcc_arm64.S` and produced
      # `no such instruction: stp x29,x30`. `stp` is an ARM64 instruction, so
      # that error is an x86 assembler reading ARM64 assembly, not a bad file.
      # 6.1 deliberately, because it is the version that gets FURTHEST. Both
      # 6.1 and 6.3 were measured, and they fail at different points — see the
      # bind documented at the top of this job. Leaving the leg on 6.1 means
      # whoever picks this up resumes from the furthest known-good state instead
      # of re-deriving it.
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.1'

      # Prints the target triple, which is a finding in its own right: if the
      # action resolved an x86_64 toolchain on an arm64 host, everything below
      # would still build and would be answering a different question.
      - name: Swift version and target
        shell: bash
        run: |
          swift --version
          echo "--- target triple ---"
          swift -print-target-info | grep -i triple || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Version derived from the submodule's go.mod, not pinned here.
          #
          # That file says `go 1.25.5`, so a literal '1.21' provisioned a
          # toolchain Go then immediately replaced itself: the arm64 probe's log
          # showed `go: downloading go1.25.5 (windows/arm64)` mid-build, ~22s of
          # it. The pin was simultaneously a fiction and a download — every job
          # here paid for a toolchain it did not end up using.
          #
          # go.mod is now the single source of truth, so a submodule bump moves
          # CI with it instead of silently re-triggering the same download.
          go-version-file: Packages/TailscaleKit/upstream/libtailscale/go.mod
          # Explicit rather than relying on the action's default, and
          # paired with cache-dependency-path — without a path the
          # action looks for go.sum in the working directory, finds
          # none at the repo root, and caches nothing while appearing
          # configured. Three workflows here were in exactly that state.
          cache: true
          cache-dependency-path: Packages/TailscaleKit/upstream/libtailscale/go.sum

      # Which C compilers exist here, and what does each target BY DEFAULT?
      #
      # This is a step whose output is the point. cgo's compiler choice is
      # implicit (`gcc` on PATH unless CC says otherwise) and its failure mode is
      # an assembler error deep in runtime/cgo that names an instruction rather
      # than a compiler — so the inventory is what makes the next failure, if
      # there is one, readable in one pass instead of three.
      - name: Inventory C compilers
        id: cc
        shell: bash
        run: |
          pick=""
          for cc in clang aarch64-w64-mingw32-gcc gcc cc; do
            path=$(command -v "$cc" 2>/dev/null) || continue
            echo "--- $cc -> $path"
            "$cc" --version 2>&1 | head -2 || true
            machine=$("$cc" -dumpmachine 2>/dev/null || echo '?')
            echo "    -dumpmachine: $machine"
            case "$machine" in
              aarch64*|arm64*)
                if [ -z "$pick" ]; then pick="$cc"; native=1; fi ;;
            esac
          done

          # No compiler defaults to ARM64: fall back to clang with an explicit
          # target. clang's integrated assembler understands the GNU ARM64
          # syntax gcc_arm64.S is written in, which is the specific capability
          # missing above.
          if [ -z "$pick" ] && command -v clang >/dev/null 2>&1; then
            pick=clang
            native=0
          fi
          if [ -z "$pick" ]; then
            echo "no usable C compiler found — cgo cannot build for arm64" >&2
            exit 1
          fi

          echo "CGO_CC=$pick" >> "$GITHUB_ENV"
          if [ "${native:-0}" = "1" ]; then
            echo "chose $pick (natively targets arm64, no --target needed)"
            echo "CGO_TARGET_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "chose $pick with an explicit aarch64 target"
            echo "CGO_TARGET_FLAGS=--target=aarch64-unknown-windows-msvc" >> "$GITHUB_ENV"
          fi

      # GOARCH is explicit rather than inherited from the host, so this step
      # says what it builds even if it ever runs somewhere else.
      #
      # CC is explicit for the reason the inventory step above documents: left
      # implicit, cgo reaches for an x86_64 gcc and fails inside runtime/cgo.
      - name: Build libtailscale.a for windows/arm64
        shell: bash
        working-directory: Packages/TailscaleKit/upstream/libtailscale
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
        run: |
          export CC="$CGO_CC"
          export CGO_CFLAGS="$CGO_TARGET_FLAGS"
          export CGO_LDFLAGS="$CGO_TARGET_FLAGS"
          echo "CC=$CC  CGO_CFLAGS=$CGO_CFLAGS"
          go env CC CGO_ENABLED GOOS GOARCH
          go build -buildmode=c-archive -o libtailscale.a .
          ls -la libtailscale.a libtailscale.h

      # MSVC wants tailscale.lib (the module map says `link "tailscale"`), the
      # Unix convention is libtailscale.a. Stage both, exactly as the app job
      # does — a missing .lib here would read as an unrelated link failure.
      - name: Stage libtailscale for the linker
        shell: bash
        run: |
          lib=Packages/TailscaleKit/lib
          src=Packages/TailscaleKit/upstream/libtailscale/libtailscale.a
          mkdir -p "$lib"

          # rm FIRST. `$lib/libtailscale.a` is a SYMLINK whose target is exactly
          # $src, which materialize-symlinks.sh deliberately left alone earlier
          # (its target did not exist yet). Copying onto it therefore resolves to
          # copying the file over itself, and `cp` refuses:
          #
          #   cp: '.../upstream/libtailscale/libtailscale.a' and
          #       '.../lib/libtailscale.a' are the same file
          #
          # The app job has always done this; this job was written from a partial
          # reading of it and dropped the one line that mattered.
          rm -f "$lib/libtailscale.a" "$lib/tailscale.lib"
          cp "$src" "$lib/libtailscale.a"
          # Both names from the SOURCE, not lib/ → lib/, for the same reason.
          # The module map says `link "tailscale"`, so MSVC wants tailscale.lib.
          cp "$src" "$lib/tailscale.lib"

          native=$(cygpath -w "$lib" 2>/dev/null || echo "$lib")
          echo "TAILSCALE_LIB=$native" >> "$GITHUB_ENV"
          ls -la "$lib"

      # arm64-windows is the NATIVE triplet here, not a cross triplet.
      - name: Install libopus (vcpkg)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install opus:arm64-windows; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "vcpkg install opus failed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::vcpkg install opus failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          root="$VCPKG_INSTALLATION_ROOT/installed/arm64-windows"
          echo "OPUS_ROOT=$root" >> "$GITHUB_ENV"
          ls -la "$root/include/opus/opus.h"

      # libopus is here for the same non-obvious reason as in the app job: the
      # probe imports only the transport, but the transport depends on
      # TailscreenViewer → TailscreenAudio → OpusKit, so importing less does not
      # mean linking less.
      - name: Build the tsnet probe for arm64
        shell: bash
        working-directory: Apps/windows
        run: |
          swift build -c release --product tsnet-probe \
            -Xcc -I"$OPUS_ROOT/include/opus" \
            -Xlinker "/LIBPATH:$OPUS_ROOT/lib" \
            -Xlinker "/LIBPATH:$TAILSCALE_LIB"

      # Confirms the linker produced an ARM64 PE and not an x64 one — the same
      # machine-type check the app job runs on its staged binaries, and for the
      # same reason: an architecture mismatch here fails at load with a message
      # that reads like a missing file.
      - name: Check the probe is an ARM64 binary
        shell: pwsh
        working-directory: Apps/windows
        run: |
          $exe = Get-ChildItem -Recurse -Filter tsnet-probe.exe .build |
            Select-Object -First 1
          if (-not $exe) { Write-Error 'no tsnet-probe.exe produced'; exit 1 }
          Write-Host "probe: $($exe.FullName)"
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          $hex = '0x{0:X4}' -f $machine
          Write-Host "PE machine type: $hex (0xAA64 = ARM64, 0x8664 = x64)"
          if ($machine -ne 0xAA64) {
            Write-Error "probe is not ARM64 ($hex) — the toolchain targeted the wrong architecture, so a green build below would prove nothing"
            exit 1
          }
          "PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The actual question. Identical assertion to the x64 job's: does
      # tailscale_new() return, i.e. does patch 026's .CRT$XCU entry start the Go
      # runtime on arm64 too? That file already names _rt0_arm64_windows_lib
      # behind `#if defined(_M_ARM64)` with a hard #error for anything else, so
      # this either confirms that guard or shows it never fired.
      #
      # Deliberately does not wait for up(): with no auth key that blocks on a
      # browser login forever, and it is not the step under suspicion.
      - name: Check tsnet node creation returns on arm64
        shell: pwsh
        run: |
          $err = Join-Path $env:RUNNER_TEMP 'probe-stderr.txt'
          $out = Join-Path $env:RUNNER_TEMP 'probe-stdout.txt'
          $env:GODEBUG = 'inittrace=1'
          $p = Start-Process -FilePath $env:PROBE_EXE -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $exited = $p.WaitForExit(90000)
          if (-not $exited) { $p.Kill(); $p.WaitForExit() }

          $text = ''
          foreach ($f in @($out, $err)) {
            if (Test-Path $f) {
              Write-Host "--- $(Split-Path -Leaf $f) ---"
              Get-Content $f | ForEach-Object { Write-Host $_ }
              $text += (Get-Content $f -Raw)
            }
          }
          Write-Host "exit code: $($p.ExitCode)"

          if ($text -notmatch 'creating tsnet node') {
            Write-Error "probe never reached node creation on arm64 — the failure is before tailscale_new(), so read the output above rather than trusting this step's name"
            exit 1
          }
          if ($text -match 'subscribing to the IPN bus' -or $text -match 'calling up\(\)') {
            Write-Host 'tailscale_new() returned — the Go c-archive initialises on windows/arm64'
            exit 0
          }
          Write-Error 'tsnet-probe stalled inside tailscale_new() on arm64 — patch 026 starts the runtime on x64 but not here'
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## W8a — windows/arm64 probe"
            echo ""
            echo "Native build on a \`windows-11-arm\` runner. What this job answers:"
            echo ""
            echo "- Swift has a Windows arm64 toolchain and the action resolves it"
            echo "- Go builds the patched libtailscale c-archive for GOARCH=arm64 with cgo"
            echo "- lld-link joins them and produces an ARM64 PE"
            echo "- patch 026's \`_rt0_arm64_windows_lib\` entry starts the Go runtime"
            echo ""
            echo "Not answered here: the app itself (WinUI, FFmpeg, staging), and a"
            echo "live tailnet. FFmpeg does publish \`winarm64-lgpl-shared\`, so the"
            echo "video path has a supply route when the app follows."
          } >> "$GITHUB_STEP_SUMMARY"

  # W8b — does a PACKAGED Tailscreen install and start?
  #
  # Not the same question as "does an MSIX build". A packaged WinUI 3 app is
  # supposed to resolve its Windows App SDK dependency through the package
  # graph, while an unpackaged one calls the bootstrapper to find an installed
  # runtime — the mechanism behind two of the staging bugs this workflow already
  # carries assertions for. swift-winui initialises through the bootstrapper
  # either way, and whether that is correct, harmless or fatal inside a package
  # is not something the docs settle. So this installs it and launches it.
  #
  # `needs: app` and downloads that job's artifact rather than rebuilding: the
  # thing to package IS what the staging step already produced, and a second
  # 22-minute build to obtain it would be pure waste.
  #
  # A failure here is a finding. The verify script reports which of the three
  # stages broke — install, activate, or stay alive — because "MSIX didn't work"
  # is not an actionable answer and each stage has a different cause.
  #
  # Self-signed, so this proves INSTALLABILITY, not distributability. A cert
  # whose private key sits on FIPS 140-2 hardware is a separate W8 decision with
  # a cost attached (docs/viewer-windows-plan.md).
  #
  # A REAL GATE now, not exploratory — continue-on-error is deliberately absent.
  # What it gates is precise, and worth stating so nobody widens it by accident:
  #
  #   FATAL   MakeAppx pack, SignTool sign, Add-AppxPackage install, AUMID
  #           activation, and any loader-level exit (0xC0000135 DLL not found,
  #           0xC0000139 missing export). These are packaging defects and a
  #           headless runner can decide them.
  #   WARNED  A Swift trap after activation (0xC000001D / 0xC0000409). The
  #           loader was satisfied and our own code aborted, which on a runner
  #           with no interactive desktop session is indistinguishable from
  #           WinUI backend init legitimately trapping. The unpackaged
  #           `Check the app loads` step already tolerates the same codes for
  #           the same reason; failing here while accepting there would be an
  #           asymmetry with no justification behind it.
  #
  # So a red msix job means the PACKAGE is broken, not that the app did not
  # launch. The launch verdict needs a human on a real desktop and is tracked in
  # the plan doc's not-proven list, not here.
  msix:
    name: MSIX package
    needs: app
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    steps:
      # Only the packaging inputs are needed, not the submodule or the patch
      # series: the payload arrives prebuilt from `app`.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the staged app
        uses: actions/download-artifact@v4
        with:
          name: tailscreen-windows-swift6.1
          path: dist

      # The artifact is the staging step's output, so this is also a check that
      # the artifact a human downloads is complete enough to package.
      - name: Show what arrived
        shell: bash
        run: |
          echo "payload: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"
          ls -la dist/ | head -30
          test -f dist/tailscreen-windows.exe || {
            echo "artifact has no tailscreen-windows.exe" >&2; exit 1; }

      - name: Pack and sign the MSIX
        shell: pwsh
        run: |
          ./scripts/windows/make-msix.ps1 `
            -StageDir dist `
            -OutFile out/Tailscreen.msix `
            -Version 0.0.1.0

      # The actual finding. Install → activate by AUMID → does it stay up.
      - name: Install the MSIX and launch it
        shell: pwsh
        run: |
          ./scripts/windows/verify-msix.ps1 `
            -MsixPath $env:MSIX_PATH `
            -PfxPath $env:MSIX_PFX

      # Uploaded whether or not the launch succeeded: an MSIX that installs but
      # dies is exactly the artifact worth inspecting by hand, and a green-only
      # upload would withhold it precisely when it is most useful.
      - name: Upload the MSIX
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tailscreen-windows-msix
          path: out/*.msix
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## W8b — MSIX"
            echo ""
            echo "Packs the \`app\` job's staged artifact, signs it with a"
            echo "**self-signed** certificate, trusts that cert, installs the"
            echo "package and activates it by AUMID."
            echo ""
            echo "Proves installability, NOT distributability — a real cert needs"
            echo "its private key on FIPS 140-2 hardware (SignPath's free OSS"
            echo "tier, or a hardware token). That is a separate W8 decision."
            echo ""
            echo "Launching by AUMID rather than by exe path is deliberate:"
            echo "running the exe out of WindowsApps gives it NO package"
            echo "identity, so it would re-test the unpackaged path while"
            echo "appearing to test this one."
          } >> "$GITHUB_STEP_SUMMARY"
