name: Windows build

# Builds the Swift side of Tailscreen on Windows, on the way to a runnable WinUI
# app (docs/viewer-windows-plan.md, W2–W4). Not a merge gate yet — nothing on
# Windows ships.
#
# Matrixed over Swift versions because the runner image (win25-vs2026) ships a
# Windows SDK newer than older toolchains' module maps expect: Swift 6.0.3 fails
# with `could not build module 'ucrt'` before compiling a line of our code. The
# matrix answers "which toolchain works here" in one run instead of one per
# guess, and fail-fast is off so a bad version doesn't hide a good one.
#
# Steps deliberately do NOT use continue-on-error: a failing step should BE the
# error, with its compiler output attached, rather than something a later
# summary step reports second-hand.
#
# Path-scoped push trigger for the same reason as windows-spike.yml: a Windows
# runner shouldn't start for unrelated work, but a probe whose whole purpose is
# to produce an answer is useless if running it needs a label first.
on:
  push:
    paths:
      - 'Packages/TailscreenKit/**'
      - 'Apps/windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Swift ${{ matrix.swift }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        swift: ['6.1', '6.2']

    steps:
      # Windows checkouts don't create symlinks unless this is on and the
      # account may create them. TailscaleKit's Sources/ and include/ are
      # symlinks into the submodule, and without this they arrive as text files
      # containing their target path — which SwiftPM reports as an invalid
      # custom path, aborting the entire package graph before anything compiles.
      - name: Allow symlinks in git
        run: git config --global core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Belt and braces: core.symlinks only helps if the runner is also allowed
      # to create them. This makes real copies of any that came through as text.
      - name: Materialize symlinks
        shell: bash
        run: ./scripts/materialize-symlinks.sh --force

      - name: Setup Swift ${{ matrix.swift }}
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      # The load-bearing tier: Foundation + Synchronization only, no
      # dependencies. If this doesn't build, nothing above it can.
      - name: TailscreenProtocol
        run: swift build --package-path Packages/TailscreenKit --target TailscreenProtocol

      # The app is built BEFORE the remaining tiers on purpose. It depends only
      # on TailscreenProtocol, while TailscreenViewer/Sharer pull TailscreenAudio
      # → OpusKit → libopus, which isn't installed on Windows yet. Building them
      # first would block the app — and the runnable .exe — behind a dependency
      # the app never touches.
      #
      # swift-cross-ui's WinUIBackend targets the Windows App SDK through
      # CWinAppSDK. Resolving as its own step keeps a dependency-resolution
      # failure distinguishable from a compile failure — different fixes.
      - name: Resolve the app's dependencies
        run: swift package --package-path Apps/windows resolve

      - name: Build the app
        run: swift build --package-path Apps/windows --product tailscreen-windows

      # A GUI app can't run to completion headlessly, but proving the binary
      # exists and is a real PE executable is worth having.
      - name: Inspect the built binary
        shell: bash
        run: |
          exe=$(find Apps/windows/.build -name 'tailscreen-windows.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "no tailscreen-windows.exe produced" >&2
            exit 1
          fi
          ls -la "$exe"

      # The whole point of the UI stage: a human runs this on a real desktop.
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: tailscreen-windows-swift${{ matrix.swift }}
          path: Apps/windows/.build/**/tailscreen-windows.exe
          retention-days: 14
          if-no-files-found: error

      # Known-blocked probe, deliberately last and non-fatal: these tiers pull
      # TailscreenAudio → OpusKit → libopus, which needs vcpkg on Windows. They
      # run so their state is visible, but they must not fail a job whose
      # deliverable — a runnable app — is already built and uploaded above.
      - name: TailscreenViewer (needs libopus)
        continue-on-error: true
        run: swift build --package-path Packages/TailscreenKit --target TailscreenViewer

      - name: TailscreenSharer (needs libopus)
        continue-on-error: true
        run: swift build --package-path Packages/TailscreenKit --target TailscreenSharer
