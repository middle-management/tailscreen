name: Windows build

# The per-push Windows gate: build the app for both architectures, stage it,
# check it loads, check the Go c-archive initialises, and pack/install/launch
# an MSIX from each.
#
# The BUILD itself lives in app-windows.yml, shared with release-windows.yml —
# whose header used to say, accurately, that its steps were this workflow's
# "copied faithfully rather than reinvented". 545 lines of faithful copy is 545
# lines that can drift, and it had: the arm64 leg here never got the build
# stamp, so its artifacts shipped labelled "dev".
#
# What stays here is what this workflow IS rather than what it builds: the
# triggers, the concurrency rule, and which of the diagnostic tails each leg
# runs.
#
# Steps deliberately do NOT use continue-on-error: a failing step should BE the
# error, with its compiler output attached, rather than something a later
# summary step reports second-hand.
#
# The push trigger is path-scoped: a Windows runner shouldn't start for unrelated
# work, but a job whose whole purpose is to produce an answer is useless if
# running it needs a label first.
#
# EVERY package the Windows job builds from must be listed below, and the list
# had a hole: `Packages/WASAPIKit/**` was missing when W5 added it, so the commit
# that fixed the shim's STL error changed only files under that path and no
# Windows runner started. The branch then showed fourteen green checks while the
# last actual Windows result was a failure two commits earlier. TailscaleKit and
# OpusKit were missing for the same reason and had been all along — a patch-025
# change is exactly what this job exists to validate.
#
# The rule was originally written as "if a package is in the app's dependency
# graph, it belongs in both the trigger and the cache key" — and that phrasing is
# what let the hole happen a SECOND time. `packaging/windows/` and
# `scripts/windows/` are not packages and are not in any dependency graph; they
# are inputs to the MSIX packaging steps at the tail of the app jobs, and the
# rule as stated did not reach them.
#
# So, stated to cover what it actually needs to cover: IF A FILE IS AN INPUT TO
# ANY JOB IN THIS WORKFLOW, IT BELONGS IN THIS LIST. Packages, scripts,
# manifests, assets — and now the reusable workflow and the composite action
# that between them contain every build step this file used to spell out. Then
# separately check the cache key, which only cares about the subset that changes
# what gets compiled.
on:
  push:
    paths:
      - 'Packages/TailscreenKit/**'
      - 'Packages/TailscaleKit/**'
      - 'Packages/OpusKit/**'
      - 'Packages/FFmpegKit/**'
      - 'Packages/TailscreenVideoFFmpeg/**'
      - 'Packages/WASAPIKit/**'
      - 'Packages/WGCCaptureKit/**'
      - 'Packages/TailscreenSharerWGC/**'
      - 'Packages/SendInputKit/**'
      - 'Packages/WinOverlayKit/**'
      - 'Packages/TailscreenHubUI/**'
      - 'Apps/windows/**'
      - 'scripts/materialize-symlinks.sh'
      # The MSIX packaging steps' inputs. Missing at first, and the hole
      # reproduced the WASAPIKit one described above almost exactly: the commit fixing
      # make-msix.ps1's exit-code bug touched that script and a .md, so the
      # negation below removed the doc and nothing matched the script — no
      # Windows runner started, and the fix sat unverified while the branch
      # looked fine. Found only by going to read a run that did not exist.
      - 'packaging/windows/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-build.yml'
      # The build steps moved OUT of this file and into these two. Without
      # them listed, a change to the c-archive build, the staging, the cache
      # keys or the MSIX packing would no longer start a Windows runner — the
      # exact hole this list has already been burned by twice, reintroduced by
      # the refactor that was supposed to make it easier to maintain.
      - '.github/workflows/app-windows.yml'
      - '.github/actions/bootstrap/**'
      # Doc-only edits under those paths still don't warrant a 20-minute
      # Windows runner. Negative patterns are evaluated after the positive
      # ones, so this subtracts rather than replacing them.
      - '!**/*.md'
  pull_request:
    types: [labeled]
  workflow_dispatch:

# A newer push to the same branch cancels the older in-flight run, exactly as
# `build.yml` already does.
#
# Added after four Windows runs sat in the queue at once for four consecutive
# commits, three of them already superseded — at ~25 minutes each that is both
# a lot of runner time and, worse, a long delay before the run that actually
# matters gets an answer. A superseded Windows result teaches nothing: the
# branch tip is what ships.
concurrency:
  # The label name is part of the group because `pull_request: [labeled]`
  # fires once PER LABEL: adding two labels in one API call produced two runs
  # in the same group, and the second — which existed only to evaluate its
  # `if` and skip — cancelled the first mid-build. Pushes keep superseding
  # pushes (label.name is empty there, so they share the 'push' bucket).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Swift 6.3
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    uses: ./.github/workflows/app-windows.yml
    with:
      arch: x64
      # The probes build EXECUTABLES so the linker runs on WASAPIKit,
      # WGCCaptureKit and SendInputKit in seconds rather than eleven minutes
      # into the app build — see app-windows.yml. x64 only: they are a
      # per-push diagnostic and the runners are identical in what they link.
      run_probes: true
      # FATAL on a genuinely stale lockfile. x64 only because this is the leg
      # whose cache the whole repo depends on; the arm64 leg discards the same
      # SwiftPM 6.3 format churn without failing.
      lockfile_guard: true
      run_load_check: true
      run_tsnet_check: true
      msix: true
      verify_msix: true
    secrets: inherit

  # W4 gate: can a Swift program on Windows decode H.264 with libavcodec?
  #
  # This is the load-bearing question for the video stage, and it is worth
  # answering before any decoder code exists — if libavcodec can't be linked
  # here, the choice is Media Foundation and W4 looks completely different.
  #
  # Deliberately a SEPARATE job from `app`, and deliberately NOT routed through
  # app-windows.yml: it needs neither the submodule, the Go toolchain, nor
  # libtailscale, and keeping it independent means an FFmpeg problem reads as
  # an FFmpeg problem.
  ffmpeg:
    name: FFmpegKit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A PREBUILT FFmpeg rather than vcpkg. The vcpkg `ffmpeg` port builds from
      # source and would dominate this job's runtime for a dependency we only
      # need to link against; BtbN publishes ready-made Windows builds with
      # headers and MSVC import libraries.
      #
      # LGPL, not GPL, and that is a licensing decision rather than a
      # convenience one: Tailscreen is MIT, and linking a GPL FFmpeg build would
      # impose GPL on the whole app. The LGPL build has no libx264, so it cannot
      # ENCODE H.264 — which is exactly right for a viewer, and which FFmpegKit's
      # tests already handle by self-skipping the encode cases
      # (`FFmpeg.firstAvailableEncoder(...) != nil` guards).
      #
      # The version is pinned to 7.1 even though the build itself rolls: a fully
      # floating `master` asset would turn an upstream FFmpeg change into a
      # mystery failure here.
      - name: Download FFmpeg (LGPL shared, 7.1)
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" "$url"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"

          # The archive has one top-level directory whose name embeds the build
          # date, so discover it rather than reconstructing it.
          root=$(find "$RUNNER_TEMP/ffmpeg" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$root" ] || { echo "unexpected archive layout" >&2; exit 1; }
          ls "$root/include/libavcodec/avcodec.h" "$root/lib/avcodec.lib"

          native=$(cygpath -w "$root" 2>/dev/null || echo "$root")
          echo "FFMPEG_ROOT=$native" >> "$GITHUB_ENV"
          # The DLLs live in bin/ and are needed to RUN the tests, not to link.
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.1'

      # `swift test`, not `swift build`: linking proves the import libraries
      # resolve, but only running proves the DLLs load and that this build
      # actually carries an H.264 decoder (`testH264DecoderAvailable`). The
      # AVCC↔Annex-B conversion tests are pure Swift and run regardless — they
      # are the part the RTP path depends on most.
      - name: Test FFmpegKit
        shell: bash
        run: |
          swift test --package-path Packages/FFmpegKit \
            -Xcc -I"$FFMPEG_ROOT/include" \
            -Xlinker "/LIBPATH:$FFMPEG_ROOT/lib"

  # W8a — the toolchain chain on windows/arm64, and now the full app.
  #
  # Shaped like the W0 bridge spike originally: the smallest artifact that
  # could answer a toolchain question. Three things had to hold at once and
  # none of them is ours — the Swift Windows arm64 toolchain, Go's
  # `-buildmode=c-archive` for GOARCH=arm64 with cgo, and lld-link joining
  # them.
  #
  # THE BIND, measured over three runs, and why the fix is what it is:
  #
  #   Swift 6.1.3   cgo/c-archive WORKS (55 MB)   WinSDK module BROKEN
  #   Swift 6.3.3   cgo/c-archive BROKEN          WinSDK never reached
  #
  # 6.1.3 builds the archive, then cannot build the `WinSDK` Swift module — its
  # bundled clang `arm64intr.h` and the image's Windows SDK 10.0.26100 both
  # define `_ARM64_BARRIER_ISH`, so the reference is ambiguous. Unworkaroundable:
  # patch 025's POSIX shims import WinSDK.
  #
  # 6.3.3 fails earlier and more fundamentally:
  #
  #   clang: error: unsupported option '-mthreads' for target
  #          'aarch64-unknown-windows-msvc'
  #
  # That is not a version quirk. Go's cgo assumes a MinGW-flavoured driver on
  # Windows and passes MinGW flags like `-mthreads` unconditionally; Swift's
  # clang targets windows-MSVC and rejects them. 6.1.3's clang happened to
  # tolerate the flag, which is why it got further — not because it was the
  # right compiler.
  #
  # llvm-mingw supplies the aarch64 MinGW driver for the c-archive and leaves
  # Swift's MSVC toolchain to compile Swift; paired with 6.3, because each
  # version's blocker is what the other half addresses. That pairing now lives
  # in .github/actions/bootstrap, so it is one implementation rather than the
  # three it had grown into.
  #
  # A HARD GATE since the full pipeline went green on f7bab59 — build, staging,
  # arch check, upload, and the probe run (tailscale_new() returns on arm64)
  # all passed, per the flip-on-green convention.
  arm64-probe:
    name: app (arm64)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    uses: ./.github/workflows/app-windows.yml
    with:
      arch: arm64
      # No probes on this leg: what is under suspicion here is the toolchain
      # chain and the app, and the three probe packages link nothing
      # arm64-specific that the app does not.
      run_tsnet_check: true
      msix: true
      verify_msix: true
    secrets: inherit
