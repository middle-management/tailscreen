name: Windows build

# Builds the Swift side of Tailscreen on Windows, on the way to a runnable WinUI
# app (docs/viewer-windows-plan.md, W2–W4). Not a merge gate yet — nothing on
# Windows ships.
#
# Matrixed over Swift versions because the runner image (win25-vs2026) ships a
# Windows SDK newer than older toolchains' module maps expect: Swift 6.0.3 fails
# with `could not build module 'ucrt'` before compiling a line of our code. The
# matrix answers "which toolchain works here" in one run instead of one per
# guess, and fail-fast is off so a bad version doesn't hide a good one.
#
# Steps deliberately do NOT use continue-on-error: a failing step should BE the
# error, with its compiler output attached, rather than something a later
# summary step reports second-hand.
#
# Path-scoped push trigger for the same reason as windows-spike.yml: a Windows
# runner shouldn't start for unrelated work, but a probe whose whole purpose is
# to produce an answer is useless if running it needs a label first.
on:
  push:
    paths:
      - 'Packages/TailscreenKit/**'
      - 'Apps/windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Swift ${{ matrix.swift }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-windows-build'
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        swift: ['6.1', '6.2']

    steps:
      # Windows checkouts don't create symlinks unless this is on and the
      # account may create them. TailscaleKit's Sources/ and include/ are
      # symlinks into the submodule, and without this they arrive as text files
      # containing their target path — which SwiftPM reports as an invalid
      # custom path, aborting the entire package graph before anything compiles.
      - name: Allow symlinks in git
        run: git config --global core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The patch series MUST be applied before the symlinks are materialized:
      # the patches edit the submodule's Swift sources in place, and
      # materialize copies that directory. Copy first and you get pristine
      # upstream, whose `import Combine` is ungated and fails on Windows with
      # `no such module 'Combine'` — a portability error for code that is
      # already portable, just not yet patched.
      #
      # This is the Makefile's apply-patches loop inlined, because `make` isn't
      # on the Windows image. GNU `patch` is: Git for Windows ships it in
      # usr/bin, which is already on PATH. Compile-time only — no Go build is
      # needed for the header.
      - name: Apply the TailscaleKit patch series
        shell: bash
        working-directory: Packages/TailscaleKit
        run: |
          for p in Patches/*.patch; do
            echo "applying $(basename "$p")"
            patch -p1 -N -F0 -r - --no-backup-if-mismatch < "$p"
          done
          grep -n 'canImport(Combine)' Sources/TailscaleKit/IncomingConnection.swift \
            || { echo "patches did not take: Combine import still ungated" >&2; exit 1; }

      # Belt and braces: core.symlinks only helps if the runner is also allowed
      # to create them. This makes real copies of any that came through as text.
      - name: Materialize symlinks
        shell: bash
        run: ./scripts/materialize-symlinks.sh --force

      - name: Setup Swift ${{ matrix.swift }}
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      # libopus for the TailscreenAudio tier. vcpkg ships with the runner
      # image, so this is an install rather than a bootstrap.
      #
      # COpus is a systemLibrary with `pkgConfig: "opus"`, but Windows has no
      # pkg-config binary, so the header and library paths are passed
      # explicitly on the build lines below instead. Note the include path ends
      # in /opus: as COpus/shim.h documents, opus.pc's Cflags point *into* the
      # opus/ header dir, so the include is <opus.h>, not <opus/opus.h>.
      - name: Install libopus (vcpkg)
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install opus:x64-windows
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "OPUS_ROOT=$root" >> "$GITHUB_ENV"
          ls -la "$root/include/opus/opus.h"
          ls -la "$root/lib/"

      # The load-bearing tier: Foundation + Synchronization only, no
      # dependencies. If this doesn't build, nothing above it can.
      - name: TailscreenProtocol
        run: swift build --package-path Packages/TailscreenKit --target TailscreenProtocol

      # The app is built BEFORE the remaining tiers on purpose: it depends only
      # on TailscreenProtocol, so a failure in the heavier audio-bearing tiers
      # can't cost us the runnable .exe.
      #
      # swift-cross-ui's WinUIBackend targets the Windows App SDK through
      # CWinAppSDK. Resolving as its own step keeps a dependency-resolution
      # failure distinguishable from a compile failure — different fixes.
      - name: Resolve the app's dependencies
        run: swift package --package-path Apps/windows resolve

      # `-j 2` rather than the default (one job per core). Swift 6.2 died twice
      # partway through SwiftCrossUI's ~1280 files with exit code 1 and NO
      # diagnostic — the signature of a frontend killed rather than a source
      # error, and 6.1 compiles the same sources fine. Four parallel frontends
      # on a 4-core/16GB runner is a plausible memory squeeze, so this trades
      # build time for headroom.
      #
      # If 6.2 still dies here, the cause is not parallelism and this should be
      # reverted rather than lowered further.
      - name: Build the app
        run: swift build --package-path Apps/windows --product tailscreen-windows -j 2

      # A GUI app can't run to completion headlessly, but proving the binary
      # exists and is a real PE executable is worth having.
      #
      # The exe is staged into a flat dist/ rather than uploaded from .build
      # directly: a `Apps/windows/.build/**/tailscreen-windows.exe` pattern
      # matched nothing even though this very step's `find` located the file,
      # and an artifact upload is not worth debugging glob semantics over a
      # dot-directory. An explicit path can't be ambiguous.
      - name: Stage the built binary
        shell: bash
        run: |
          exe=$(find Apps/windows/.build -name 'tailscreen-windows.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "no tailscreen-windows.exe produced" >&2
            exit 1
          fi
          ls -la "$exe"
          mkdir -p dist
          cp "$exe" dist/tailscreen-windows.exe
          ls -la dist/

      # The whole point of the UI stage: a human runs this on a real desktop.
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: tailscreen-windows-swift${{ matrix.swift }}
          path: dist/tailscreen-windows.exe
          retention-days: 14
          if-no-files-found: error

      # The remaining tiers, which pull TailscreenAudio → OpusKit → libopus.
      # They stay AFTER the upload so a failure here can't cost us the app
      # artifact, but they are fatal: now that libopus is installed there's no
      # reason to tolerate a failure, and tolerating it would only reintroduce
      # the continue-on-error ambiguity that already misread a red run as green
      # earlier in this workflow's history.
      - name: TailscreenViewer
        shell: bash
        run: |
          swift build --package-path Packages/TailscreenKit --target TailscreenViewer \
            -Xcc -I"$OPUS_ROOT/include/opus" \
            -Xlinker "/LIBPATH:$OPUS_ROOT/lib"

      # TailscreenSharer pulls TailscaleKit's Swift wrapper, which needed
      # Windows implementations of the POSIX calls it makes — patch 025.
      - name: TailscreenSharer
        shell: bash
        run: |
          swift build --package-path Packages/TailscreenKit --target TailscreenSharer \
            -Xcc -I"$OPUS_ROOT/include/opus" \
            -Xlinker "/LIBPATH:$OPUS_ROOT/lib"
